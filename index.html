<style>
/* BAD brand: black, grey #969696, white; silver only for Member cards. Aktiv Grotesk + IvyPresto Display (stand-ins: Inter Tight, Instrument Serif).
   Layout: app shell. Phone: content + fixed bottom tab bar. Desktop: top bar with the same tabs. Icons lead, words support. */
:root{
  --black:#000;--grey:#969696;--white:#fff;
  --bg:#000000;--ink:#FFFFFF;--muted:#969696;--line:#222222;--soft:#0E0E0E;--rule:#5A5A5A;--chip:#161616;
  color-scheme:dark;
  --f-sans:"Aktiv Grotesk","Inter Tight","Helvetica Neue",Arial,sans-serif;
  --f-serif:"IvyPresto Display","Instrument Serif","Didot","Bodoni 72",Georgia,serif;
  --r:12px;--tab:64px;
}
/* Inverted on request: BAD is white on black for every viewer, whatever their device theme. */
*{box-sizing:border-box}
[hidden]{display:none!important}
body:has(.selbar) .toast{bottom:calc(var(--tab) + 120px + env(safe-area-inset-bottom,0px))}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tab) + 32px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
h2{font-family:var(--f-serif);font-size:2.2rem;line-height:1.02;letter-spacing:-.01em}
h3{font-size:1rem;font-weight:700}
p{margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.label{font-size:.68rem;text-transform:uppercase;letter-spacing:.16em;font-weight:600;color:var(--muted)}
.fine{font-size:.74rem;color:var(--muted);line-height:1.45}
.num{font-variant-numeric:tabular-nums}

/* Top bar + tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wordmark{display:flex;align-items:center;gap:10px;min-width:0}
.wordmark b{font-size:1.6rem;font-weight:800;letter-spacing:.16em;line-height:1}
.wordmark img{height:26px;width:auto;display:block}
.wordmark .logo-l,.inline-logo.logo-l{display:none}.wordmark .logo-d{display:block}.inline-logo.logo-d{display:inline-block}
.inline-logo{height:.72em;width:auto;display:inline-block;vertical-align:baseline;margin-left:.18em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wordmark .logo-l,:root:not([data-theme="light"]) .inline-logo.logo-l{display:none}:root:not([data-theme="light"]) .wordmark .logo-d{display:block}:root:not([data-theme="light"]) .inline-logo.logo-d{display:inline-block}}
:root[data-theme="dark"] .wordmark .logo-l,:root[data-theme="dark"] .inline-logo.logo-l{display:none}:root[data-theme="dark"] .wordmark .logo-d{display:block}:root[data-theme="dark"] .inline-logo.logo-d{display:inline-block}
.wordmark span{font-size:.62rem;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;color:var(--muted);font-size:.8rem;font-weight:600}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
@media (max-width:760px){
  .top .tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabs button{flex-direction:column;gap:2px;font-size:.62rem;padding:6px 8px;border-radius:12px;min-width:56px}
  .tabs button[aria-current="page"]{background:var(--chip);color:var(--ink)}
  .tabs button svg.i{width:22px;height:22px}
}
@media (min-width:761px){.wrap{padding-bottom:48px}}

.view{display:grid;gap:28px}
.grid2{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr);gap:24px}}
.sec{display:grid;gap:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tile{background:var(--soft);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{display:grid;gap:2px}.stat b{font-family:var(--f-serif);font-weight:400;font-size:2.2rem;line-height:1}
.ic-row{display:flex;align-items:center;gap:10px}
.ic-bub{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.ic-bub.soft{background:var(--chip);color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);border-radius:999px;padding:12px 20px;font-size:.8rem;font-weight:700;letter-spacing:.06em;background:var(--ink);color:var(--bg);min-height:44px}
.btn.ghost{background:none;color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:.74rem;min-height:36px}
.btn.wide{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{font-size:.85rem;color:var(--muted)}
.empty{padding:24px;color:var(--muted);text-align:center;background:var(--soft);border-radius:var(--r);display:grid;gap:8px;justify-items:center}
.note{background:var(--soft);border-radius:var(--r);padding:14px 16px;font-size:.92rem;display:flex;gap:12px;align-items:flex-start}
.tagl{display:inline-flex;align-items:center;gap:6px;font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tagl.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Sport chips */
.sports{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.sports::-webkit-scrollbar{display:none}
.sp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px 8px 10px;font-size:.82rem;font-weight:600;white-space:nowrap}
.sp[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- Player card: minimal ---------- */
.pc{--bgc:#000;--fg:#fff;--dim:#969696;width:100%;max-width:340px;aspect-ratio:5/7;border-radius:18px;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:20px 22px;background:var(--bgc);color:var(--fg);box-shadow:0 0 0 1px #969696,0 24px 48px -28px rgba(0,0,0,.6)}
.pc.offcourt{--bgc:#fff;--fg:#000;--dim:#6E6E6E}
.pc.courtside{--bgc:#969696;--fg:#000;--dim:#2A2A2A}
.pc.member{--fg:#000;--dim:#404040;background:linear-gradient(135deg,#F4F4F4 0%,#BDBDBD 35%,#ECECEC 52%,#A6A6A6 78%,#DADADA 100%)}
.pc.legend{--bgc:#050505;--fg:#fff;--dim:#9A9A9A;background:linear-gradient(135deg,#1C1C1C 0%,#050505 38%,#262626 54%,#050505 72%,#141414 100%);box-shadow:0 0 0 1px #3A3A3A,inset 0 0 0 1px rgba(255,255,255,.06),0 24px 48px -28px rgba(0,0,0,.6)}
.pc .ph{position:absolute;inset:0 0 38% 0;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.05)}
.pc .ph.placeholder{opacity:.85}
.pc .ph::before{content:"";position:absolute;inset:0 0 auto 0;height:34%;background:linear-gradient(180deg,var(--bgc) 0%,transparent 100%);opacity:.85;z-index:1}
.pc.member .ph::before{background:linear-gradient(180deg,#E6E6E6 0%,transparent 100%)}
.pc .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,var(--bgc) 100%)}
.pc.member .ph::after{background:linear-gradient(180deg,transparent 35%,#C8C8C8 100%)}
.pc>*{position:relative}
.pc .hd{display:flex;justify-content:space-between;align-items:flex-start;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.pc .hd span:last-child{text-align:right}
.pc .hd img{height:15px;width:auto;display:block;margin-bottom:6px}
.pc .jn{font-family:var(--f-serif);font-size:9rem;line-height:.82;margin-top:auto;letter-spacing:-.03em}
.pc .nick{font-size:1.45rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;margin-top:8px;overflow-wrap:anywhere}
.pc .style{font-family:var(--f-serif);font-style:italic;font-size:1.15rem;display:flex;align-items:center;gap:6px}
.pc .style svg.i{width:16px;height:16px}
.pc .stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid currentColor;margin-top:12px;padding-top:8px;gap:6px}
.pc .stats.s4{grid-template-columns:repeat(4,minmax(0,1fr))}
.pc .stats div{font-size:.52rem;text-transform:uppercase;letter-spacing:.16em;color:var(--dim)}
.pc .stats b{display:block;font-size:.95rem;color:var(--fg);letter-spacing:0;font-weight:600;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .ft{display:flex;justify-content:space-between;align-items:center;font-size:.52rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:10px}
.pc .ft .sps{display:flex;gap:4px}.pc .ft .sps svg.i{width:13px;height:13px}
@media (prefers-reduced-motion:no-preference){.pc{transition:transform .3s ease}.pc:hover{transform:translateY(-3px)}}

/* Lists */
.list{display:grid}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .nm{font-weight:600;overflow-wrap:anywhere}
.li .sub{font-size:.82rem;color:var(--muted)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-serif);font-size:1.2rem;border:1px solid var(--grey);overflow:hidden;background:#000;color:#fff;flex:none}
.av img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.av.offcourt{background:#fff;color:#000}.av.courtside{background:#969696;color:#000}
.av.none{background:none;color:var(--muted);border-style:dashed}
.rank{font-family:var(--f-serif);font-size:1.3rem;color:var(--muted);width:2ch;text-align:right}

/* Sessions */
.sess{background:var(--soft);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px}
.sess .dt{width:62px;border-radius:10px;background:var(--bg);display:grid;justify-items:center;padding:8px 0 10px;align-content:start}
.sess .dt small{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.sess .dt b{font-family:var(--f-serif);font-weight:400;font-size:2.2rem;line-height:1}
.sess .bd{display:grid;gap:10px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:5px}.meta svg.i{width:15px;height:15px}
.cap{height:4px;border-radius:9px;background:var(--line);position:relative;overflow:hidden}.cap i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:9px}
.faces{display:flex;flex-wrap:wrap}
.faces .av{width:30px;height:30px;font-size:.85rem;margin-right:-6px;border:2px solid var(--soft)}
.confirm{border:1.5px solid var(--ink);border-radius:var(--r);padding:14px;display:grid;gap:10px;background:var(--bg)}

/* Club feed */
.post{border-radius:var(--r);background:var(--soft);padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px}
.post h3{font-family:var(--f-serif);font-weight:400;font-size:1.6rem;line-height:1.1}

/* Forms */
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--ink)}
.field{display:grid;gap:8px;margin-bottom:18px}
.field label,.field .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;font-weight:700}
.req{color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none}
.inp{display:flex;align-items:center;gap:10px;border:1px solid var(--rule);border-radius:var(--r);padding:0 12px;background:var(--bg)}
.inp svg.i{color:var(--muted)}
.inp input{border:0!important;padding:12px 0!important;outline:none}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=search],input[type=url],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:var(--r);padding:12px;width:100%}
textarea{resize:vertical;min-height:80px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:none;color:var(--ink);border-radius:999px;padding:9px 15px;font-weight:500;text-align:left}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opts{display:grid;gap:8px}.opts .chip{border-radius:var(--r);padding:14px 16px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.pick button{display:grid;justify-items:center;gap:6px;border:1px solid var(--rule);border-radius:var(--r);background:none;padding:14px 8px;font-size:.78rem;font-weight:600;text-align:center}
.pick button svg.i{width:28px;height:28px}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.editions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.editions button{border:1px solid var(--rule);border-radius:12px;padding:0;background:none;text-align:left;overflow:hidden}
.editions button i{display:block;aspect-ratio:5/3;border-bottom:1px solid #969696}
.editions button span{display:block;padding:8px 10px 2px;font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.editions button small{display:block;font-size:.72rem;color:var(--muted);padding:0 10px 10px}
.editions button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.photo{display:flex;gap:14px;align-items:center}
.photo .pv{width:84px;height:84px;border-radius:50%;border:1px dashed var(--rule);overflow:hidden;display:grid;place-items:center;color:var(--muted);flex:none}
.photo .pv img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
input[type=range]{width:100%;accent-color:var(--ink)}
.result{background:var(--soft);border-radius:var(--r);padding:16px;display:grid;gap:6px}
.result b.big{font-family:var(--f-serif);font-weight:400;font-size:2.2rem;line-height:1}
.score{display:flex;align-items:baseline;gap:10px;font-family:var(--f-serif)}
.score b{font-weight:400;font-size:4rem;line-height:.9}.score span{font-size:1.5rem;color:var(--muted)}
.bar{height:4px;border-radius:9px;background:var(--line);position:relative;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:9px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.75rem;word-break:break-all;background:var(--soft);border-radius:var(--r);padding:10px;max-height:120px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;font-size:.85rem;z-index:20;max-width:calc(100% - 32px)}
.hero{display:grid;gap:12px}.hero h2{font-size:clamp(2.4rem,7vw,3.6rem)}
/* Courts */
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.court{background:var(--soft);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.court-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.court-body{border:1.5px solid var(--ink);border-radius:6px;padding:12px 8px;display:grid;grid-template-rows:auto auto auto;gap:6px;background:var(--bg);position:relative}
.court-body::before,.court-body::after{content:none}
.court-body::before{top:30%}.court-body::after{bottom:30%}
.court-body.volleyball::before,.court-body.volleyball::after{left:0;right:0}
.half{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 2px;min-height:64px;align-content:center;position:relative;z-index:1}
.net{position:relative;border-top:2.5px solid var(--ink);margin:4px -8px;z-index:1}
.net span{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--bg);padding:0 8px;font-size:.58rem;letter-spacing:.24em;font-weight:700}
.pl{position:relative;display:grid;justify-items:center;gap:2px;width:60px;padding:4px 0;border:0;background:none;text-align:center;border-radius:10px}
.pl .av{width:42px;height:42px;font-size:1.05rem}
.pl .pn{font-size:.72rem;font-weight:600;line-height:1.15;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .fine{font-size:.6rem}
.slot{width:42px;height:42px;border-radius:50%;border:1.5px dashed var(--rule);display:grid;place-items:center;color:var(--muted)}
.pl.sel .av,.pl.sel .slot{outline:3px solid var(--ink);outline-offset:2px}
.pl.me .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.qn{position:absolute;top:0;left:6px;z-index:2;background:var(--ink);color:var(--bg);font-size:.6rem;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stepper button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:10px}
.stepper button b{display:block;font-size:.85rem}
.stepper button[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stepper button[aria-current="step"] .fine{color:inherit;opacity:.7}
.stepper button[aria-current="step"] .qn{background:var(--bg);color:var(--ink)}
@media (max-width:560px){.stepper .fine{display:none}.stepper button{flex-direction:column;align-items:flex-start;padding:8px 10px;gap:4px}.stepper button b{font-size:.78rem;white-space:nowrap}}
.waits{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.wait{border:1.5px dashed var(--rule);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px}
.mini{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px}
.mini .half{min-height:0;gap:2px}
.mini .vs{font-family:var(--f-serif);font-style:italic;color:var(--muted)}
.court-body{color:var(--ink)}

  window.badSignOut=()=>auth.signOut().then(()=>{location.hash='';location.reload()});

  const userApi={
    id:async()=>(await userReady).uid,
    isOwner:async()=>(await userReady).admin,
    canEdit:async()=>(await userReady).admin,
    can:async()=>null,
    me:async()=>{const u=await userReady;return{id:u.uid,name:u.name,email:u.email,avatarUrl:'',color:'#969696',isOwner:u.admin,canEdit:u.admin}},
    email:async()=>(await userReady).email
  };

    await userReady;
    if(name==='db')return fs;

  }};

async function claimRef(uid,base){const db=S.db;if(!db||!db.runTransaction)return base;
  for(let i=0;i<27;i++){const c=i?base+String.fromCharCode(64+i):base,ref=db.doc('refcodes/'+normCode(c));

    catch(e){if(e&&e.message==='taken')continue;console.warn('refcode claim',e);return base}}
  return base+'-'+String(Date.now()).slice(-4)}

/* ---------- photo: always black and white ---------- */
function bwFromImg(img){const s=360,c=document.createElement('canvas');c.width=s;c.height=s;const x=c.getContext('2d');
  const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
  const d=x.getImageData(0,0,s,s),a=d.data;for(let i=0;i<a.length;i+=4){let y=.299*a[i]+.587*a[i+1]+.114*a[i+2];y=Math.max(0,Math.min(255,(y-128)*1.12+128));a[i]=a[i+1]=a[i+2]=y}
  x.putImageData(d,0,0);return c.toDataURL('image/jpeg',.72)}
function toBW(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{try{res(bwFromImg(img))}catch(e){rej(e)}};img.src=r.result};r.readAsDataURL(file)})}
/* full black-and-white source (keeps shape) for the cropper */
function bwSource(img,max=1100){const k=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  const d=x.getImageData(0,0,w,h),a=d.data;for(let i=0;i<a.length;i+=4){let y=.299*a[i]+.587*a[i+1]+.114*a[i+2];y=Math.max(0,Math.min(255,(y-128)*1.12+128));a[i]=a[i+1]=a[i+2]=y}x.putImageData(d,0,0);return c.toDataURL('image/jpeg',.85)}
function loadImg(src,cors){return new Promise((res,rej)=>{const i=new Image();if(cors)i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=src})}
/* account photo (e.g. Google) turned black and white; quietly skipped if the browser won't allow it */
function toBWUrl(url){return new Promise(res=>{if(!url)return res('');const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{try{res(bwSource(img))}catch(_){res('')}};img.onerror=()=>res('');img.src=url.replace(/=s\d+-c$/,'=s400-c')})}

  return{kind:'none',code:c}}

/* ---------- Points and BADges ----------
   The numbers live on the "Points Settings" tab of BAD APP – Master. The Apps Script copies them into
   config/points every 15 minutes, together with each player's row from "Points Balance" (config/sheetPoints).
   New BADges and points entries given in the app show straight away and are added to the sheet on the next sync. */
const PTS_FALLBACK={per:5,free:100,expire:180,launch:'2026-11-05',other:{'Event or tournament':10,'BAD Retreat':20,'No-show':-4,'Free session redeemed':-100,'Adjustment':0},
  levels:[{k:'Rookie',at:0,d:'Player card, earn points, join any session'},{k:'Regular',at:3,d:'Sign-ups open to you 24 hours early'},{k:'Core',at:10,d:'Sign-ups open to you 48 hours early, 5% off merch, a vote on new sessions and events'},{k:'Legend',at:25,d:'10% off merch, first pick of limited merch drops, invites to members-only events, first spots for BAD Retreat'}],
  top:{k:'',d:'Reserved for the founders of BAD. Every perk, always.'},
  reasons:[{k:'Crew help',n:'1',eg:'Set up courts, ran the queue, took photos, packed up'},{k:'Brought a new player',n:'1',eg:'Their friend joined and played a paid session'},{k:'4 weeks in a row',n:'1',eg:'Never missed their session for a month'},{k:'Completed their player card',n:'1',eg:'Photo, number and sports all filled in'},{k:'Tried a new department',n:'1',eg:'First time at VolleyBAD, BAD DINK, BAD PACE or another department'},{k:'Above and beyond',n:'1 to 5',eg:'Anything that shows the BAD spirit'}]};
const LEDGER_TYPES=['Event or tournament','BAD Retreat','No-show','Free session redeemed','Adjustment'];
/* "180 days" reads better as "6 months" */
const expWords=d=>{d=+d||0;return d%365===0?(d===365?'a year':d/365+' years'):d%30===0||d===180?(d===180?'6 months':Math.round(d/30)+' months'):d+' days'};
/* how many sessions (or Side Quests, which count as events) make a free session */
const toFree=()=>{const c=PS(),ev=+c.other['Event or tournament']||0;return{sessions:Math.ceil(c.free/(+c.per||5)),quests:ev?Math.ceil(c.free/ev):0}};
function PS(){const c=S.ptsCfg||{};return{...PTS_FALLBACK,...c,other:{...PTS_FALLBACK.other,...(c.other||{})},levels:(c.levels&&c.levels.length?c.levels:PTS_FALLBACK.levels).map(l=>l&&l.k==='Member'?{...l,k:'Regular'}:l),top:{...PTS_FALLBACK.top,...(c.top||{})},reasons:(c.reasons&&c.reasons.length?c.reasons:PTS_FALLBACK.reasons)}}

const canGiveBadge=()=>{if(!S.uid)return false;const m=memStatus(S.uid);return (m.state==='verified'&&staffTypes.includes(m.type))||(S.canEdit&&!!myRole())};
/* founders give BADges freely; everyone else (community managers, crew) has a monthly allowance, also checked by the server */
const BADGE_MONTH=5;
const badgeFree=()=>!!S.uid&&(isFounder(S.uid)||['owner','founder'].includes(myRole()));
const monthKey=()=>new Date().toISOString().slice(0,7);
const badgeLeft=()=>badgeFree()?Infinity:Math.max(0,BADGE_MONTH-((S.badgeQ&&S.badgeQ.m===monthKey())?S.badgeQ.n:0));
async function loadBadgeQ(){if(!S.db||!S.uid||badgeFree())return;const m=monthKey();try{const d=await S.db.doc(`badgeq/${S.uid}_${m}`).get();S.badgeQ={m,n:d.exists?(d.data().n||0):0}}catch(_){S.badgeQ={m,n:0}}}
const addDays=(iso,d)=>{const t=new Date(String(iso).slice(0,10)+'T12:00:00');t.setDate(t.getDate()+d);return t.toISOString().slice(0,10)};
const todayIso=()=>new Date(Date.now()+4*36e5).toISOString().slice(0,10);
/* everything a player sees about their points and BADges */
function pointsFor(uid){const c=PS(),row=sheetRow(uid)||{},launch=c.launch||'',started=!!launch&&todayIso()>=launch;
  const fresh=myEntries(uid).filter(e=>!e.synced&&(!launch||(e.date||'')>=launch)),freshPts=fresh.reduce((t,e)=>t+(Number(e.pts)||0),0);
  let last=[row.last,...fresh.map(e=>e.date)].filter(Boolean).sort().pop()||'';
  let balance=started?Math.max(0,(Number(row.balance)||0)+freshPts):0;

  const bdg=badgeCount(uid);
  const lv=levelFor(uid,bdg),appUnpaid=typeof pendingFor==='function'?pendingFor(uid).filter(r=>sessStart(S.sessions[r.sid])<Date.now()).reduce((t,r)=>t+r.amount,0):0,sheetUnpaid=Number(row.unpaid)||0;
  return{balance,started,launch,last,playBy,free:c.free,per:c.per,canRedeem:started&&balance>=c.free,sessions:Number(row.sessions)||0,
    badges:bdg,level:lv.k,levelIdx:lv.i,next:lv.next,toNext:lv.next?lv.next.at-bdg:0,top:lv.top,unpaid:appUnpaid+sheetUnpaid,appUnpaid,sheetUnpaid}}
function levelFor(uid,n){const L=PS().levels;if(uid&&isFounder(uid))return{k:topName(),i:L.length,top:true,next:null};let i=0;L.forEach((l,j)=>{if(n>=(Number(l.at)||0))i=j});/* the first 100 start one level up */if(isFirst100(uid))i=Math.min(i+1,L.length-1);return{k:L[i].k,i,top:false,next:L[i+1]||null}}
function badgeCount(uid){const row=sheetRow(uid)||{};return (Number(row.badges)||0)+myBadges(uid).filter(b=>!b.synced).reduce((t,b)=>t+(Number(b.n)||1),0)}
/* BADge art by level: 0 Rookie white, 1 Member black, 2 Core silver, 3 Legend titanium, 4 Founder vanta (∞). */

  const silver=grad('s',[[0,'#f6f6f6'],[.45,'#bcbcbc'],[.55,'#dcdcdc'],[1,'#808080']]);
  const titan=grad('t',[[0,'#9ea3aa'],[.4,'#6c7179'],[.55,'#8b9098'],[1,'#3d4147']]);
  const rim=grad('r',[[0,'#2a2a2a'],[.5,'#5a5a5a'],[1,'#1a1a1a']]);
  const chev=(n,y0,c,w=2.6)=>Array.from({length:n},(_,k)=>`<path d="M22 ${y0+k*6}l10 -6 10 6" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  const hex=(r,cx=32,cy=32)=>Array.from({length:6},(_,k)=>{const a=Math.PI/3*k-Math.PI/2;return `${(cx+r*Math.cos(a)).toFixed(2)},${(cy+r*Math.sin(a)).toFixed(2)}`}).join(' ');
  const star=(R,r,cx=32,cy=32,n=5)=>Array.from({length:n*2},(_,k)=>{const a=Math.PI/n*k-Math.PI/2,q=k%2?r:R;return `${(cx+q*Math.cos(a)).toFixed(2)},${(cy+q*Math.sin(a)).toFixed(2)}`}).join(' ');
  const rays=(n,r1,r2,c,w)=>Array.from({length:n},(_,k)=>{const a=2*Math.PI/n*k;return `<line x1="${(32+r1*Math.cos(a)).toFixed(2)}" y1="${(32+r1*Math.sin(a)).toFixed(2)}" x2="${(32+r2*Math.cos(a)).toFixed(2)}" y2="${(32+r2*Math.sin(a)).toFixed(2)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`}).join('');
  let g='';

  else if(i===2)g=`<defs>${silver}</defs><polygon points="${hex(29)}" fill="url(#${id}s)"/><polygon points="${hex(24)}" fill="none" stroke="#111" stroke-width="1" opacity=".55"/>${chev(3,30,'#111')}`;

  else g=`<defs>${rim}</defs><circle cx="32" cy="32" r="30" fill="url(#${id}r)"/><circle cx="32" cy="32" r="28.6" fill="#000"/>${rays(24,21,25.5,'#2b2b2b',1.1)}<circle cx="32" cy="32" r="18.5" fill="none" stroke="#262626" stroke-width="1.2"/><path d="M32 32c-3.2-4.6-6.4-6.4-9-6.4a6.4 6.4 0 0 0 0 12.8c2.6 0 5.8-1.8 9-6.4zm0 0c3.2 4.6 6.4 6.4 9 6.4a6.4 6.4 0 0 0 0-12.8c-2.6 0-5.8 1.8-9 6.4z" fill="none" stroke="#f0f0f0" stroke-width="2.6" stroke-linejoin="round"/>`;
  return `<svg class="bart${lk}" viewBox="0 0 64 64" role="img" aria-label="${o.label||''}">${g}</svg>`}
const BADGE_COLOUR=['White','Black','Silver','Titanium','Vanta'];

function openBadge(uid){BG={open:true,uid:uid||'',n:1,reason:'',custom:'',q:''};drawBadge();loadBadgeQ().then(()=>{if(BG.open)drawBadge()})}
function drawBadge(){let h=$('bg-host');if(!h){h=document.createElement('div');h.id='bg-host';document.body.appendChild(h)}
  if(!BG.open){h.innerHTML='';document.documentElement.classList.remove('sheet-open');return}
  const f=document.activeElement&&document.activeElement.id;h.innerHTML=badgeSheet();document.documentElement.classList.add('sheet-open');
  if(f&&$(f)){const e=$(f);e.focus();try{e.setSelectionRange(e.value.length,e.value.length)}catch(_){}}
  h.onclick=async ev=>{const t=ev.target.closest('[data-bgclose],[data-bgpick],[data-bgr],[data-bgn],[data-bggive]');if(!t)return;
    if(t.dataset.bgclose!==undefined){if(ev.target.closest('.sheet')&&!ev.target.closest('.sheet-x'))return;BG.open=false;drawBadge();return}
    if(t.dataset.bgpick!==undefined){BG.uid=t.dataset.bgpick;drawBadge();return}
    if(t.dataset.bgr!==undefined){BG.reason=t.dataset.bgr;if(!/above and beyond/i.test(BG.reason)&&BG.reason!=='__custom')BG.n=1;drawBadge();if(BG.reason==='__custom')setTimeout(()=>$('bg-custom')?.focus(),30);return}
    if(t.dataset.bgn!==undefined){BG.n=+t.dataset.bgn;drawBadge();return}
    if(t.dataset.bggive!==undefined)giveBadge()};
  const q=$('bg-q');if(q)q.oninput=()=>{BG.q=q.value;drawBadge()};
  const cu=$('bg-custom');if(cu)cu.oninput=()=>{BG.custom=cu.value;const b=h.querySelector('[data-bggive]');if(b)b.disabled=!cu.value.trim()}}
async function giveBadge(){const p=S.profiles[BG.uid];if(!p||!S.db)return;const reason=BG.reason==='__custom'?BG.custom.trim():BG.reason;if(!reason)return;
  const me=myProfile()||{},d={date:todayIso(),uid:BG.uid,player:trackerName(BG.uid)||p.nickname||'',name:p.nickname||'',n:BG.n,reason,by:(me.listName||me.nickname||window.BAD_USER?.name||'').trim(),byEmail:window.BAD_USER?.email||'',byUid:S.uid,at:new Date().toISOString(),synced:false};
  try{if(badgeFree())await S.db.collection('badges').add(d);
    else{const m=monthKey();await loadBadgeQ();const n=(S.badgeQ.n||0)+BG.n;if(n>BADGE_MONTH){toast(`That's more than your ${BADGE_MONTH} BADges this month. ${BADGE_MONTH-S.badgeQ.n} left.`);drawBadge();return}
      const b=S.db.batch();b.set(S.db.doc(`badgeq/${S.uid}_${m}`),{n,u:new Date().toISOString()});b.set(S.db.doc(`badges/${S.uid}_${m}_${n}`),d);await b.commit();S.badgeQ={m,n}}
    toast(`${BG.n} BADge${BG.n>1?'s':''} for ${p.nickname}. Thank you.`);BG.open=false;drawBadge()}catch(e){console.warn(e);toast("Sorry, that didn't save. Please publish the latest rules and try again.")}}

/* ---------- points entries: events, retreats, no-shows, free sessions, adjustments ---------- */
async function addLedger(id,o){const c=PS(),pts=o.pts!=null&&o.pts!==''?Number(o.pts):(c.other[o.type]||0);
  const d={v:2,date:o.date||todayIso(),uid:o.uid,player:trackerName(o.uid)||(S.profiles[o.uid]||{}).nickname||'',name:(S.profiles[o.uid]||{}).nickname||'',dept:o.dept||'',type:o.type,pts,reason:o.reason||o.type,by:(myProfile()?.listName||myProfile()?.nickname||window.BAD_USER?.email||'').trim(),at:new Date().toISOString(),synced:false,...(o.sid?{sid:o.sid}:{})};
  return id?S.db.doc('ledger/'+id).set(d):S.db.collection('ledger').add(d)}
/* run by an admin's app: no-shows, late cancellations and paid retreats become points entries, once each */
async function autoPoints(){if(!S.canEdit||!S.db||S._autoPts)return;const c=PS();if(!c.launch)return;S._autoPts=true;
  try{const have=new Set((S.ledger||[]).map(e=>e._id)),now=Date.now(),put=async(id,o)=>{if(have.has(id))return;have.add(id);try{await addLedger(id,o)}catch(_){}};
    for(const [sid,s] of Object.entries(S.sessions)){if(!s.date||s.date<c.launch||!canSport(s.sport))continue;const dept=sportOf(s.sport).club,t=`${s.title||dept} · ${fmtD(s.date)}`;
      for(const e of roster(sid).late)if(!e.guest)await put(`late-${sid}-${e.uid}`,{uid:e.uid,type:'No-show',dept,date:s.date,sid,reason:'Late cancellation: '+t});
      /* side quests (collabs): everyone in the event earns event points 12 hours after it starts, unless marked as a no-show */
      if(isSide(s.sport)&&sessStart(s)<now-12*36e5){const nsk=new Set(Object.values(S.noshows||{}).filter(n=>(n.dates||[]).includes(sid)).map(n=>n.player));
        for(const e of roster(sid).in)if(!e.guest&&!nsk.has(e.key))await put(`quest-${sid}-${e.uid}`,{uid:e.uid,type:'Event or tournament',dept,date:s.date,sid,reason:'Side quest: '+t})}
      if(s.sport==='retreat'&&sessStart(s)<now)for(const [uid,P] of Object.entries(S.payments[sid]||{}))if(P&&P.ok&&!P.waived)await put(`ret-${sid}-${uid}`,{uid,type:'BAD Retreat',dept,date:s.date,sid,reason:t})}
    for(const n of Object.values(S.noshows||{})){const pr=profileByKey(n.player);if(!pr)continue;
      for(const d of (n.dates||[])){if(d.includes('#'))continue;const s=S.sessions[d];if(!s||!s.date||s.date<c.launch)continue;await put(`ns-${d}-${pr[0]}`,{uid:pr[0],type:'No-show',dept:sportOf(s.sport).club,date:s.date,sid:d,reason:`No-show: ${s.title||sportOf(s.sport).club} · ${fmtD(s.date)}`})}}
  }finally{S._autoPts=false}}

/* numbers worn before numbers were claimed: a full admin's app claims them once, oldest card first, so nobody new can take them */
async function backfillNumbers(){if(S._bfn||!S.db||!S.canEdit||typeof fullAdmin!=='function'||!fullAdmin()||!Object.keys(S.profiles||{}).length)return;S._bfn=true;
  for(const uid of signupOrder()){const n=numNorm(S.profiles[uid].number);if(n===''||!/^\d{1,3}$/.test(n)||(S.numbers||{})[n])continue;
    try{await S.db.doc('numbers/'+n).set({uid,at:new Date().toISOString()});S.numbers[n]={uid}}catch(_){}}}

const okEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||'').trim());
const okMobile=v=>String(v||'').replace(/\D/g,'').length>=8;
/* jersey numbers: one per player, first come first served. The first 100 wear 0 to 99, everyone after wears 100 to 999. */
const numNorm=n=>n===''||n==null?'':String(+n);
const numRange=()=>{const m=S.profiles[S.uid];return (m&&!m.sample&&m.nickname?isFirst100(S.uid):first100Left()>0)?[0,99]:[100,999]};
const numOwn=n=>{const m=S.profiles[S.uid];return !!m&&String(m.number)===numNorm(n)};
const numTaken=n=>{const k=numNorm(n);if(k==='')return null;const c=(S.numbers||{})[k];if(c&&c.uid!==S.uid)return (S.profiles[c.uid]||{}).nickname||'another player';
  for(const [uid,p] of Object.entries(S.profiles||{}))if(uid!==S.uid&&!p.sample&&String(p.number)===k)return p.nickname||'another player';return null};
function numProblem(n){if(n==='')return 'Pick your jersey number.';if(numOwn(n))return '';const [lo,hi]=numRange(),v=+n;
  if(v<lo||v>hi)return lo===0?'Pick a number from 0 to 99.':'Numbers 0 to 99 belong to the first 100. Please pick one from 100 to 999.';
  const t=numTaken(n);return t?`${t} already wears ${v}. Numbers are first come, first served, so please pick another.`:''}
function numHint(n){const [lo,hi]=numRange(),pr=numProblem(n);if(pr)return pr;return numOwn(n)?`${+n} is yours.`:`${+n} is free. It's yours once you save${lo===0?`, and you're one of the first 100`:''}.`}
function freeNumber(){const [lo,hi]=numRange();for(let i=0;i<200;i++){const n=String(lo+Math.floor(Math.random()*(hi-lo+1)));if(!numTaken(n))return n}for(let v=lo;v<=hi;v++)if(!numTaken(String(v)))return String(v);return ''}
async function claimNumber(uid,n,old){if(!S.db||n===''||n===old)return;const c=(S.numbers||{})[n];if(c&&c.uid===uid)return;
  const b=S.db.batch();b.set(S.db.doc('numbers/'+n),{uid,at:new Date().toISOString()});const oc=old&&(S.numbers||{})[old];if(oc&&oc.uid===uid)b.delete(S.db.doc('numbers/'+old));await b.commit()}

/* ---------- crop & adjust: drag to move, pinch or slider to zoom, brightness ---------- */
const CROP_W=600,CROP_H=520;
async function renderCrop(src,c){const img=await loadImg(src),cv=document.createElement('canvas');cv.width=CROP_W;cv.height=CROP_H;const x=cv.getContext('2d');
  const base=Math.max(CROP_W/img.width,CROP_H/img.height),sc=base*c.z,w=img.width*sc,h=img.height*sc;
  x.filter=`brightness(${100+c.b}%)`;x.fillStyle='#000';x.fillRect(0,0,CROP_W,CROP_H);x.drawImage(img,(CROP_W-w)/2+c.x*CROP_W,(CROP_H-h)/2+c.y*CROP_H,w,h);
  return cv.toDataURL('image/jpeg',.8)}
function openCropper(src){if(!src)return;const c={...(D._src===src&&D._crop?D._crop:{z:1,x:0,y:0,b:0})};
  const ov=document.createElement('div');ov.className='crop-ov';ov.setAttribute('role','dialog');ov.setAttribute('aria-label','Adjust your photo');
  ov.innerHTML=`<div class="crop-box"><div class="row" style="justify-content:space-between"><h3 class="ah">Adjust your photo</h3><button class="btn ghost sm" data-cx>${ic('x')}Cancel</button></div>
    <div class="crop-frame" id="cf"><img id="ci" src="${src}" alt="" draggable="false"><div class="crop-fade"></div></div>
    <p class="fine" style="text-align:center">Drag to move. Pinch or use the slider to zoom.</p>
    <label class="crop-sl"><span class="label">Zoom</span><input type="range" id="cz" min="1" max="3" step="0.01" value="${c.z}"></label>
    <label class="crop-sl"><span class="label">Brightness</span><input type="range" id="cb" min="-40" max="40" step="1" value="${c.b}"></label>
    <div class="row" style="justify-content:space-between"><button class="btn ghost sm" id="crst">Reset</button><button class="btn" id="cok">${ic('check')}Use photo</button></div></div>`;
  document.body.appendChild(ov);document.body.style.overflow='hidden';
  const f=ov.querySelector('#cf'),im=ov.querySelector('#ci');
  const clamp=()=>{const fw=f.clientWidth,fh=f.clientHeight,base=Math.max(fw/im.naturalWidth,fh/im.naturalHeight),w=im.naturalWidth*base*c.z,h=im.naturalHeight*base*c.z;
    const mx=Math.max(0,(w-fw)/2/fw),my=Math.max(0,(h-fh)/2/fh);c.x=Math.max(-mx,Math.min(mx,c.x));c.y=Math.max(-my,Math.min(my,c.y));return{w,h,fw,fh}};
  const draw=()=>{if(!im.naturalWidth)return;const {w,h,fw,fh}=clamp();im.style.width=w+'px';im.style.height=h+'px';im.style.left=((fw-w)/2+c.x*fw)+'px';im.style.top=((fh-h)/2+c.y*fh)+'px';im.style.filter=`brightness(${100+c.b}%)`};
  im.onload=draw;if(im.complete)draw();addEventListener('resize',draw);
  const pts=new Map();let last=null,pinch=null;
  f.addEventListener('pointerdown',e=>{f.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});last={x:e.clientX,y:e.clientY};if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:c.z}}});
  f.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&pinch){const [a,b]=[...pts.values()];c.z=Math.max(1,Math.min(3,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));ov.querySelector('#cz').value=c.z}
    else if(last){c.x+=(e.clientX-last.x)/f.clientWidth;c.y+=(e.clientY-last.y)/f.clientHeight;last={x:e.clientX,y:e.clientY}}draw()});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;const r=[...pts.values()][0];last=r?{...r}:null};
  f.addEventListener('pointerup',up);f.addEventListener('pointercancel',up);
  f.addEventListener('wheel',e=>{e.preventDefault();c.z=Math.max(1,Math.min(3,c.z*(e.deltaY<0?1.06:1/1.06)));ov.querySelector('#cz').value=c.z;draw()},{passive:false});
  ov.querySelector('#cz').oninput=e=>{c.z=+e.target.value;draw()};ov.querySelector('#cb').oninput=e=>{c.b=+e.target.value;draw()};
  const close=()=>{removeEventListener('resize',draw);ov.remove();document.body.style.overflow=''};
  ov.querySelector('[data-cx]').onclick=()=>{close();if(!D.photo&&D._src===src)D._src=''};
  ov.querySelector('#crst').onclick=()=>{Object.assign(c,{z:1,x:0,y:0,b:0});ov.querySelector('#cz').value=1;ov.querySelector('#cb').value=0;draw()};
  ov.querySelector('#cok').onclick=async()=>{try{D.photo=await renderCrop(src,c);D._src=src;D._crop={...c};close();renderStep();preview()}catch(_){toast('Sorry, that didn’t work. Please try another photo.')}};
}

function myActivity(){
  const b=S.bookings[S.uid]?.s||{},rows=[];
  for(const [sid,x] of Object.entries(b)){const s=S.sessions[sid];if(!s)continue;
    const started=Date.now()>sessStart(s),r=roster(sid),inside=r.in.some(e=>e.uid===S.uid&&!e.guest),wait=r.wait.some(e=>e.uid===S.uid&&!e.guest);
    const guests=(x.guests||[]).filter(g=>!g.out||r.late.some(e=>e.uid===S.uid&&e.guest===g.n)).length;
    let status,amount=0;
    if(x.out){const f=feeFor(s,x.out);status=f.amount?'Dropped late':'Dropped';amount=f.amount}
    else if(inside&&notMember()&&!started){status='Spot requested'}
    else if(inside){status=started?'Played':'Booked';amount=(Number(s.fee)||0)*(1+guests)}
    else if(wait){status=started?'Missed (waitlist)':'Waitlist'}
    else continue;
    const pay=S.payments[sid]?.[S.uid];
    const payState=!amount?'none':pay?.waived?'free':pay?.ok?'paid':x.sent?'sent':'pending';
    rows.push({sid,s,x,status,amount,guests,payState,games:gamesFor(sid,S.uid),method:x.pay||'cash'});
  }
  return rows.sort((a,b)=>sessStart(b.s)-sessStart(a.s));
}

async function saveCardImage(){const fl=$('my-card'),b=$('save-card'),node=fl?.querySelector(fl.classList.contains('on')?'.face.back .pc':'.face.front .pc');if(!node)return;b.disabled=true;const t=b.innerHTML;b.textContent='Making your card…';

    const SC=3,cs=getComputedStyle(node),rad=(parseFloat(cs.borderTopLeftRadius)||18)*SC,bgc=cs.backgroundColor||'#000';

    const ph=node.querySelector('.ph'),nr=node.getBoundingClientRect(),pr=ph?ph.getBoundingClientRect():null;
    const url=ph?(getComputedStyle(ph).backgroundImage.match(/url\(["']?(.*?)["']?\)/)||[])[1]:'';const placeholder=ph&&ph.classList.contains('placeholder');
    node.classList.add('snap');fl.classList.add('snapping');let shot;try{shot=await html2canvas(node,{backgroundColor:null,scale:SC,useCORS:true,logging:false})}finally{node.classList.remove('snap');fl.classList.remove('snapping')}
    /* 2) compose: white frame, card colour, photo with fades, then the text layer */
    const bw=3*SC,W=shot.width,Hh=shot.height,cv=document.createElement('canvas');cv.width=W+bw*2;cv.height=Hh+bw*2;const x=cv.getContext('2d');
    const rr=(px,py,w,h,r)=>{x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath()};
    rr(0,0,cv.width,cv.height,rad+bw);x.fillStyle='#FFFFFF';x.fill();
    x.save();rr(bw,bw,W,Hh,rad);x.clip();x.fillStyle=bgc;x.fillRect(bw,bw,W,Hh);
    if(pr&&url){try{const img=await loadImg(url);const px=Math.floor(bw+(pr.left-nr.left)*SC),py=Math.floor(bw+(pr.top-nr.top)*SC),pw=Math.ceil(pr.width*SC),phh=Math.round(pr.height*SC),k=Math.max(pw/img.width,phh/img.height),dw=img.width*k,dh=img.height*k;
      x.save();x.beginPath();x.rect(px,py,pw,phh);x.clip();x.globalAlpha=placeholder?.85:1;x.filter='grayscale(1) contrast(1.05)';x.drawImage(img,px+(pw-dw)/2,py+(phh-dh)/2,dw,dh);x.filter='none';x.globalAlpha=1;
      const m=bgc.match(/\d+(\.\d+)?/g)||[0,0,0],c=`${m[0]},${m[1]},${m[2]}`;
      let g=x.createLinearGradient(0,py,0,py+phh*.34);g.addColorStop(0,`rgba(${c},.85)`);g.addColorStop(1,`rgba(${c},0)`);x.fillStyle=g;x.fillRect(px,py,pw,phh*.34);
      g=x.createLinearGradient(0,py,0,py+phh);g.addColorStop(0,`rgba(${c},0)`);g.addColorStop(.35,`rgba(${c},0)`);g.addColorStop(.94,`rgba(${c},1)`);g.addColorStop(1,`rgba(${c},1)`);x.fillStyle=g;x.fillRect(px,py,pw,phh+1);x.restore();x.fillStyle=bgc;x.fillRect(px,py+phh-1,pw,3)}catch(_){}}
    x.drawImage(shot,bw,bw);x.restore();
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const name=`BAD-card-${slug(myProfile()?.nickname||'player')}.png`,file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)){try{await navigator.share({files:[file],title:'My BAD card'})}catch(e){if(e.name!=='AbortError')throw e}}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Card saved.')}}
  catch(e){console.error(e);toast('Sorry, that didn’t work. You can take a screenshot instead.')}
  b.disabled=false;b.innerHTML=t}

/* ---------- BAD maths: session sizing, score checks, rotation and standings ----------
   Pure functions, no screen or database code, so they can be unit-tested (tests/badmath.test.mjs).
   The reasoning behind every rule is in the Badminton Queuing plan. */
const BADMATH=(()=>{
  const FORMATS={21:{target:21,cap:30,mins:12},30:{target:30,cap:35,mins:17}};
  const TARGET_GAMES=5;

  /* ---- session sizing ----
     average games each = 4·C·T / (N·d): every doubles game gives 4 player-games */
  const gamesEach=(N,C,T,d)=>N>0&&d>0?4*C*T/(N*d):0;
  /* games still needed to bring everyone present up to the target, and the time that takes */
  function shortfall(games,target=TARGET_GAMES){return games.reduce((s,g)=>s+Math.max(0,target-g),0)}
  function timeNeeded(S,C,d){const K=Math.ceil(S/4);return C>0?d*Math.ceil(K/C):Infinity}
  /* advice for crew: null when everyone can still reach the target in the time left */
  function advice({games,courts,minsLeft,d,target=TARGET_GAMES}){
    const S=shortfall(games,target);if(!S)return {ok:true,S:0};
    const need=timeNeeded(S,courts,d),needMore=timeNeeded(S,courts+1,d);
    return need<=minsLeft?{ok:true,S,need}:{ok:false,S,need,extend:Math.ceil((need-minsLeft)/5)*5,withCourt:needMore,courtEnough:needMore<=minsLeft}}

  /* ---- scores ----
     valid final scores: win at the target by 2+, or by exactly 2 past it, or at the cap by 1 or 2 */
  function validScore(fmt,x,y){const f=FORMATS[fmt];if(!f)return false;
    if(!Number.isInteger(x)||!Number.isInteger(y)||x<0||y<0||x===y)return false;
    const w=Math.max(x,y),l=Math.min(x,y);
    return (w===f.target&&l<=f.target-2)||(w>f.target&&w<f.cap&&w-l===2)||(w===f.cap&&l>=f.cap-2)}
  function scoreHint(fmt,x,y){const f=FORMATS[fmt];if(!f)return 'Pick 21 or 30 points first.';
    if(x===''||y===''||x==null||y==null)return 'Enter both scores.';
    x=Number(x);y=Number(y);if(!Number.isInteger(x)||!Number.isInteger(y)||x<0||y<0)return 'Scores are whole numbers.';
    if(x===y)return 'Badminton can’t end in a tie.';
    const w=Math.max(x,y),l=Math.min(x,y);
    if(w<f.target)return `A ${f.target}-point game ends at ${f.target} or more.`;
    if(w>f.cap)return `${f.cap} is the most a ${f.target}-point game can reach.`;
    if(w===f.target&&l>f.target-2)return `At ${f.target-1}–${f.target-1} you need a 2-point lead to win.`;
    if(w>f.target&&w<f.cap&&w-l!==2)return `Past ${f.target}, the winner is exactly 2 points ahead.`;
    if(w===f.cap&&l<f.cap-2)return `A game only reaches ${f.cap} from ${f.cap-1}–${f.cap-1} or ${f.cap-2}–${f.cap-1}.`;
    return '';}
  /* points scaled to a 21-point game, so mixed formats compare fairly in the tiebreak */
  const scaled=(s,fmt)=>s*21/(FORMATS[fmt]?FORMATS[fmt].target:21);

  /* ---- rotation ----
     players: [{id, g: games this session, base: lowest count when they arrived (late-arrival credit),
                since: when they became free (ms), deferred: times passed over, rating, cat}]
     history: past and prepared lineups [{a:[id,id], b:[id,id]}] */
  const eff=p=>Math.max(p.g||0,(p.base||0)-1);
  function order(players){return [...players].sort((x,y)=>eff(x)-eff(y)||(x.since||0)-(y.since||0)||String(x.id).localeCompare(String(y.id)))}
  function counts(history){const part={},opp={},key=(x,y)=>x<y?x+'|'+y:y+'|'+x;
    for(const m of history){for(const t of [m.a,m.b])if(t&&t.length===2){const k=key(t[0],t[1]);part[k]=(part[k]||0)+1}
      if(m.a&&m.b)for(const x of m.a)for(const y of m.b){const k=key(x,y);opp[k]=(opp[k]||0)+1}}
    return {part,opp,key}}
  /* level groups: 0 Beginner (F, E, E+), 1 Improver (D, D+), 2 Intermediate (C, C+), 3 Advanced (B, B+), 4 Elite (A, A+) */
  const BANDS={F:0,E:0,'E+':0,D:1,'D+':1,C:2,'C+':2,B:3,'B+':3,A:4,'A+':4};
  const bandOf=g=>g in BANDS?BANDS[g]:null;
  /* every Beginner needs at least one Beginner opponent: 1 strong + 3 Beginners is fine, 3 strong + 1 Beginner is not */
  function beginnerBreaks(a,b){let n=0;for(const [mine,theirs] of [[a,b],[b,a]])for(const p of mine)if(p.band===0&&!theirs.some(o=>o.band===0))n++;return n}
  const W={balance:30,partner:10000,beginner:5000,opponent:8,mix:2,depth:5};
  /* the cheapest of the 3 ways to split four players into two teams */
  function pairing(four,cnt,fallbackRating){
    const r=p=>typeof p.rating==='number'?p.rating:fallbackRating;
    let best=null;
    for(const [i,j,k,l] of [[0,1,2,3],[0,2,1,3],[0,3,1,2]]){
      const a=[four[i],four[j]],b=[four[k],four[l]];
      const bal=Math.abs(r(a[0])+r(a[1])-r(b[0])-r(b[1]));
      const P=(cnt.part[cnt.key(a[0].id,a[1].id)]||0)+(cnt.part[cnt.key(b[0].id,b[1].id)]||0);
      let O=0;for(const x of a)for(const y of b)O+=cnt.opp[cnt.key(x.id,y.id)]||0;
      const w=t=>t.filter(p=>p.cat==='W').length,M=w(a)!==w(b)?1:0;
      const Bk=beginnerBreaks(a,b);
      const cost=W.balance*bal+W.partner*P+W.beginner*Bk+W.opponent*O+W.mix*M;
      if(!best||cost<best.cost)best={a:a.map(p=>p.id),b:b.map(p=>p.id),cost,bal,P,O,M,Bk}}
    return best}
  /* pick the next four: fairness first (fewest games, longest wait, nobody skipped twice), then the best teams */
  function pickFour(players,history,poolSize=8){
    const q=order(players);if(q.length<4)return null;
    const known=q.map(p=>p.rating).filter(x=>typeof x==='number'),avg=known.length?known.reduce((s,x)=>s+x,0)/known.length:3;
    const cnt=counts(history),pool=q.slice(0,poolSize),e4=eff(q[3]);
    const must=pool.filter(p=>eff(p)<e4).map(p=>p.id);
    const forced=pool.filter(p=>eff(p)===e4&&(p.deferred||0)>0).map(p=>p.id);
    if(!must.includes(pool[0].id)&&!forced.includes(pool[0].id))forced.unshift(pool[0].id);
    const req=[...must,...forced].slice(0,4);
    let best=null;const n=pool.length;
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)for(let k=j+1;k<n;k++)for(let l=k+1;l<n;l++){
      const four=[pool[i],pool[j],pool[k],pool[l]],ids=four.map(p=>p.id);
      if(four.some(p=>eff(p)>e4))continue;                 /* never skip a player with fewer games */
      if(req.some(id=>!ids.includes(id)))continue;         /* first in line and anyone passed over before */
      const pr=pairing(four,cnt,avg),cost=pr.cost+W.depth*(i+j+k+l-6);
      if(!best||cost<best.cost)best={...pr,cost,last:l}}
    if(!best){const pr=pairing(q.slice(0,4),cnt,avg);best={...pr,last:3}}
    const chosen=new Set([...best.a,...best.b]);
    /* players at the same level who were passed over must go next time */
    const deferred={};for(const p of pool.slice(0,best.last+1))deferred[p.id]=chosen.has(p.id)?0:(eff(p)===e4?(p.deferred||0)+1:(p.deferred||0));
    return {a:best.a,b:best.b,cost:best.cost,bal:best.bal,P:best.P,O:best.O,Bk:best.Bk,deferred}}

  /* ---- standings ----
     games: [{a:[ids], b:[ids], score:[sa,sb], fmt}] (final results only) */
  function standings(games){
    const t={};const row=id=>t[id]||(t[id]={id,played:0,wins:0,losses:0,pf:0,pa:0,sp:0});
    for(const g of games){if(!g||!g.score)continue;const [sa,sb]=g.score.map(Number);
      for(const [team,mine,theirs] of [[g.a,sa,sb],[g.b,sb,sa]])for(const id of team){const r=row(id);r.played++;
        if(mine>theirs)r.wins++;else r.losses++;r.pf+=mine;r.pa+=theirs;r.sp+=scaled(mine,g.fmt)}}
    const rows=Object.values(t).map(r=>({...r,diff:r.pf-r.pa,pct:r.played?r.wins/r.played:0,sp:Math.round(r.sp*10)/10}));
    /* most wins, then most scaled points, then fewer games played (same result in fewer chances). Names never decide. */
    const cmp=(x,y)=>y.wins-x.wins||y.sp-x.sp||x.played-y.played;
    rows.sort((x,y)=>cmp(x,y)||String(x.id).localeCompare(String(y.id)));
    let rank=0;rows.forEach((r,i)=>{if(i===0||cmp(rows[i-1],r)!==0)rank=i+1;r.rank=rank});
    return rows}
  const winners=rows=>rows.filter(r=>r.rank===1&&r.played>0).map(r=>r.id);

  return {BANDS,bandOf,beginnerBreaks,FORMATS,TARGET_GAMES,gamesEach,shortfall,timeNeeded,advice,validScore,scoreHint,scaled,eff,order,pairing,pickFour,standings,winners,W};
})();
if(typeof module!=='undefined'&&module.exports)module.exports=BADMATH;

const isAttend=sp=>queueOff(sp)||!COURT_SPORTS.includes(sp||'badminton');

async function saveGrade(uid,sid,k,v){
  const cur=(S.grades||{})[uid]||{},pr=S.profiles[uid]||{};
  const from={g:cur.g||'U',cat:cur.cat||null,ovr:typeof cur.ovr==='number'?cur.ovr:null};
  const to={...from};
  if(k==='g')to.g=gradeRow(v)?v:'U';
  if(k==='cat')to.cat=CATS[v]?v:null;
  if(k==='ovr'){const n=v===''?null:Math.round(Number(v)*2)/2;if(n!=null&&!(n>=0&&n<=7)){toast('Ratings go from 0 to 7.');return}to.ovr=n}
  if(k!=='cat'&&!to.cat&&CATS[pr.cat])to.cat=pr.cat;
  if(k==='g'||k==='cat')to.ovr=null;   /* a new level or category means a fresh rating from the table */
  if(k==='ovr'&&to.ovr!=null){const row=gradeRow(to.g),cc=to.cat||pr.cat,calc=row&&cc?(cc==='W'?row[2]:row[3]):null;if(calc===to.ovr)to.ovr=null}   /* the player's own category, now confirmed by crew */
  const me=myProfile(),doc={...to,by:S.uid,byName:(me&&me.nickname)||'',at:SVT(),sid,scale:GRADE_SCALE};
  /* keep the old 5-step level (scale v1) the first time, for the record. It is never turned into a grade. */
  if(cur.prev)doc.prev=cur.prev;else{const lv=S.levels&&S.levels[uid],ov=lv&&lv.levels?lv.levels.badminton:null,own=pr.levels?pr.levels.badminton:null;
    doc.prev={scale:'v1',self:own==null||own===''?null:(LEVELS[own]||null),crew:ov==null?null:(LEVELS[ov]||null)}}
  try{const b=S.db.batch();b.set(S.db.doc('grades/'+uid),doc);b.set(S.db.collection('grades/'+uid+'/log').doc(),{from,to,by:S.uid,byName:doc.byName,at:SVT(),sid});await b.commit();
    const row=gradeRow(to.g),cc=to.cat||pr.cat,rt=to.ovr!=null?to.ovr:row&&cc?(cc==='W'?row[2]:row[3]):null;
    toast(`${(S.profiles[uid]||{}).nickname||'Player'}: ${row?to.g:'UNRATED'}${to.cat?' - '+to.cat:''}${rt!=null?` · rating ${rt}${to.ovr!=null?' (adjusted)':''}`:''}. Saved.`)}
  catch(e){toast("Sorry, that level didn't save.");renderCourts()}}

    if(admin){const charge=b.dataset.charge==='1',f=dropFee(sid);try{if(p.startsWith('g~')){const [,host]=p.split('~'),gs=((S.bookings[host]||{}).s||{})[sid]?.guests||[],gi=gs.findIndex(g=>gpid(host,g.n)===p);if(gi>=0)await staffDrop(host,sid,gi,charge)}
        else await staffDrop(p,sid,'',charge);toast(charge&&f.amount?`${x.name} is off the list. AED ${f.amount} late cancellation added to their payments.`:`${x.name} is off the session list.`)}catch(e){toast("Sorry, that didn't save.")}}
    lv.hide={...(lv.hide||{}),[p]:true};detach(lv,p);delete lv.checkin[p];if(!admin)toast(`${x.name} is hidden from tonight's board.`);return saveLive(sid,lv)}
  if(act==='walkcat'){walkCat=walkCat===b.dataset.v?'':b.dataset.v;document.querySelectorAll('[data-act=walkcat]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===walkCat));return}
  if(act==='walk'){const n=$('walk-name').value.trim().slice(0,24);if(!n){toast("Please type the player's name.");return}
    const wid=slug(n)+'-'+Date.now().toString(36),wg=($('walk-g')||{}).value||'U';lv.walkins.push({id:wid,name:n});
    lv.lvl={...(lv.lvl||{}),['w~'+wid]:{g:gradeRow(wg)?wg:'U',cat:CATS[walkCat]?walkCat:null}};walkCat='';setBase(sid,lv,'w~'+wid);lv.checkin['w~'+wid]=new Date().toISOString();lv.seen={...(lv.seen||{}),['w~'+wid]:n};toast(`${n} is checked in.`);return saveLive(sid,lv)}
  if(act==='add'){const k=b.dataset.k,size=(k==='w'&&lv.courts[0]?.size)||SIZES[sp][0][0];
    if(k==='c')lv.courts.push({id:'c'+Date.now().toString(36),name:'Court '+(lv.courts.length+1),size,on:blank(size)});else lv.waiting.push({id:'w'+Date.now().toString(36),size,on:blank(size)});return saveLive(sid,lv)}
  if(act==='wless'){const i=lv.waiting.map(w=>w.on.some(Boolean)).lastIndexOf(false);lv.waiting.splice(i>=0?i:lv.waiting.length-1,1);return saveLive(sid,lv)}
  if(act==='del'){const c=arr(b.dataset.k)[+b.dataset.c];if(inG(c)){toast('Finish or cancel the game on this court first.');return}arr(b.dataset.k).splice(+b.dataset.c,1);return saveLive(sid,lv)}
  if(act==='size'){if(inG(arr(b.dataset.k)[+b.dataset.c])){toast('Finish or cancel the game on this court first.');return}const c=arr(b.dataset.k)[+b.dataset.c],n=+b.dataset.n,on=c.on.filter(Boolean);c.size=n;c.on=blank(n);on.slice(0,n).forEach((p,i)=>c.on[i]=p);
    lv.waiting.forEach(w=>{if(!w.on.some(Boolean)){w.size=n;w.on=blank(n)}});return saveLive(sid,lv)}
  if(act==='fill'){const c=arr(b.dataset.k)[+b.dataset.c];if(inG(c)||c.closed)return;if(!generateInto(sid,lv,c)){toast('Not enough players on the bench.');return}return saveLive(sid,lv)}
  if(act==='fmt'){const c=lv.courts[+b.dataset.c];c.fmt=(c.fmt||suggestFmt(sid,lv))===21?30:21;return saveLive(sid,lv)}
  if(act==='begin'){const c=lv.courts[+b.dataset.c],half=c.size/2;
    if(!c.on.slice(0,half).some(Boolean)||!c.on.slice(half).some(Boolean)){toast('Please put players on both sides first.');return}
    c.st='playing';c.t0=SVT();c.t0dev=new Date().toISOString();if(sp==='badminton')c.fmt=c.fmt||suggestFmt(sid,lv);
    toast(`${c.name} has started${c.fmt?' · to '+c.fmt:''}.`);return saveLive(sid,lv)}
  if(act==='nextin'){const c=lv.courts[+b.dataset.c],nx=lv.waiting[0];if(!c||!nx||!nx.on.some(Boolean))return;c.on=blank(c.size);nx.on.filter(Boolean).slice(0,c.size).forEach((p,i)=>c.on[i]=p);
    lv.waiting.shift();lv.waiting.push({id:'w'+Date.now().toString(36),size:nx.size,on:blank(nx.size)});if(lv.waiting[0]&&!lv.waiting[0].on.some(Boolean))generateInto(sid,lv,lv.waiting[0]);toast(`Next up is on ${c.name}. Tap Start when they're ready.`);return saveLive(sid,lv)}
  if(act==='finish'||act==='cancelgo'){const ci=+b.dataset.c,c=lv.courts[ci],half=c.size/2,a=c.on.slice(0,half).filter(Boolean),bb=c.on.slice(half).filter(Boolean),now=new Date().toISOString();
    cancelAsk=null;
    finishAsk=null;
    if(act==='cancelgo'&&!inG(c)){c.on=blank(c.size);delete c.fmt;toast(`${c.name} is clear.`);return saveLive(sid,lv)}
    const names={};[...a,...bb].forEach(p=>names[p]=who(sid,p).name);
    /* the game record: teams, court, format and both clocks. Finish frees the court; the score comes from the players and Support. */
    const g={v:2,sid,sport:sp,court:c.name,a,b:bb,names,fmt:c.fmt||null,st:act==='finish'?(sp==='badminton'?'review':'played'):'cancelled',start:isFinite(msOf(c.t0))?c.t0:null,startDev:c.t0dev||null,end:SVT(),endDev:now,at:now};
    if(act==='cancelgo'){g.reason=cancelWhy||'Other';g.interrupted=true;g.by=S.uid}

    S.gSess[gid]={...g,start:g.start||null,end:null};mergeGames();   /* count it now, before the next lineup is picked */
    if(act==='finish')[...a,...bb].forEach(p=>lv.avail[p]=now);      /* cancelled: they keep their place in line */
    c.on=blank(c.size);delete c.st;delete c.t0;delete c.t0dev;delete c.fmt;delete c.pausedMs;delete c.pAt;cancelWhy='';
    /* bring on the next prepared lineup, or generate one straight onto the free court */
    const nx=lv.waiting[0];let msg;
    if(c.closed)msg=`${c.name} is closed.`;
    else if(nx&&nx.on.some(Boolean)){if(nx.size===c.size)c.on=[...nx.on];else nx.on.filter(Boolean).slice(0,c.size).forEach((p,i)=>c.on[i]=p);
      lv.waiting.shift();lv.waiting.push({id:'w'+Date.now().toString(36),size:nx.size,on:blank(nx.size)});msg=`Next up is on ${c.name}.`}
    else msg=generateInto(sid,lv,c)?`Next four are on ${c.name}.`:`${c.name} is free.`;
    /* keep Next up prepared so players can see who's coming */
    if(lv.waiting[0]&&!lv.waiting[0].on.some(Boolean))generateInto(sid,lv,lv.waiting[0]);
    toast((act==='finish'?'Game finished. ':'Game cancelled. ')+msg);
    return saveLive(sid,lv,{gid,game:g})}
}}
