/* ---------- Scores: submit → opposing team confirms → Support finalises ----------
   A finished game (status review) counts for nothing until Support finalises it. Every step records who and when.
   results/{gameId}: sub (submitted), conf (confirmed by the other team), disp (disputed), fin (final, by Support).
   Scores are always stored the game's way round: sa for Team A, sb for Team B. */
S.results={};
const scoreDraft={};let disputeFor=null,correctFor=null;
const DISPUTE_REASONS=['Wrong score','Wrong winner','Not our game','Other'];
const resOf=gid=>S.results[gid]||{};
const teamOf=(g,uid)=>g.a.includes(uid)?'a':g.b.includes(uid)?'b':null;
const otherT=t=>t==='a'?'b':'a';
const v2=g=>g&&g.v===2;
/* where a game is in the process */
function gState(gid,g){if(g.st==='played')return 'played';if(g.st==='cancelled')return 'cancelled';if(g.st==='final')return 'final';
  const r=resOf(gid);if(r.disp)return 'disputed';if(r.sub&&r.conf)return 'ready';if(r.sub)return 'submitted';return 'noscore'}
const teamNames=(sid,ids)=>ids.map(p=>esc(p===S.uid?'You':nm(sid,p))).join(' & ');
const scoreTxt=(sa,sb)=>`${sa}–${sb}`;
/* a score from one team's side: "21–17" with their own score first */
const mySide=(t,sa,sb)=>t==='b'?[sb,sa]:[sa,sb];
const fmtOf=g=>g.fmt||21;
const isSupport=sid=>(S.canEdit&&canRun((S.sessions[sid]||{}).sport||'badminton'))||isGM(sid);

/* ---------- player side ---------- */
function scoreInputs(gid,g,labels,opts={}){const d=scoreDraft[gid]||{},hint=d.x!==undefined&&d.y!==undefined&&d.x!==''&&d.y!==''?BADMATH.scoreHint(fmtOf(g),d.x,d.y):'';
  return `<div class="scorein" data-scgid="${esc(gid)}">
    <label class="sl"><span>${labels[0]}</span><input type="number" inputmode="numeric" min="0" max="35" class="sc" data-scx="x" value="${esc(d.x??'')}" aria-label="Score: ${labels[0].replace(/<[^>]+>/g,'')}"></label>
    <label class="sl"><span>${labels[1]}</span><input type="number" inputmode="numeric" min="0" max="35" class="sc" data-scx="y" value="${esc(d.y??'')}" aria-label="Score: ${labels[1].replace(/<[^>]+>/g,'')}"></label>
    <p class="fine schint" role="status">${esc(hint)}</p>
    ${opts.note?`<input type="text" maxlength="80" class="scnote" data-scx="note" placeholder="${esc(opts.note)}" value="${esc(d.note||'')}">`:''}
    <div class="row" style="gap:6px">${opts.buttons}</div></div>`}
function playerGameTile(sid,gid,g){const t=teamOf(g,S.uid);if(!t)return '';const r=resOf(gid),st=gState(gid,g),f=fmtOf(g);
  const mine=`<b>Your team</b> · ${teamNames(sid,g[t])}`,theirs=`<b>Opponents</b> · ${teamNames(sid,g[otherT(t)])}`;
  const head=`<div class="row" style="justify-content:space-between"><span class="label">${esc(g.court)} · to ${f}</span>${st==='final'?`<span class="tagl solid">${ic('check')}Final</span>`:''}</div>`;
  if(st==='noscore'||(st==='submitted'&&r.sub.team===t&&S.edit===gid)||(st==='disputed'&&S.edit===gid))
    return `<div class="tile prompt">${head}<b>Add the final score</b>${scoreInputs(gid,g,[mine,theirs],{buttons:`<button class="btn sm" data-sc="submit" data-gid="${esc(gid)}">${ic('check')}Send score</button>${S.edit===gid?`<button class="btn ghost sm" data-sc="noedit">Back</button>`:''}`})}<p class="fine">One player from the other team confirms it, then Support makes it final.</p></div>`;
  if(st==='submitted'&&r.sub.team===t){const [x,y]=mySide(t,r.sub.sa,r.sub.sb);
    return `<div class="tile">${head}<p>You sent <b class="num">${scoreTxt(x,y)}</b> (${x>y?'win':'loss'}). Waiting for ${teamNames(sid,g[otherT(t)])} to confirm.</p><button class="linkbtn" data-sc="edit" data-gid="${esc(gid)}">Change the score</button></div>`}
  if(st==='submitted'){const [x,y]=mySide(t,r.sub.sa,r.sub.sb);
    if(disputeFor===gid)return `<div class="tile prompt">${head}<b>What’s wrong?</b><div class="chips" role="group">${DISPUTE_REASONS.map(x=>`<button class="chip sm" data-sc="why" data-v="${esc(x)}" aria-pressed="${(scoreDraft[gid]||{}).why===x}">${esc(x)}</button>`).join('')}</div>
      <div class="row" style="gap:6px"><button class="btn sm" data-sc="dispute" data-gid="${esc(gid)}" ${(scoreDraft[gid]||{}).why?'':'disabled'}>Send to Support</button><button class="btn ghost sm" data-sc="nodispute">Back</button></div><p class="fine">Or enter the right score instead:</p>
      ${scoreInputs(gid,g,[mine,theirs],{buttons:`<button class="btn ghost sm" data-sc="submit" data-gid="${esc(gid)}">Send this score instead</button>`})}</div>`;
    return `<div class="tile prompt">${head}<b>Confirm the score</b><p>${teamNames(sid,g[otherT(t)])} sent <b class="num">${scoreTxt(x,y)}</b>, a ${x>y?'win':'loss'} for your team.</p>
      <div class="row" style="gap:6px"><button class="btn sm" data-sc="confirm" data-gid="${esc(gid)}">${ic('check')}That’s right</button><button class="btn ghost sm" data-sc="askdispute" data-gid="${esc(gid)}">Something’s wrong</button></div></div>`}
  if(st==='ready'){const [x,y]=mySide(t,r.sub.sa,r.sub.sb);return `<div class="tile">${head}<p><b class="num">${scoreTxt(x,y)}</b> agreed by both teams. Support will make it final.</p></div>`}
  if(st==='disputed')return `<div class="tile">${head}<p>Support is checking this score.</p><button class="linkbtn" data-sc="edit" data-gid="${esc(gid)}">Enter the right score</button></div>`;
  return '';}
/* everything a player needs to act on, then their results tonight */
function playerScoresHTML(sid){const mine=liveGames(sid).filter(([,g])=>v2(g)&&teamOf(g,S.uid));if(!mine.length)return '';
  const needsMe=([gid,g])=>{const st=gState(gid,g),r=resOf(gid),t=teamOf(g,S.uid);return st==='noscore'||(st==='submitted'&&r.sub.team!==t)||S.edit===gid||disputeFor===gid};
  const act=mine.filter(([gid,g])=>['noscore','submitted','disputed','ready'].includes(gState(gid,g))).reverse();
  const now=act.filter(needsMe),later=act.filter(x=>!needsMe(x));
  const done=mine.filter(([gid,g])=>gState(gid,g)==='final').reverse();
  return `${now.map(([gid,g])=>playerGameTile(sid,gid,g)).join('')}${later.length?`<div class="sec"><span class="label">Waiting for others · ${later.length}</span>${later.map(([gid,g])=>playerGameTile(sid,gid,g)).join('')}</div>`:''}
    ${done.length?`<div class="sec"><span class="label">Your results · ${done.length}</span><div class="list">${done.map(([gid,g])=>{const t=teamOf(g,S.uid),[x,y]=mySide(t,g.final[0],g.final[1]);
      return `<div class="li" style="grid-template-columns:minmax(0,1fr) auto"><div><div class="nm">${x>y?'Won':'Lost'} · with ${teamNames(sid,g[t].filter(p=>p!==S.uid))||'—'}</div><div class="sub">v ${teamNames(sid,g[otherT(t)])} · ${esc(g.court)}</div></div><b class="num big" style="font-size:1.4rem">${scoreTxt(x,y)}</b></div>`}).join('')}</div></div>`:''}`}

/* ---------- Support queue ---------- */
const GROUPS=[['ready','Ready to finalise','Both teams agree. One tap makes it count.'],['disputed','Disputed','The teams disagree. Check with them, then enter the right score.'],
  ['submitted','Needs confirming','One team has sent a score. If the other team can’t confirm, finalise it with a reason.'],['noscore','Needs a score','Nobody has sent a score yet. Ask the players, or enter it for guests.']];
function supportCount(sid){return liveGames(sid).filter(([gid,g])=>v2(g)&&['ready','disputed','submitted','noscore'].includes(gState(gid,g))).length}
function supportRow(sid,gid,g,st){const r=resOf(gid),f=fmtOf(g),A=teamNames(sid,g.a),B=teamNames(sid,g.b);
  const claim=r.sub?`<p class="fine">${esc(nm(sid,r.sub.by))} sent <b class="num">${scoreTxt(r.sub.sa,r.sub.sb)}</b>${r.conf?` · confirmed by ${esc(nm(sid,r.conf.by))}`:''}${r.disp?` · disputed by ${esc(nm(sid,r.disp.by))}: ${esc(r.disp.why||'')}`:''}</p>`:'';
  let act='';
  if(st==='ready')act=`<button class="btn sm" data-sc="fin" data-gid="${esc(gid)}" data-how="agreed">${ic('check')}Finalise ${scoreTxt(r.sub.sa,r.sub.sb)}</button><button class="linkbtn" data-sc="sedit" data-gid="${esc(gid)}">Enter a different score</button>`;
  else if(st==='submitted'&&!S.sedit[gid])act=`<button class="btn ghost sm" data-sc="fin" data-gid="${esc(gid)}" data-how="unavailable">Other team unavailable · finalise ${scoreTxt(r.sub.sa,r.sub.sb)}</button><button class="linkbtn" data-sc="sedit" data-gid="${esc(gid)}">Enter a different score</button>`;
  if(st==='noscore'||st==='disputed'||S.sedit[gid])act=scoreInputs(gid,g,[`<b>Team A</b> · ${A}`,`<b>Team B</b> · ${B}`],{note:st==='disputed'?'What was agreed with the players':'',buttons:`<button class="btn sm" data-sc="fin" data-gid="${esc(gid)}" data-how="support">${ic('check')}Finalise this score</button>`});
  act+=gameTools(sid,gid,g);
  return `<div class="li qrow"><div><div class="nm">${A} <span class="muted">v</span> ${B}</div><div class="sub">${esc(g.court)} · to ${f} · ${hhmm(new Date(msOf(g.endDev)||Date.now()).toISOString())}${isFinite(gameMins(g))?` · ${Math.round(gameMins(g))} min`:''}</div>${claim}<div class="qact">${act}</div></div></div>`}
/* fix a mistake: put the game back on its court, void it (kept, counts for nothing) or delete it (admins) */
let toolFor=null,toolAsk=null;
function gameTools(sid,gid,g){const admin=S.canEdit&&canRun((S.sessions[sid]||{}).sport||'badminton');
  if(toolFor!==gid)return `<button class="linkbtn" data-sc="tools" data-gid="${esc(gid)}">More</button>`;
  if(toolAsk)return `<div class="confirm"><b>${toolAsk==='void'?'Void this game?':toolAsk==='del'?'Delete this game?':'Put this game back on court?'}</b><p class="fine">${toolAsk==='void'?'It stays in the record as void and counts for nothing.':toolAsk==='del'?'It’s removed completely, with no record left.':`The players go back on ${esc(g.court)} and the timer carries on.`}</p>
    <div class="row" style="gap:6px"><button class="btn sm" data-sc="${toolAsk}go" data-gid="${esc(gid)}">${toolAsk==='void'?'Void':toolAsk==='del'?'Delete':'Back on court'}</button><button class="btn ghost sm" data-sc="toolno">Keep</button></div></div>`;
  return `<div class="row" style="gap:6px"><button class="btn ghost sm" data-sc="toolask" data-v="still" data-gid="${esc(gid)}">${ic('play')}Still playing</button><button class="btn ghost sm" data-sc="toolask" data-v="void" data-gid="${esc(gid)}">Void</button>${admin?`<button class="btn ghost sm" data-sc="toolask" data-v="del" data-gid="${esc(gid)}">Delete</button>`:''}<button class="linkbtn" data-sc="toolno">Close</button></div>`}
function supportHTML(sid){const gs=liveGames(sid).filter(([,g])=>v2(g)),by={};for(const [gid,g] of gs){const st=gState(gid,g);(by[st]=by[st]||[]).push([gid,g])}
  const ready=by.ready||[];
  const groups=GROUPS.map(([k,t,d])=>by[k]&&by[k].length?`<div class="tile qgroup"><div class="sec-h"><b>${t} · ${by[k].length}</b>${k==='ready'&&ready.length>1?`<button class="btn sm" data-sc="finall">${ic('check')}Finalise all ${ready.length}</button>`:''}</div><p class="fine">${d}</p><div class="list">${by[k].map(([gid,g])=>supportRow(sid,gid,g,k)).join('')}</div></div>`:'').join('');
  const fin=(by.final||[]).slice().reverse(),can=(by.cancelled||[]);
  return `${groups||`<div class="tile"><b>${ic('check')} All scores are final</b><p class="fine">New games show up here as soon as a court finishes.</p></div>`}
    ${fin.length?`<div class="tile"><b>Final · ${fin.length}</b><div class="list">${fin.map(([gid,g])=>`<div class="li qrow"><div><div class="row" style="justify-content:space-between;gap:10px;flex-wrap:nowrap"><span class="nm" style="min-width:0">${teamNames(sid,g.a)} <span class="muted">v</span> ${teamNames(sid,g.b)}</span><b class="num" style="white-space:nowrap">${scoreTxt(g.final[0],g.final[1])}</b></div><div class="sub">${esc(g.court)} · to ${fmtOf(g)}${(resOf(gid).fin||{}).how==='unavailable'?' · other team unavailable':''}${(resOf(gid).fin||{}).note?' · '+esc(resOf(gid).fin.note):''}</div>
      ${correctFor===gid?scoreInputs(gid,g,[`<b>Team A</b> · ${teamNames(sid,g.a)}`,`<b>Team B</b> · ${teamNames(sid,g.b)}`],{note:'Reason for the correction (required)',buttons:`<button class="btn sm" data-sc="fin" data-gid="${esc(gid)}" data-how="correction">${ic('check')}Save</button><button class="btn ghost sm" data-sc="nocorrect">Back</button>`}):`<div class="row" style="gap:10px"><button class="linkbtn" data-sc="correct" data-gid="${esc(gid)}">${ic('edit')}Edit</button>${gameTools(sid,gid,g)}</div>`}</div></div>`).join('')}</div></div>`:''}
    ${can.length?`<div class="tile"><b>Cancelled · ${can.length}</b><div class="list">${can.map(([gid,g])=>`<div class="li"><div><div class="nm">${teamNames(sid,g.a)} <span class="muted">v</span> ${teamNames(sid,g.b)}</div><div class="sub">${esc(g.court)} · ${esc(g.reason||'')} · no result</div></div></div>`).join('')}</div></div>`:''}`}
S.sedit={};

/* ---------- saving ---------- */
function readDraft(gid,g,flip){const d=scoreDraft[gid]||{},x=Number(d.x),y=Number(d.y),h=BADMATH.scoreHint(fmtOf(g),d.x,d.y);
  if(h){toast(h);return null}return flip?[y,x]:[x,y]}
async function scoreAct(b){const k=b.dataset.sc,gid=b.dataset.gid,g=gid&&S.games[gid],sid=g&&g.sid;
  if(k==='edit'){S.edit=gid;return renderCourts()}
  if(k==='noedit'){S.edit=null;return renderCourts()}
  if(k==='askdispute'){disputeFor=gid;return renderCourts()}
  if(k==='nodispute'){disputeFor=null;return renderCourts()}
  if(k==='why'){const id=disputeFor;scoreDraft[id]={...(scoreDraft[id]||{}),why:b.dataset.v};return renderCourts()}
  if(k==='sedit'){S.sedit[gid]=true;return renderCourts()}
  if(k==='correct'){correctFor=gid;const f=g.final||[];scoreDraft[gid]={x:f[0],y:f[1]};return renderCourts()}
  if(k==='nocorrect'){correctFor=null;return renderCourts()}
  if(k==='award'){await awardSession(S.courtSid);return renderCourts()}
  if(k==='tools'){toolFor=gid;toolAsk=null;return renderCourts()}
  if(k==='toolask'){toolFor=gid;toolAsk=b.dataset.v;return renderCourts()}
  if(k==='toolno'){toolFor=null;toolAsk=null;return renderCourts()}
  if(k==='voidgo'||k==='delgo'||k==='stillgo'){toolFor=null;toolAsk=null;
    try{if(k==='voidgo'){await S.db.doc('games/'+gid).update({st:'cancelled',reason:'Voided',interrupted:true,by:S.uid,was:g.st,wasFinal:g.final||null});toast('Game voided. It no longer counts.')}
      else if(k==='delgo'){await S.db.doc('games/'+gid).delete();delete S.gSess[gid];mergeGames();toast('Game deleted.')}
      else{const lv=norm(clone(S.live[sid]||{courts:[]})),c=lv.courts.find(x=>x.name===g.court);
        if(!c){toast(`${g.court} isn't on the board any more.`);return}
        if(c.on.some(Boolean)){toast(`${c.name} has players on it. Clear it first, or void this game instead.`);return}
        for(const p of [...g.a,...g.b])detach(lv,p);
        const half=c.size/2,pad=(t)=>t.concat(Array(half).fill(null)).slice(0,half);c.on=[...pad(g.a),...pad(g.b)];
        c.st='playing';c.t0=g.start||null;c.t0dev=g.startDev||new Date().toISOString();c.fmt=g.fmt||null;c.pausedMs=g.pausedMs||0;
        await S.db.doc('games/'+gid).delete();delete S.gSess[gid];mergeGames();saveLive(sid,lv);toast(`Back on ${c.name}. The timer carries on.`)}}
    catch(e){console.warn(e);toast("Sorry, that didn't save.")}
    return renderCourts()}
  const ref=S.db.doc('results/'+gid),cur=resOf(gid);
  try{
    if(k==='submit'){const t=teamOf(g,S.uid);if(!t)return;const v=readDraft(gid,g,t==='b');if(!v)return;
      await ref.set({sid,sub:{sa:v[0],sb:v[1],by:S.uid,team:t,at:SVT()},conf:null,disp:null,fin:null});
      S.edit=null;disputeFor=null;delete scoreDraft[gid];toast('Score sent. The other team will confirm it.')}
    else if(k==='confirm'){await ref.set({...cur,sid,conf:{by:S.uid,at:SVT()}});toast('Confirmed. Thank you.')}
    else if(k==='dispute'){const why=(scoreDraft[gid]||{}).why;await ref.set({...cur,sid,disp:{by:S.uid,at:SVT(),why}});disputeFor=null;toast('Sent to Support. They’ll check it with both teams.')}
    else if(k==='fin'||k==='finall'){
      const list=k==='finall'?liveGames(S.courtSid).filter(([id,x])=>v2(x)&&gState(id,x)==='ready').map(([id])=>id):[gid];
      for(const id of list){const gg=S.games[id],rr=resOf(id),how=k==='finall'?'agreed':b.dataset.how;let v,note='';
        if(how==='agreed'||how==='unavailable')v=[rr.sub.sa,rr.sub.sb];else{v=readDraft(id,gg,false);if(!v)return;note=((scoreDraft[id]||{}).note||'').trim().slice(0,80)}
        if(how==='correction'&&!note){toast('Please add a reason for the correction.');return}
        if(how==='unavailable')note='Other team unavailable to confirm';
        await finalise(id,gg,v,how,note)}
      correctFor=null;toast(list.length>1?`${list.length} scores are final.`:'Score is final. It counts now.')}
  }catch(e){console.warn(e);toast("Sorry, that didn't save. Please try again.")}
  renderCourts()}
/* Support: the result, the game record and an add-only log entry, saved together */
async function finalise(gid,g,v,how,note){const cur=resOf(gid),b=S.db.batch(),fin={sa:v[0],sb:v[1],by:S.uid,at:SVT(),how};if(note)fin.note=note;
  b.set(S.db.doc('results/'+gid),{sid:g.sid,sub:cur.sub||null,conf:cur.conf||null,disp:cur.disp||null,fin});
  b.update(S.db.doc('games/'+gid),{st:'final',final:v,finBy:S.uid,finAt:SVT()});
  b.set(S.db.collection('results/'+gid+'/log').doc(),{sid:g.sid,sa:v[0],sb:v[1],how,note:note||'',by:S.uid,at:SVT(),was:g.final||null});
  await b.commit();delete scoreDraft[gid];delete S.sedit[gid]}
function bindScores(el){
  el.querySelectorAll('[data-scgid] [data-scx]').forEach(x=>x.oninput=()=>{const gid=x.closest('[data-scgid]').dataset.scgid,d=scoreDraft[gid]=scoreDraft[gid]||{};d[x.dataset.scx]=x.value;
    const g=S.games[gid],h=x.closest('[data-scgid]').querySelector('.schint');if(h&&g&&x.dataset.scx!=='note')h.textContent=d.x!==undefined&&d.y!==undefined&&d.x!==''&&d.y!==''?BADMATH.scoreHint(fmtOf(g),d.x,d.y):''});
  el.querySelectorAll('[data-sc]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();scoreAct(b)})}

/* ---------- session standings and BADDEST PLAYER ----------
   Only final scores count. Most wins, then most points (scaled to a 21-point game), then fewer games. Exact ties share the title. */
S.awards={};
function sessStandings(sid){return BADMATH.standings(liveGames(sid).filter(([,g])=>v2(g)&&g.st==='final'&&g.final).map(([,g])=>({a:g.a,b:g.b,score:g.final,fmt:fmtOf(g)})))}
const sameSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
function standingsHTML(sid,crew){const rows=sessStandings(sid),aw=S.awards[sid],pend=supportCount(sid),s=S.sessions[sid];
  if(!rows.length)return crew?`<div class="tile"><b>${ic('board')} Standings</b><p class="fine">They appear as soon as the first score is final.</p></div>`:'';
  const win=BADMATH.winners(rows),changed=aw&&!sameSet(aw.winners||[],win);
  const admin=S.canEdit&&canRun((s||{}).sport||'badminton');
  const badd=aw?`<div class="baddest"><span class="label">BADDEST PLAYER${(aw.winners||[]).length>1?'S':''}</span><b>${(aw.winners||[]).map(p=>esc(nm(sid,p))).join(' & ')}</b><span class="fine">+5 points${(aw.winners||[]).some(p=>!S.profiles[p])?' · guests need a card to collect points':''}</span></div>`:'';
  const fin=!crew||!admin?'':pend?`<p class="fine">Finalise the ${pend} score${pend===1?'':'s'} above, then finalise the session to award BADDEST PLAYER.</p>`
    :aw&&!changed?`<p class="fine">${ic('check')} Session finalised. A score correction here will let you update the award.</p>`
    :`<div class="row" style="gap:8px;align-items:center"><button class="btn sm" data-sc="award">${ic('star')}${aw?'Update the award':'Finalise session · award BADDEST PLAYER'}</button>${changed?`<span class="fine">Standings changed after a correction.</span>`:''}</div>`;
  return `<div class="tile standings">${badd}<div class="sec-h"><b>${ic('board')} ${aw?'Final standings':'Standings · live'}</b><span class="fine">Wins, then points</span></div>
    <div class="stable" role="table" aria-label="Session standings"><div class="strow sh" role="row"><span>#</span><span>Player</span><span>W–L</span><span>Pts</span></div>
    ${rows.map(r=>`<div class="strow${r.id===S.uid?' mine':''}${r.rank===1?' first':''}" role="row"><span class="num">${r.rank}</span><span>${esc(r.id===S.uid?'You':nm(sid,r.id))}${crew?`<small class="fine"> · ${r.played} game${r.played===1?'':'s'} · ${r.diff>0?'+':''}${r.diff}</small>`:''}</span><span class="num">${r.wins}–${r.losses}</span><span class="num">${Number.isInteger(r.sp)?r.sp:r.sp.toFixed(1)}</span></div>`).join('')}</div>
    <p class="fine">Points from 30-point games are scaled to 21 so every game counts the same. Win % and point difference are for interest only.</p>${fin}</div>`}
/* admin: finalise the session. One award per session; a later correction updates it with a reversal entry, never a second +5. */
async function awardSession(sid,picked){const s=S.sessions[sid],rows=picked?[]:sessStandings(sid),win=picked||BADMATH.winners(rows);if(!win.length){toast(picked?'Pick at least one player.':'No final scores yet.');return}
  const prev=(S.awards[sid]||{}).winners||[],t=`${s.title||'Badminton'} · ${fmtD(s.date)}`,dept=sportOf(s.sport).club;
  const have=new Set((S.ledger||[]).map(e=>e._id));let n=0;
  try{
    for(const uid of win)if(S.profiles[uid]&&!prev.includes(uid)){const id=`baddest-${sid}-${uid}`;
      if(!have.has(id)){await addLedger(id,{uid,type:'BADDEST PLAYER',pts:5,dept,date:s.date,sid,reason:'BADDEST PLAYER · '+t});n++}}
    for(const uid of prev)if(S.profiles[uid]&&!win.includes(uid)){const k=(S.ledger||[]).filter(e=>String(e._id).startsWith(`baddest-${sid}-${uid}-undo`)).length;
      await addLedger(`baddest-${sid}-${uid}-undo${k+1}`,{uid,type:'BADDEST PLAYER',pts:-5,dept,date:s.date,sid,reason:'BADDEST PLAYER changed after a correction · '+t})}
    const top=rows.slice(0,5).map(r=>({id:r.id,rank:r.rank,wins:r.wins,sp:r.sp,played:r.played}));
    await S.db.doc('awards/'+sid).set({sid,winners:win,top,by:S.uid,at:SVT(),rev:((S.awards[sid]||{}).rev||0)+1,prev:prev});
    toast(`BADDEST PLAYER: ${win.map(p=>nm(sid,p)).join(' & ')}${n?` · +5 points`:''}`)}
  catch(e){console.warn(e);toast("Sorry, the award didn't save. Please try again.")}}

/* ---------- BAD PACE run log and BADDEST PLAYER for every sport ----------
   runs/{sessionId}_{playerId}: distance (km) and time (seconds). Runners log their own; crew can log for anyone, walk-ins too.
   Badminton picks BADDEST PLAYER from the standings; every other sport, crew pick. Either way: +5, once. */
S.runs={};let runEdit=null,pickWin=[];
const fmtDur=secs=>{secs=Math.round(secs);const h=Math.floor(secs/3600),m=Math.floor(secs%3600/60),x=secs%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const parseDur=t=>{const p=String(t||'').trim().split(':').map(Number);if(!p.length||p.some(n=>!Number.isFinite(n)||n<0))return NaN;return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0]*60};
const paceOf=r=>r&&r.km>0&&r.secs>0?r.secs/r.km:null;
const runOf=(sid,pid)=>S.runs[sid+'_'+pid];
function runRows(sid){return Object.values(S.runs).filter(r=>r.sid===sid&&r.km>0).sort((a,b)=>b.km-a.km||(paceOf(a)||1e9)-(paceOf(b)||1e9))}
function runForm(sid,pid,mine){const r=runOf(sid,pid)||{};
  return `<div class="runform" data-runpid="${esc(pid)}"><label><span>Distance (km)</span><input type="number" step="0.01" min="0" max="100" inputmode="decimal" data-rk="km" value="${r.km??''}"></label>
    <label><span>Time (mm:ss or h:mm:ss)</span><input type="text" inputmode="numeric" data-rk="t" placeholder="32:15" value="${r.secs?fmtDur(r.secs):''}"></label>
    <button class="btn sm" data-run="save" data-pid="${esc(pid)}">${ic('check')}${mine?'Save my run':'Save'}</button></div>`}
function runHTML(sid,lv,crew){const rows=runRows(sid),me=S.uid,inn=lv.checkin[me];
  const board=rows.length?`<div class="stable runs" role="table" aria-label="Tonight's runs"><div class="strow sh" role="row"><span>#</span><span>Runner</span><span>km</span><span>Pace</span></div>
    ${rows.map((r,i)=>`<div class="strow${r.pid===me?' mine':''}${i===0?' first':''}" role="row"><span class="num">${i+1}</span><span>${esc(r.pid===me?'You':who(sid,r.pid).name)}${crew?` <button class="linkbtn" data-run="edit" data-pid="${esc(r.pid)}">Edit</button>`:''}</span><span class="num">${(+r.km).toFixed(2)}</span><span class="num">${paceOf(r)?fmtDur(paceOf(r))+'/km':'—'}</span></div>`).join('')}</div>`
    :'<p class="fine">No runs logged yet.</p>';
  const mine=!crew&&inn?`<div class="tile prompt"><b>Log your run</b>${runForm(sid,me,true)}</div>`:'';
  const crewList=crew?(()=>{const todo=presentIds(lv).filter(p=>!runOf(sid,p)||runEdit===p);
    return todo.length?`<div class="list">${todo.map(p=>`<div class="li" style="grid-template-columns:auto minmax(0,1fr)">${pav(sid,p)}<div><div class="nm">${esc(who(sid,p).name)}</div>${runForm(sid,p,false)}</div></div>`).join('')}</div>`:'<p class="fine">Everyone checked in has a run logged.</p>'})():'';
  return `${mine}<div class="tile standings"><div class="sec-h"><b>${ic('run')} Tonight's runs</b><span class="fine">Distance, then pace</span></div>${board}${crew?`<div class="sec" style="margin-top:12px"><span class="label">Log runs</span>${crewList}</div>`:''}</div>`}
function bindRuns(el){el.querySelectorAll('[data-run]').forEach(b=>b.onclick=async ev=>{ev.stopPropagation();const k=b.dataset.run,pid=b.dataset.pid,sid=S.courtSid;
  if(k==='edit'){runEdit=pid;return renderCourts()}
  const f=el.querySelector(`[data-runpid="${CSS.escape(pid)}"]`),km=Math.round(Number(f.querySelector('[data-rk=km]').value)*100)/100,secs=parseDur(f.querySelector('[data-rk=t]').value);
  if(!(km>0&&km<=100)){toast('Please enter the distance in km.');return}
  if(!(secs>0&&secs<86400)){toast('Please enter the time, like 32:15.');return}
  try{await S.db.doc('runs/'+sid+'_'+pid).set({sid,pid,km,secs:Math.round(secs),by:S.uid,at:SVT()});runEdit=null;toast(`Saved: ${km} km in ${fmtDur(secs)} (${fmtDur(secs/km)}/km).`)}
  catch(e){toast("Sorry, that run didn't save.")}})}

/* ---------- BADDEST PLAYER picked by crew ---------- */
function baddestCard(sid){const aw=S.awards[sid]||{},w=aw.winners||[];

document.addEventListener('click',async ev=>{const t=ev.target.closest('[data-bp-pick],[data-bp-award]');if(!t||!t.closest('#v-courts'))return;ev.stopPropagation();

/* ---------- Manual court board ----------
   While the automatic queue is being rebuilt, crew arrange and match players by hand.
   Courts, a "Next up" area and the bench (everyone checked in who isn't placed). Drag a player anywhere,
   or tap a player then tap a spot. Dropping on someone swaps the two. Start and End game are one tap each;
   when a game ends its players go back to the bench and the first Next up group walks onto that court. */
S.cTab=S.cTab||'sheet';let msel=null;
const MB_SIZE={badminton:4,pickleball:4,volleyball:12,basketball:10};
const mbSize=sp=>MB_SIZE[sp]||4;
const mbPlayed=(lv,p)=>((lv.played||{})[p]||0);
function mbBench(lv){const placed=new Set([...lv.courts,...lv.waiting].flatMap(c=>c.on).filter(Boolean)),out=new Set(lv.out||[]);
  return arrivals(lv).filter(p=>!placed.has(p)&&!out.has(p)).sort((a,b)=>mbPlayed(lv,a)-mbPlayed(lv,b)||String(lv.avail[a]||lv.checkin[a]).localeCompare(String(lv.avail[b]||lv.checkin[b])))}
function mbChip(sid,lv,p,where){const x=who(sid,p),t=typeof lvlTag==='function'&&S.profiles[p]?lvlTag(p,S.sessions[sid]?.sport||'badminton'):'';

function mboardHTML(sid,s,lv){const sp=s.sport||'badminton',size=mbSize(sp),half=size/2,bench=mbBench(lv);
  const courts=lv.courts.map((c,ci)=>{const playing=c.st==='playing',n=c.on.filter(Boolean).length;
    return `<article class="mcourt${playing?' on':''}"><div class="mc-h"><b>${esc(c.name)}</b><span class="tagl${playing?' solid':''}">${playing?`Playing · ${fmtMins(elapsed(c))}`:n?'Ready':'Free'}</span></div>
      <div class="mc-body"><div class="mside">${c.on.slice(0,half).map((p,i)=>mbSlot(sid,lv,p,`c:${ci}:${i}`)).join('')}</div><div class="mnet">${sp==='basketball'?'vs':'NET'}</div><div class="mside">${c.on.slice(half).map((p,i)=>mbSlot(sid,lv,p,`c:${ci}:${i+half}`)).join('')}</div></div>
      <div class="mc-f">${playing?`<button class="btn wide mend" data-mb="end" data-c="${ci}">${ic('check')}End game</button>`

  const waits=lv.waiting.map((w,wi)=>`<div class="mwait"><div class="mc-h"><b>${wi===0?'Next up':'Then'} ${wi+1}</b>${w.on.some(Boolean)?`<button class="linkbtn" data-mb="wclear" data-w="${wi}">Clear</button>`:`<button class="linkbtn" data-mb="rmwait" data-w="${wi}">Remove</button>`}</div><div class="mwrow">${w.on.map((p,i)=>mbSlot(sid,lv,p,`w:${wi}:${i}`)).join('')}</div></div>`).join('');
  return `<p class="hint mhint">${msel?`<b>${esc(who(sid,msel).name)}</b> picked. Tap a spot, or tap them again to put them down.`:'Drag players onto a court or Next up. Or tap a player, then tap a spot. Drop on someone to swap.'}</p>

function mbMove(sid,pid,to){const lv=norm(clone(S.live[sid]));const from=locate(lv,pid);

  const [k,a,i]=to.split(':'),arr=k==='c'?lv.courts:lv.waiting,box=arr[+a];if(!box)return;const there=box.on[+i];

  box.on[+i]=pid;msel=null;return saveLive(sid,lv)}
async function mbAct(sid,act,b){const lv=norm(clone(S.live[sid])),s=S.sessions[sid],size=mbSize(s.sport||'badminton'),now=new Date().toISOString();
  lv.played=lv.played||{};
  if(act==='addcourt'){lv.courts.push({id:'c'+Date.now().toString(36),name:'Court '+(lv.courts.length+1),size,on:Array(size).fill(null)});return saveLive(sid,lv)}
  if(act==='rmcourt'){lv.courts.splice(+b.dataset.c,1);lv.courts.forEach((c,i)=>{if(/^Court \d+$/.test(c.name))c.name='Court '+(i+1)});return saveLive(sid,lv)}

  if(act==='rmwait'){lv.waiting.splice(+b.dataset.w,1);return saveLive(sid,lv)}
  if(act==='wclear'){const w=lv.waiting[+b.dataset.w];w.on=w.on.map(()=>null);return saveLive(sid,lv)}

  if(act==='start'){const c=lv.courts[+b.dataset.c];c.st='playing';c.t0dev=now;c.pausedMs=0;toast(`${c.name} is playing.`);return saveLive(sid,lv)}
  if(act==='end'){const c=lv.courts[+b.dataset.c],ps=c.on.filter(Boolean);ps.forEach(p=>{lv.played[p]=(lv.played[p]||0)+1;lv.avail[p]=now});
    c.on=c.on.map(()=>null);c.st='';delete c.t0dev;

    const firstIdx=lv.waiting.findIndex(w=>w.on.some(Boolean));let msg=`Game over on ${c.name}. Players are back on the bench.`;
    if(firstIdx>=0){const w=lv.waiting[firstIdx],inn=w.on.filter(Boolean);inn.forEach((p,i)=>c.on[i<c.on.length?i:0]=p);
      for(let i=firstIdx;i<lv.waiting.length-1;i++)lv.waiting[i].on=lv.waiting[i+1].on.slice();lv.waiting[lv.waiting.length-1].on=lv.waiting[lv.waiting.length-1].on.map(()=>null);
      msg=`Game over. ${inn.map(p=>who(sid,p).name).join(', ')} ${inn.length>1?'are':'is'} on ${c.name}. Tap Start when ready.`}
    toast(msg);return saveLive(sid,lv)}}

function pendingFor(uid){const b=S.bookings[uid]?.s||{},out=[];
  for(const [sid,x] of Object.entries(b)){const s=S.sessions[sid];if(!s||s.cancelled)continue;const r=roster(sid),P=S.payments[sid]?.[uid];if(P&&P.ok)continue;
    let amount=0;if(x.out)amount=feeFor(s,x.out).amount;else if(r.in.some(e=>e.uid===uid&&!e.guest)){const g=(x.guests||[]).filter(g=>!g.out||r.late.some(e=>e.uid===uid&&e.guest===g.n)).length;amount=(Number(s.fee)||0)*(1+g)}
    if(amount)out.push({sid,amount})}
  return out}

const NOMANI={id:'taste-nomani-2026-11-07',doc:{sport:'taste',title:'BAD × NOMANI · Offcourt Lunch',date:'2026-11-07',start:'12:00',end:'',venue:'NOMANI, The Chedi Al Bait, Sharjah',

  kind:'collab',agenda:'12:00 Arrive, settle in, say hi\nTaste NOMANI’s new menu, BAD style\nContent time: shoot and film every dish, the table and the crew\nPost and tag @thebad.club and NOMANI\nStay as long as the vibe does',note:'Dress code: BLACK. BAD. YOU. Wear black, bring your BAD attitude, and let your personality do the rest. Off Court. Still BAD. 🖤'},
  names:['Marlo','Zee','Kenny','Jelden','Rupha','Mark','Ez','Fay','Clark','Milka','Aaron','Carl']};

  const {id,doc,names}=NOMANI;let s=S.sessions[id];
  if(s&&(s.end==='12:30'||s.waitCap!==0||!s.agenda||s.agenda==='Have fun\nTake UGC content'||s.agenda==='12:00 Arrive, settle in, say hi\nLunch, BAD style: good food, better company\nContent break: shoot, film and share the moment (tag @thebad.club)\nStay as long as the vibe does'||!s.kind))try{const u={};if(s.end==='12:30')u.end='';if(s.waitCap!==0)u.waitCap=0;if(!s.agenda||s.agenda==='Have fun\nTake UGC content'||s.agenda==='12:00 Arrive, settle in, say hi\nLunch, BAD style: good food, better company\nContent break: shoot, film and share the moment (tag @thebad.club)\nStay as long as the vibe does')u.agenda='12:00 Arrive, settle in, say hi\nTaste NOMANI’s new menu, BAD style\nContent time: shoot and film every dish, the table and the crew\nPost and tag @thebad.club and NOMANI\nStay as long as the vibe does';if(!s.kind)u.kind='collab';await S.db.doc('sessions/'+id).update(u)}catch(_){}

  try{if(!s){await S.db.doc('sessions/'+id).set({...doc,createdAt:new Date().toISOString()});S.sessions[id]={...doc}}
    const norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    const booked=new Set(roster(id).in.concat(roster(id).wait).map(e=>norm(e.guest||nameOf(e.uid,e.key))));
    let t=Date.parse('2026-11-05T11:00:00Z');
    for(const n of names){if(booked.has(norm(n)))continue;const at=new Date(t+=1000).toISOString();
      const m=Object.entries(S.profiles).filter(([,p])=>!p.sample&&(norm(p.nickname)===norm(n)||norm(p.listName)===norm(n)));
      if(m.length===1)await staffBooking(m[0][0],id,o=>o?undefined:freshEntry('cash',at));
      else{const gid='g-'+slug(n)+'-nomani';await staffBooking(gid,id,()=>freshEntry('cash',at),{key:'guest-'+slug(n),name:n,guest:true,addedBy:window.BAD_USER?.email||'',s:{}})}}
    await S.db.doc('sessions/'+id).update({seeded:true});toast('BAD × NOMANI is in Off Court with the 12 guests.')}catch(e){console.warn('nomani',e);S._nomani=false}}

async function placeOrder(el,btn){
  const p0=myProfile();if(!p0||!S.bag.length)return;const fu=S.shopFul||'pickup',opts=Object.keys(PAY).filter(payOn),pay=opts.includes(S.shopPay)?S.shopPay:opts[0]||'cash';
  const addr=(el.querySelector('#sh-addr')?.value||'').trim(),sess=el.querySelector('#sh-sess')?.value??'';
  if(fu==='delivery'&&addr.length<8){toast('Please add your delivery address.');return}
  btn.disabled=true;btn.textContent='Placing your order…';
  const items=S.bag.map(i=>({pid:i.pid,name:i.name,size:i.size,qty:i.qty,price:+i.price})),subtotal=items.reduce((t,i)=>t+i.qty*i.price,0),W=withOff(subtotal),total=W.total;
  const need={};items.forEach(i=>{need[i.pid]=need[i.pid]||{};need[i.pid][i.size]=(need[i.pid][i.size]||0)+i.qty});
  try{
    const reserve=async(get,set)=>{for(const [pid,sz] of Object.entries(need)){const p=S.products[pid];if(!p||p.status!=='live'||!released(p))throw new Error(`${p?p.name:'An item'} isn't available right now.`);
        const d=await get(pid),sold={...((d&&d.sold)||{})};for(const [z,n] of Object.entries(sz)){if(((p.sizes||{})[z]||0)-(sold[z]||0)<n)throw new Error(`Sorry, ${p.name} (${sizeName(z)}) just sold out.`);sold[z]=(sold[z]||0)+n}
        await set(pid,{sold})}};
    if(S.db.runTransaction)await S.db.runTransaction(async t=>{const refs={},snaps={};for(const pid of Object.keys(need)){refs[pid]=S.db.doc('shopstock/'+pid);snaps[pid]=await t.get(refs[pid])}
      await reserve(async pid=>snaps[pid].exists?snaps[pid].data():{},async(pid,v)=>t.set(refs[pid],v))});
    else await reserve(async pid=>{const d=await S.db.doc('shopstock/'+pid).get();return d.exists?d.data():{}},(pid,v)=>S.db.doc('shopstock/'+pid).set(v));
    const id='o'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),c=S.myContact||{},sx=sess&&S.sessions[sess];
    const order={uid:S.uid,name:p0.nickname||'',email:c.email||window.BAD_USER?.email||'',mobile:c.mobile||'',items,subtotal,discount:W.disc,discountPct:W.off,total,fulfil:fu,address:fu==='delivery'?addr:'',session:fu==='pickup'?sess:'',pay,status:'new',createdAt:new Date().toISOString()};
    await S.db.doc('orders/'+id).set(order);
    S.bag=[];saveBag();S.shopDone={no:id.slice(-5).toUpperCase(),total,pay,fulfil:fu,where:sx?`${sx.title}, ${dParts(sx.date).w} ${dParts(sx.date).d} ${dParts(sx.date).m}`:''};renderShop();
  }catch(e){console.error(e);toast(e&&e.message&&!/permission/i.test(e.message)?e.message:"Sorry, that didn't go through. Please try again.");btn.disabled=false;btn.textContent='Place order'}
}

function shrinkImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.74))};im.onerror=rej;im.src=u})}
function parseSizes(t){t=String(t||'').trim();if(!t)return null;if(/^\d+$/.test(t))return{OS:+t};const o={};t.split(/[,\n]+/).forEach(x=>{const m=x.trim().match(/^([A-Za-z0-9 .+-]{1,12})\s*[:=]\s*(\d+)$/);if(m)o[m[1].trim().toUpperCase()]=+m[2]});return Object.keys(o).length?o:null}

  ['Wed','badminton','BADminton Wednesday','Badminton.'],
  ['Fri','badminton','BADminton Friday','Badminton.'],
  ['Fri','volleyball','VolleyBAD','Volleyball, 7pm to 10:30pm.']];
function renderHome(){const el=$('v-home');if(!el)return;
  const guest=!!window.BAD_GUEST,me=!guest&&S.uid&&typeof myProfile==='function'?myProfile():null,c=PS();
  const next=(S.loaded||S.pubSessions)?upcoming().filter(([,s])=>!s.cancelled&&!isSide(s.sport)).slice(0,3):[];

    ?`<button class="btn bigjoin" data-hjoin="1">${ic('card')}Join BAD</button>`
    :'';
  /* members: your next game first, or one button to find one */
  const mineNext=me?upcoming().find(([sid])=>{const b=S.bookings[S.uid]?.s?.[sid];return b&&!b.out}):null;
  const nextBlock=!me?'':mineNext?`<button class="tile nexts cta" data-hgo="card"><span class="label">You're in</span><span class="ic-row"><span class="ic-bub">${ic('ticket')}</span><span><b>${esc(mineNext[1].title||sportOf(mineNext[1].sport).club)}</b><span class="fine" style="display:block">${esc(fmtS(mineNext[1]))}${mineNext[1].timeTbc?'':' · '+esc(fmtTime(mineNext[1].start))}${mineNext[1].venue?' · '+esc(mineNext[1].venue):''}</span></span>${ic('arrow')}</span></button>`
    :`<button class="tile nexts cta" data-hgo="play"><span class="label">No game booked</span><span class="ic-row"><span class="ic-bub">${ic('play')}</span><span><b>Find a game</b><span class="fine" style="display:block">New sessions every week</span></span>${ic('arrow')}</span></button>`;
  const first=[['guest','Come as a guest','Tap Join BAD, add your name and number. No card needed yet.'],['play','Pick a session','Book your spot and choose how you’ll pay.'],['users','Show up and play','Check in when you arrive. Every level plays with everyone.']];
  const sessions=next.length?`<section class="hsec"><h3 class="ah">Coming up</h3><div class="list">${next.map(([sid,s])=>{const d=dParts(s.date),sp=sportOf(s.sport);return `<button class="li act hsess" data-hgo="play" style="grid-template-columns:auto minmax(0,1fr) auto"><div class="mini-dt"><small>${d.w}</small><b class="num">${d.d}</b><small>${d.m}</small></div><div><div class="nm ic-row" style="gap:6px">${ic(sp.icon)}${esc(s.title||sp.club)}</div><div class="sub">${s.timeTbc?'Time to be confirmed':esc(fmtTime(s.start))}${s.venue?' · '+esc(s.venue):''}</div></div>${ic('arrow')}</button>`}).join('')}</div></section>`
    :`<section class="hsec"><h3 class="ah">Every week</h3><div class="week">${WEEK.map(([d,k,t])=>`<div class="wk"><span class="wk-d num">${d}</span>${ic(SPORTS[k].icon)}<b>${esc(t)}</b></div>`).join('')}</div></section>`;
  const about=`<button class="bigfaq" data-hgo="faq"><span class="ic-bub">${ic('guide')}</span><span><b>FAQs</b><small>What is BAD? Who can join? How much is it?</small></span>${ic('arrow')}</button>
    <div class="homelinks ${guest||notMember()?'two':'three'}">${[['guide','guide','Guide'],['wth','spark','About BAD'],...(guest||notMember()?[]:[['club','photo','Gallery']])].map(([v,i,t])=>`<button data-hgo="${v}"${v==='club'?' data-cm="gallery"':''}>${ic(i)}${t}</button>`).join('')}</div>`;
  el.innerHTML=`<div class="phome">
    ${heroHTML("")}${cta?`<p class="hwhy">Badminton, volleyball, pickleball and more. Every week, every level.</p><div class="joinrow">${cta}</div>`:""}
    ${guest?`${about}
    <section class="hsec"><h3 class="ah">Your first time</h3><ol class="gsteps">${first.map(([i,t,d],n)=>`<li><span class="gn num">${n+1}</span><span class="ic-bub soft">${ic(i)}</span><div><b>${t}</b><span class="fine">${d}</span></div></li>`).join('')}</ol></section>
    ${sessions}${homeVideosHTML()}${igHTML()}${contactHTML()}`

    :`${nextBlock}${newsHTML()}${sessions}${about}${homeVideosHTML()}${igHTML()}${contactHTML()}${feedSectionHTML()}`}
  </div>`;
  el.querySelectorAll('[data-hjoin]').forEach(b=>b.onclick=()=>window.badJoin&&window.badJoin());
  bindHero(el);bindHomeFeed(el);
  el.querySelectorAll('[data-hgo]').forEach(b=>b.onclick=()=>{if(b.dataset.cm)S.clubMode=b.dataset.cm;setView(b.dataset.hgo)});

/* Club news on Home: upcoming events first, then the latest news. The full list and the Gallery are one tap away. */
function newsHTML(){if(notMember())return '';const today=new Date().toISOString().slice(0,10),ps=Object.entries(S.posts||{});
  const ev=ps.filter(([,p])=>p.type==='event'&&(p.date||'')>=today).sort((a,b)=>a[1].date.localeCompare(b[1].date)),nw=ps.filter(([,p])=>p.type!=='event').sort((a,b)=>(b[1].postedAt||'').localeCompare(a[1].postedAt||''));
  const top=[...ev,...nw].slice(0,3);
  const links=`<div class="row" style="gap:8px"><button class="btn ghost sm" data-hgo="club" data-cm="news">${ic('club')}All news</button></div>`;
  if(!top.length)return '';
  return `<section class="hsec"><h3 class="ah">What's on</h3><div class="list">${top.map(([id,p])=>{const d=p.date?dParts(p.date):null,sp=SPORTS[p.club];
    return `<button class="li act" data-hgo="club" data-cm="news" style="grid-template-columns:auto minmax(0,1fr) auto">${d?`<div class="mini-dt"><small>${d.w}</small><b class="num">${d.d}</b><small>${d.m}</small></div>`:`<span class="ic-bub soft">${ic('club')}</span>`}<div><div class="nm">${esc(p.title)}</div><div class="sub">${p.type==='event'?'Event':'News'} · ${esc(sp?sp.club:'All of BAD')}</div></div>${ic('arrow')}</button>`}).join('')}</div>${links}</section>`}
/* Talk to us: WhatsApp (with a ready message), email and Instagram. On Home and the FAQs, for visitors and members. */
function contactHTML(ig){return `<section class="hsec talk"><h3 class="ah">Talk to us</h3><p class="fine">Questions about joining, a collab or a private session? We usually reply the same day.</p>
  <div class="talkrow"><a class="btn" href="${waLink()}" target="_blank" rel="noopener">${ic('wa')}WhatsApp</a><a class="btn ghost" href="mailto:${BAD_EMAIL}?subject=${encodeURIComponent('Hello BAD')}">${ic('mail')}Email</a>${ig?`<a class="btn ghost" href="${IG_URL}" target="_blank" rel="noopener">${ic('ig')}Instagram</a>`:''}</div></section>`}
/* called by the sign-in bridge when nobody is signed in: show Home, and if they followed a link to another tab, ask them to sign in for it */
window.badGuestMode=function(){loadHomeMediaPublic();
  /* visitors see the real upcoming sessions (sessions are public in the security rules); if that read isn't allowed yet, the weekly list shows instead */
  const db=window.badPublicDb;if(db&&!S.pubSessions){const today=new Date().toISOString().slice(0,10);
    db.collection('sessions').where('date','>=',today).get().then(s=>{if(!window.BAD_GUEST)return;const o={};s.docs.forEach(d=>o[d.id]=d.data());S.sessions=o;S.pubSessions=true;if(S.view==='home')renderHome();else if(S.view==='sess')renderSess()}).catch(()=>{})}
const want=S.deepView&&S.deepView!=='home'?S.deepView:null;S.deepView=want;if(want==='sess'){S.deepView=null;setView('sess');return}setView('home');if(want&&window.badJoin)window.badJoin(want)};

/* ---------- FAQs, About BAD, and the photos, videos and Instagram on Home ---------- */
const STORY_HTML=`<p><b>BAD started from BADminton.</b> We were friends who loved the game, but felt it deserved more visibility and a fresh identity here. So instead of waiting for someone else, we made our own: The BAD Club.</p>
      <p>We know “bad” has a stigma. We own it. Everyone starts somewhere: you pick up a racket, struggle, learn and get better. <b>We were all BAD players once.</b></p>
      <p>BAD is still a passion project, a community built like a brand. It started with badminton and now plays volleyball, pickleball, basketball, runs and dances too.</p>`;
function faqList(){const c=PS();return [
  ['About BAD',[
    ['What is BAD?','The BAD Club is a sports community in Dubai. We run weekly sessions for badminton, volleyball, pickleball, basketball, running and dance, plus food and drink collabs we call Taste BADs.'],
    ['Why is it called BAD?','Because we were all bad players once. We own the word: everyone starts somewhere, and BAD is where you get better with people who cheer you on. Read the full story in About BAD.'],
    ['What does BAD stand for?','BAD came from BADminton. Bold. Agile. Defiant. came later, as something to live by: bold enough to try something different, agile enough to adapt as we go, and defiant enough to question the norm.'],
    ['Do I need to be good to join?','No. Every level is welcome and everyone plays with everyone. Beginners join every week.'],
    ['Is BAD a registered company?','Yes. The BAD Club LLC, registered in Sharjah, License No. 2649469.01. Read our Privacy policy and Terms at the bottom of any page.'],
    ['Where and when do you play?','Every week: BAD DINK on Tuesday, BADminton Wednesday, BADminton Friday and VolleyBAD on Friday. Exact times and venues are on each session in Play.']]],
  ['Joining and booking',[
    ['How do I join?','Tap Join BAD. First time? Come as a guest with just your name and number. Played with us before? Make your card so your sessions and points carry over.'],
    ['How do I book a session?','Open Play, pick a session and tap Count me in. You can cancel, change how you pay or bring a friend from My BAD.'],
    ['How do scores work?','After a game, one player enters the score in Courts and someone from the other team confirms it. Scores are just for fun and help us mix games.'],
    ['What if the session is full?','You go on the waitlist. It is first come, first served and nobody skips it. Core members and up just get to sign up 48 hours earlier.'],
    ['What if I can’t make it?','Drop out for free up to 48 hours before. Between 24 and 48 hours, half the fee applies. Under 24 hours, the full fee applies.']]],
  ['Paying',[
    ['How much is a session?','Each session shows its fee in Play before you book. You only pay for the sessions you join.'],
    ['How do I pay?','Cash at the session, bank transfer, Ziina or Careem Pay. Open the session in My BAD to see how and to tell us when you’ve paid.']]],
  ['Points, BADges and your card',[
    ['How do points work?',`You get ${c.per} points for every session you play. At ${c.free} points your next session is free. Points reset if you don’t play for 6 months.`],
    ['What are BADges?','A thank you from the founders and crew for helping out, bringing friends and showing up. They never expire. More BADges means a higher level and better perks.'],
    ['What is the OG 100?','The first 100 people to make a card. They start one BADge level up and get an OG 100 number on the back of their card.'],
    ['Can I pick my jersey number?','Yes, when you make your card. Numbers are first come, first served. Once 0 to 99 are taken, numbers have three digits.']]],
  ['Anything else?',[
    ['How do I reach you?','WhatsApp us on '+phoneFmt(BAD_PHONE)+', email '+BAD_EMAIL+', send a message on Instagram at @thebad.club, or speak to any of the crew at a session.']]]]}
function renderFaq(){const el=$('v-faq');if(!el)return;
  el.innerHTML=`<div class="hero"><span class="label">FAQs</span><h2>Good questions.</h2><p class="muted">Everything people ask before their first BAD session.</p></div>
  ${faqList().map(([h,qs])=>`<section class="hsec"><h3 class="ah">${esc(h)}</h3><div class="faq">${qs.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</div></section>`).join('')}
  ${contactHTML(true)}
  <div class="talkrow">${window.BAD_GUEST?`<button class="btn" data-hjoin="1">${ic('card')}Join BAD</button>`:''}<button class="btn ghost" data-goview="guide">${ic('guide')}Read the Guide</button></div>`;
  el.querySelectorAll('[data-goview]').forEach(b=>b.onclick=()=>setView(b.dataset.goview));
  el.querySelectorAll('[data-hjoin]').forEach(b=>b.onclick=()=>window.badJoin&&window.badJoin())}
function renderWth(){const el=$('v-wth');if(!el)return;
  el.innerHTML=`<div class="hero"><span class="label">About BAD</span><h2>We were all BAD players once.</h2></div>
  ${homePhotosHTML(true)}<section class="hsec story">${STORY_HTML}</section>
  <div class="row">${window.BAD_GUEST?`<button class="btn" data-hjoin="1">${ic('card')}Join BAD</button>`:''}<button class="btn ghost" data-goview="faq">FAQs</button><a class="btn ghost" href="${IG_URL}" target="_blank" rel="noopener">${ic('ig')}@thebad.club</a></div>`;
  el.querySelectorAll('[data-goview]').forEach(b=>b.onclick=()=>setView(b.dataset.goview));
  el.querySelectorAll('[data-hjoin]').forEach(b=>b.onclick=()=>window.badJoin&&window.badJoin())}
/* photos: community photos an admin picked for Home, then the latest Gallery albums (members only). No merch here. */
/* the BAD DAY film opens Home: muted, looping, full width. Tap for sound. Calm-motion settings get the still frame and a play button. */
const HERO={src:'assets/home/bad-day.mp4',poster:'assets/home/bad-day-poster.jpg'};
const calmMotion=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(_){return false}};
function heroHTML(cta){const calm=calmMotion();
  return `<section class="vhero"><video class="vh-v" src="${HERO.src}" poster="${HERO.poster}" ${calm?'':'autoplay'} muted loop playsinline preload="${calm?'none':'auto'}" aria-label="POV: BAD DAY, a short film from a BADminton session"></video><div class="vh-shade" aria-hidden="true"></div>
    <button class="vh-snd" data-vsnd="1" aria-label="${calm?'Play the film':'Turn sound on'}">${calm?ic('play'):ic('snd')}</button>
    <div class="vh-in"><h2 class="manifesto phtitle">THE BAD CLUB</h2><p class="vh-tag">A community built like a brand</p>${cta}</div></section>`}
function bindHero(el){const v=el.querySelector('.vh-v'),b=el.querySelector('[data-vsnd]');if(!v||!b)return;
  b.onclick=()=>{if(v.paused){v.play().catch(()=>{});v.muted=false}else v.muted=!v.muted;b.innerHTML=v.muted?ic('snd'):ic('sndon');b.setAttribute('aria-label',v.muted?'Turn sound on':'Turn sound off')};
  /* pause when it scrolls away or the tab is hidden, so it doesn't use battery for nothing */
  if('IntersectionObserver' in window&&!calmMotion()){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)v.play().catch(()=>{});else v.pause()}),{threshold:.2});io.observe(v)}}
/* the club's own photos: sessions, VolleyBAD, Taste BADs, BAD-O-WEEN and the Off-Court shoot. Landscape ones get a wider frame. */
const CLUB_PHOTOS={home:Array.from({length:12},(_,i)=>`assets/home/home-${String(i+1).padStart(2,'0')}.jpg`),wth:Array.from({length:8},(_,i)=>`assets/home/wth-${String(i+1).padStart(2,'0')}.jpg`)};
const WIDE_PHOTOS=new Set(['assets/home/home-01.jpg','assets/home/home-07.jpg','assets/home/home-11.jpg']);
function homePhotos(set){const own=((S.homeMedia||{}).photos||[]).filter(Boolean);return set==='wth'?CLUB_PHOTOS.wth:[...own,...CLUB_PHOTOS.home].slice(0,14)}
function photoStrip(ps,small){return `<div class="hstrip${small?' sm':''}" aria-label="Photos from BAD">${ps.map((u,i)=>`<figure${WIDE_PHOTOS.has(u)?' class="wide"':''}><img src="${esc(u)}" alt="" loading="${i<2?'eager':'lazy'}" decoding="async"></figure>`).join('')}</div>`}
function homePhotosHTML(small){return photoStrip(homePhotos(small?'wth':'home'),small)}
/* video links: YouTube, Instagram reels or posts, TikTok, or a direct .mp4 */
function vidEmbed(u){u=String(u||'').trim();let m;
  if((m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{6,})/)))return {k:'yt',src:`https://www.youtube-nocookie.com/embed/${m[1]}`};
  if((m=u.match(/instagram\.com\/(p|reel|reels|tv)\/([\w-]+)/)))return {k:'ig',src:`https://www.instagram.com/${m[1]==='reels'?'reel':m[1]}/${m[2]}/embed`};
  if((m=u.match(/tiktok\.com\/@[\w.]+\/video\/(\d+)/)))return {k:'tt',src:`https://www.tiktok.com/embed/v2/${m[1]}`};
  if(/^https:\/\/.+\.(mp4|webm|mov)(\?.*)?$/i.test(u))return {k:'mp4',src:u};return null}
function homeVideosHTML(){const v=((S.homeMedia||{}).videos||[]).map(vidEmbed).filter(Boolean).slice(0,6);if(!v.length)return '';
  return `<section class="hsec"><h3 class="ah">Watch</h3><div class="hvids">${v.map(x=>x.k==='mp4'?`<div class="hvid tall"><video src="${esc(x.src)}" controls playsinline preload="metadata"></video></div>`
    :`<div class="hvid${x.k==='yt'?'':' tall'}"><iframe src="${esc(x.src)}" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="BAD video"></iframe></div>`).join('')}</div></section>`}
function igHTML(){return `<a class="igcard" href="${IG_URL}" target="_blank" rel="noopener"><span class="ic-bub">${ic('ig')}</span><span><b>@thebad.club</b><small>Photos, reels and what’s next. Follow us on Instagram.</small></span><span class="btn sm">Follow</span></a>`}
/* visitors read the Home photos and videos with the public connection (config/home is public in the security rules) */
function loadHomeMediaPublic(){const db=window.badPublicDb;if(!db||S.homeMedia)return;db.doc('config/home').get().then(d=>{S.homeMedia=d.exists?d.data():{};if(S.view==='home'||S.view==='wth')renderNow()}).catch(()=>{})}

/* ---------- the Feed: photos, words and props from the community ----------
   Approved members only (the security rules enforce it). Posts go up straight away. One emoji reaction per person per post,
   one report per person; owners delete their own posts, admins hide or delete anything.
   Photos are shrunk on the phone and kept in their own documents (feedimg), loaded only when a post scrolls into view. */
const FEED_EMO=['🔥','🧱','🤝','😂','⚡'];
/* props work for every sport, not just badminton */
const PROPS=[['🔥','On fire'],['🧱','The Wall'],['🤝','Good sport'],['😂','Vibes'],['⚡','Clutch']];
const PROPS_OLD={'🏸':'Clutch'}; /* props given before v0.67 */
const propLabel=e=>(PROPS.find(p=>p[0]===e)||[e,PROPS_OLD[e]||''])[1];
S.feed=S.feed||{};S.feedImg=S.feedImg||{};S.fDraft=S.fDraft||{text:'',photos:[],dept:''};
const ago=iso=>{const t=Date.parse(iso||'');if(!t)return '';const m=Math.round((Date.now()-t)/60000);if(m<1)return 'just now';if(m<60)return m+'m';const h=Math.round(m/60);if(h<24)return h+'h';const d=Math.round(h/24);if(d<7)return d+'d';return new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
const pname=uid=>(S.profiles[uid]||{}).nickname||'A BAD member';
const plink=uid=>`<button class="plink" data-prof="${esc(uid)}">${esc(pname(uid))}</button>`;
function feedList(){return Object.entries(S.feed).filter(([,p])=>!p.hidden||S.canEdit).sort((a,b)=>String(b[1].at||'').localeCompare(String(a[1].at||'')))}

/* who reacted, Facebook-style: the top emojis stacked, then "You and 3 others" */
function reactSummary(r){const v=Object.values(r||{});if(!v.length)return '';const c={};v.forEach(e=>c[e]=(c[e]||0)+1);
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([e])=>`<i>${e}</i>`).join(''),mine=(r||{})[S.uid];
  return `<div class="fp-sum"><span class="fp-emos" aria-hidden="true">${top}</span><span>${mine?(v.length===1?'You':`You and ${v.length-1} other${v.length===2?'':'s'}`):v.length}</span></div>`}
function postHTML(id,p){const mine=p.uid===S.uid,r=p.r||{},myR=r[S.uid],rep=Object.keys(p.rep||{}).length,n=p.n||0;
  const menu=`<details class="pmenu"><summary aria-label="More">${ic('dots')}</summary><div class="pmenu-in">
    ${mine?`<button data-fdel="${esc(id)}">Delete post</button>`:`<button data-frep="${esc(id)}" ${(p.rep||{})[S.uid]?'disabled':''}>${(p.rep||{})[S.uid]?'Reported':'Report'}</button>`}
    ${S.canEdit?`<button data-fhide="${esc(id)}">${p.hidden?'Show again':'Hide'}</button>${mine?'':`<button data-fdel="${esc(id)}">Delete</button>`}`:''}</div></details>`;
  const meta=[ago(p.at),p.dept&&SPORTS[p.dept]?SPORTS[p.dept].club:''].filter(Boolean).map(esc).join(' · ');
  const head=p.kind==='props'
    ?`<div class="fp-props"><span class="fp-emo" aria-hidden="true">${esc(p.e||'')}</span><div><div class="nm">${plink(p.uid)} gave ${plink(p.to)} props</div><div class="sub"><span class="fp-tag">${esc(propLabel(p.e))}</span> ${esc(ago(p.at))}</div></div>${menu}</div>`
    :`<div class="fp-head"><button class="fp-av" data-prof="${esc(p.uid)}" aria-label="${esc(pname(p.uid))}">${avatar(S.profiles[p.uid],'')}</button><div><div class="nm">${plink(p.uid)}</div><div class="sub">${meta}</div></div>${menu}</div>`;
  const big=!n&&p.text&&p.text.length<=90&&p.kind!=='props';
  const pics=n?`<div class="fp-pics n${n}">${Array.from({length:n},(_,i)=>{const k=id+'-'+i,src=S.feedImg[k];return `<figure data-fimg="${esc(k)}" data-fzoom="${esc(k)}">${src?`<img src="${esc(src)}" alt="" decoding="async">`:''}</figure>`}).join('')}</div>`:'';
  const second=mine||p.kind==='props'?'':`<button class="fp-act" data-fprops="${esc(p.uid)}">${ic('star')}Give props</button>`;
  return `<article class="fpost${p.hidden?' hid':''}${p.kind==='props'?' isprops':''}" data-post="${esc(id)}">${head}
    ${p.hidden?'<span class="tagl warn">Hidden from members</span>':''}${S.canEdit&&rep?`<span class="tagl warn">Reported by ${rep}</span>`:''}
    ${p.text?`<p class="fp-text${big?' big':''}">${esc(p.text)}</p>`:''}${pics}${reactSummary(r)}
    <div class="fp-bar"><button class="fp-act${myR?' on':''}" data-freact="${esc(id)}" aria-pressed="${!!myR}">${myR?`<span class="fp-me">${myR}</span>${esc(propLabel(myR))}`:`${ic('spark')}React`}</button>${second}</div></article>`}

/* the composer: one quiet line until you tap it, like Facebook's "What's on your mind?" */
function composerHTML(){const d=S.fDraft,p=myProfile()||{},open=S.fOpen||d.text||d.photos.length;
  if(!open)return `<section class="fcompose closed">${avatar(p,'')}<button class="fc-pill" data-fopen="1">What’s on your mind, ${esc(p.nickname||'BADDY')}?</button><label class="fc-ph" aria-label="Add photos">${ic('photo')}<input type="file" id="f-files" accept="image/*" multiple hidden></label></section>`;
  const tags=(p.sports||[]).filter(k=>SPORTS[k]).slice(0,4);
  return `<section class="fcompose">${avatar(p,'')}<div class="fc-in">
    <label for="f-text" class="sr">Share something</label><textarea id="f-text" rows="3" maxlength="500" placeholder="What’s on your mind, ${esc(p.nickname||'BADDY')}?">${esc(d.text)}</textarea>
    ${d.photos.length?`<div class="fc-thumbs">${d.photos.map((u,i)=>`<div class="fc-th"><img src="${esc(u)}" alt=""><button class="rmx" data-frm="${i}" aria-label="Remove photo ${i+1}">${ic('x')}</button></div>`).join('')}</div>`:''}
    ${tags.length?`<div class="fc-tags" role="group" aria-label="Tag a department">${tags.map(k=>`<button class="chip${d.dept===k?' on':''}" data-ftag="${k}" aria-pressed="${d.dept===k}">${ic(SPORTS[k].icon)}${esc(SPORTS[k].club)}</button>`).join('')}</div>`:''}
    <div class="fc-bar"><label class="btn ghost sm fc-add${d.photos.length>=4?' off':''}">${ic('photo')}Photo<input type="file" id="f-files" accept="image/*" multiple hidden ${d.photos.length>=4?'disabled':''}></label>
      <span class="fc-sp"></span><button class="linkbtn" data-fcancel="1">Cancel</button><button class="btn sm" id="f-go">Post</button></div></div></section>`}

/* the Feed lives on Home, under Coming up. Only the list refreshes when someone posts or reacts, so a half-written post is never lost. */
S.feedShow=S.feedShow||10;S.feedLim=S.feedLim||20;
/* the Feed listens to the newest 20 posts; Show more listens to 20 more */
function subFeed(){if(!S.member||!S.db)return;if(S.feedUnsub)S.feedUnsub();
  S.feedUnsub=S.db.collection('feed').orderBy('at','desc').limit(S.feedLim).onSnapshot(s=>{const m={};s.forEach(d=>m[d.id]=d.data());S.feed=m;if(S.view==='home')refreshFeedList();else if(S.view==='player')render()},()=>{})}
function feedMore(){S.feedShow+=10;if(Object.keys(S.feed).length>=S.feedLim){S.feedLim+=20;subFeed()}refreshFeedList()}
function feedListHTML(){const L=feedList();if(!L.length)return `<div class="empty">${ic('photo')}<span>Nothing yet. Be the first to post from tonight.</span></div>`;
  return L.slice(0,S.feedShow).map(([id,p])=>postHTML(id,p)).join('')+(L.length>S.feedShow||Object.keys(S.feed).length>=S.feedLim?`<div class="fmore-s"><button class="btn ghost wide" data-fmore="1">Show more</button></div>`:'<p class="fine fend">You’re all caught up.</p>')}
function feedSectionHTML(){if(notMember()||!myProfile())return '';
  return `<section class="hsec" id="home-feed"><div class="sec-h"><h3 class="ah">Feed</h3><span class="fine">Photos, shout-outs and props</span></div>${composerHTML()}<div class="flist" id="flist">${feedListHTML()}</div></section>`}
function bindHomeFeed(el){const f=el.querySelector('#home-feed');if(!f)return;bindFeed(f);bindMore(f);
  if(S.scrollFeed){S.scrollFeed=0;setTimeout(()=>f.scrollIntoView({block:'start',behavior:'smooth'}),80)}}
function refreshFeedList(){const l=$('flist');if(!l)return;l.innerHTML=feedListHTML();const f=$('home-feed');bindFeed(l);bindMore(l)}
/* after posting or changing the photos: redraw the whole Feed block (composer included) */
function renderFeed(){if(S.view==='player')return renderPlayer();const f=$('home-feed');if(!f)return;const tmp=document.createElement('div');tmp.innerHTML=feedSectionHTML();const n=tmp.firstElementChild;if(!n)return;f.replaceWith(n);bindHomeFeed(n.parentElement||document)}
let feedIO=null,moreIO=null;
/* Show more loads itself when you scroll near it (the button stays for keyboards) */
function bindMore(el){const m=el.querySelector('[data-fmore]');if(!m)return;m.onclick=feedMore;
  if('IntersectionObserver' in window){if(moreIO)moreIO.disconnect();moreIO=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){moreIO.disconnect();feedMore()}},{rootMargin:'300px'});moreIO.observe(m)}}
function closePick(){document.querySelectorAll('.fp-pick').forEach(x=>x.remove())}
function openPick(btn,id){closePick();const d=document.createElement('div');d.className='fp-pick';d.setAttribute('role','menu');d.setAttribute('aria-label','Choose a reaction');
  d.innerHTML=PROPS.map(([e,l])=>`<button role="menuitem" data-fpe="${e}" aria-label="${esc(l)}" title="${esc(l)}">${e}</button>`).join('');
  btn.closest('.fp-bar').appendChild(d);d.querySelector('button').focus();
  d.querySelectorAll('[data-fpe]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();closePick();reactFeed(id,b.dataset.fpe)});
  setTimeout(()=>document.addEventListener('click',closePick,{once:true}),0)}
function loadFeedImg(k){if(S.feedImg[k]!==undefined)return;S.feedImg[k]='';S.db.doc('feedimg/'+k).get().then(d=>{if(!d.exists)return;S.feedImg[k]=d.data().d;document.querySelectorAll(`[data-fimg="${CSS.escape(k)}"]`).forEach(f=>{f.innerHTML=`<img src="${S.feedImg[k]}" alt="" decoding="async">`})}).catch(()=>{delete S.feedImg[k]})}
function bindFeed(el){
  const figs=el.querySelectorAll('[data-fimg]');
  if('IntersectionObserver' in window){feedIO=feedIO||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){loadFeedImg(e.target.dataset.fimg);feedIO.unobserve(e.target)}}),{rootMargin:'400px'});figs.forEach(f=>{if(!S.feedImg[f.dataset.fimg])feedIO.observe(f)})}
  else figs.forEach(f=>loadFeedImg(f.dataset.fimg));
  el.querySelectorAll('[data-prof]').forEach(b=>b.onclick=()=>openProfile(b.dataset.prof));
  const t=$('f-text');if(t)t.oninput=()=>{S.fDraft.text=t.value};
  const fi=$('f-files');if(fi)fi.onchange=async()=>{const fs=[...fi.files].slice(0,4-S.fDraft.photos.length);for(const f of fs){try{S.fDraft.photos.push(await shrinkFeed(f))}catch(_){toast("That photo couldn't be read.")}}S.fOpen=1;renderFeed();const t2=$('f-text');if(t2)t2.focus()};
  el.querySelectorAll('[data-frm]').forEach(b=>b.onclick=()=>{S.fDraft.photos.splice(+b.dataset.frm,1);renderFeed()});
  const go=$('f-go');if(go)go.onclick=postFeed;
  /* React: tap to pick an emoji; tap again to take it back */
  el.querySelectorAll('[data-freact]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const id=b.dataset.freact,cur=((S.feed[id]||{}).r||{})[S.uid];if(cur)reactFeed(id,cur);else openPick(b,id)});
  el.querySelectorAll('[data-fprops]').forEach(b=>b.onclick=()=>propsSheet(b.dataset.fprops));
  el.querySelectorAll('[data-fzoom]').forEach(f=>f.onclick=()=>{const src=S.feedImg[f.dataset.fzoom];if(src&&typeof openZoom==='function')openZoom(src)});
  el.querySelectorAll('[data-fopen]').forEach(b=>b.onclick=()=>{S.fOpen=1;renderFeed();const t2=$('f-text');if(t2)t2.focus()});
  el.querySelectorAll('[data-fcancel]').forEach(b=>b.onclick=()=>{S.fOpen=0;S.fDraft={text:'',photos:[],dept:''};renderFeed()});
  el.querySelectorAll('[data-ftag]').forEach(b=>b.onclick=()=>{S.fDraft.dept=S.fDraft.dept===b.dataset.ftag?'':b.dataset.ftag;el.querySelectorAll('[data-ftag]').forEach(x=>{const on=x.dataset.ftag===S.fDraft.dept;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)})});
  el.querySelectorAll('[data-frep]').forEach(b=>b.onclick=async()=>{try{await S.db.doc('feed/'+b.dataset.frep).update({['rep.'+S.uid]:true});toast('Thanks. The crew will take a look.')}catch(e){toast("Sorry, that didn't go through.")}});
  el.querySelectorAll('[data-fhide]').forEach(b=>b.onclick=async()=>{const id=b.dataset.fhide;try{await S.db.doc('feed/'+id).update({hidden:!S.feed[id].hidden})}catch(e){toast(e&&e.code==='permission-denied'?'Please publish the latest security rules first.':"Sorry, that didn't save.")}});
  el.querySelectorAll('[data-fdel]').forEach(b=>b.onclick=async()=>{const id=b.dataset.fdel;if(S.fDelArm!==id){S.fDelArm=id;b.textContent='Tap again to delete';return}S.fDelArm=null;
    try{const n=(S.feed[id]||{}).n||0;for(let i=0;i<n;i++)await S.db.doc('feedimg/'+id+'-'+i).delete().catch(()=>{});await S.db.doc('feed/'+id).delete();toast('Post deleted.')}catch(e){toast("Sorry, that didn't delete.")}});
}
/* feed photos: 1080px on the long side, then smaller until each fits comfortably in its own document */
function shrinkFeed(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{let w=1080,q=.78,out='';
  for(let t=0;t<6;t++){const k=Math.min(1,w/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<240000)break;w=Math.round(w*.85);q=Math.max(.6,q-.05)}
  URL.revokeObjectURL(u);res(out)};im.onerror=rej;im.src=u})}
async function postFeed(){const d=S.fDraft,text=(d.text||'').trim().slice(0,500);if(!text&&!d.photos.length){toast('Write something or add a photo first.');return}
  const b=$('f-go');b.disabled=true;b.textContent='Posting…';
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6),photos=d.photos.slice(0,4);
  try{for(let i=0;i<photos.length;i++){await S.db.doc('feedimg/'+id+'-'+i).set({uid:S.uid,post:id,d:photos[i]});S.feedImg[id+'-'+i]=photos[i]}
    const post={uid:S.uid,kind:'post',at:new Date().toISOString(),n:photos.length};if(text)post.text=text;if(d.dept)post.dept=d.dept;
    await S.db.doc('feed/'+id).set(post);S.fDraft={text:'',photos:[],dept:''};S.fOpen=0;toast('Posted.');renderFeed()}
  catch(e){b.disabled=false;b.textContent='Post';toast(e&&e.code==='permission-denied'?'Please publish the latest security rules first.':"Sorry, that didn't post. Try a smaller photo?")}}
async function reactFeed(id,e){const p=S.feed[id];if(!p)return;const cur=(p.r||{})[S.uid],FV=firebase.firestore.FieldValue;
  p.r={...(p.r||{})};if(cur===e)delete p.r[S.uid];else p.r[S.uid]=e;
  document.querySelectorAll(`[data-post="${CSS.escape(id)}"]`).forEach(a=>{const t=document.createElement('div');t.innerHTML=postHTML(id,p);const n=t.firstElementChild;a.replaceWith(n);bindFeed(n)});
  try{await S.db.doc('feed/'+id).update({['r.'+S.uid]:cur===e?FV.delete():e})}catch(err){toast("Sorry, that didn't save.")}}

/* ---------- player profiles ---------- */
function openProfile(uid){if(!uid)return;if(S.profUid!==uid)S.pfTab='posts';S.profUid=uid;setView('player',{push:1})}
function profStats(uid){let played=0;const b=(S.bookings[uid]||{}).s||{};for(const [sid,x] of Object.entries(b)){const s=S.sessions[sid];if(s&&sessStart(s)<Date.now()&&!x.out)played++}
  const props={};Object.values(S.feed).forEach(p=>{if(p.kind==='props'&&p.to===uid&&!p.hidden){const e=p.e==='🏸'?'⚡':p.e;props[e]=(props[e]||0)+1}});return {played,props}}
/* props: once a day per player, from a profile or a Feed post */
const todayKey=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Dubai'}).replace(/-/g,'');
const propsGiven=uid=>Object.keys(S.feed).some(k=>k==='p_'+S.uid+'_'+uid+'_'+todayKey());
async function giveProps(uid,e){const d=+todayKey(),id='p_'+S.uid+'_'+uid+'_'+d,doc={uid:S.uid,kind:'props',to:uid,e,d,at:new Date().toISOString()};
  await S.db.doc('feed/'+id).set(doc);S.feed[id]=doc;toast(`${e} Props sent to ${pname(uid)}.`);if(S.view==='player')renderPlayer();else if(S.view==='home')refreshFeedList()}
function propsSheet(uid){if(uid===S.uid)return;const nm=pname(uid);
  if(propsGiven(uid)){toast(`You gave ${nm} props today. More tomorrow.`);return}
  const s=launchSheet(`<span class="label">Give props</span><h3 class="wl-h">Props for ${esc(nm)}.</h3><p class="muted">Once a day per player. It shows in the Feed.</p><div class="propsel">${PROPS.map(([e,l])=>`<button data-gprop="${e}">${e}<span>${esc(l)}</span></button>`).join('')}</div>`,'Give props');
  s.card.querySelectorAll('[data-gprop]').forEach(b=>b.onclick=async()=>{s.card.querySelectorAll('[data-gprop]').forEach(x=>x.disabled=true);
    try{await giveProps(uid,b.dataset.gprop);s.close()}catch(err){s.card.querySelectorAll('[data-gprop]').forEach(x=>x.disabled=false);toast(err&&err.code==='permission-denied'?'Please publish the latest security rules first.':"Sorry, that didn't go through.")}})}
const coverOf=uid=>{let h=0;for(const c of String(uid))h=(h*31+c.charCodeAt(0))>>>0;return CLUB_PHOTOS.home[h%CLUB_PHOTOS.home.length]};
S.pfTab=S.pfTab||'posts';
/* a profile reads like Facebook's: cover, photo, name, a line about you, two buttons, then Posts and Props */
function renderPlayer(){const el=$('v-player');if(!el)return;const uid=S.profUid,p=S.profiles[uid];
  if(!p||notMember()){el.innerHTML=`<div class="empty">${ic('users')}<span>This profile isn't available.</span></div>`;return}
  const me=uid===S.uid,st=profStats(uid),lvl=typeof levelFor==='function'?levelFor(uid):null,og=typeof first100No==='function'?first100No(uid):0;

  const got=feedList().filter(([,x])=>x.kind==='props'&&x.to===uid),nProps=Object.values(st.props).reduce((a,b)=>a+b,0);
  const given=!me&&propsGiven(uid),tab=S.pfTab==='props'?'props':'posts';
  const sub=[p.number!=null&&p.number!==''?'No. '+String(p.number).padStart(2,'0'):'',og?`OG 100 #${og}`:'',lvl&&lvl.name?lvl.name:''].filter(Boolean).map(esc).join(' · ');
  el.innerHTML=`<section class="pf">
    <div class="pf-cover"><img src="${esc(coverOf(uid))}" alt="" loading="lazy" decoding="async"></div>
    <div class="pf-id">${avatar(p,p.listKey)}<div class="pf-nm"><h2 class="prof-n">${esc(p.nickname)}</h2>${sub?`<div class="sub">${sub}</div>`:''}</div></div>
    ${p.now?`<p class="nowpub"><span class="label">Currently</span> ${esc(p.now)}</p>`:''}
    ${p.bio?`<p class="prof-bio">${esc(p.bio)}</p>`:me?`<p class="fine">Add an About me so people know who you are.</p>`:''}
    ${profLine(uid,p)?`<p class="fine meline">${profLine(uid,p)}</p>`:''}

    <div class="pf-acts">${me?`<button class="btn" data-editcard="1">${ic('edit')}Edit my card</button>`

      <button class="btn ghost" data-seecard="1">${ic('card')}See card</button></div>
    <p class="pf-stats"><span><b class="num">${st.played}</b> session${st.played===1?'':'s'}</span><span><b class="num">${nProps}</b> props</span><span><b class="num">${posts.length}</b> post${posts.length===1?'':'s'}</span></p>
  </section>

  ${tab==='posts'
    ?(posts.length?`<div class="flist">${posts.slice(0,10).map(([id,x])=>postHTML(id,x)).join('')}</div>`:`<div class="empty">${ic('photo')}<span>${me?'You haven’t posted yet. Share a moment on Home.':`${esc(p.nickname)} hasn’t posted yet.`}</span></div>`)
    :(nProps?`<div class="fanwall">${PROPS.filter(([e])=>st.props[e]).map(([e,l])=>`<div class="fan"><span class="fan-e">${e}</span><b class="num">${st.props[e]}</b><span class="fine">${esc(l)}</span></div>`).join('')}</div>
      <div class="flist">${got.slice(0,10).map(([id,x])=>postHTML(id,x)).join('')}</div>`
      :`<div class="empty">${ic('star')}<span>No props yet.${me?'':' Be the first.'}</span></div>`)}`;
  bindFeed(el);
  el.querySelectorAll('[data-pftab]').forEach(b=>b.onclick=()=>{S.pfTab=b.dataset.pftab;renderPlayer()});
  el.querySelectorAll('[data-editcard]').forEach(b=>b.onclick=()=>startCreator(myProfile()));
  el.querySelectorAll('[data-seecard]').forEach(b=>b.onclick=()=>{const stc=typeof statsFor==='function'?statsFor(p.listKey):{};
    launchSheet(`<div class="prof-card">${cardHTML(p,{balance:stc.balance||0,badges:typeof badgeCount==='function'?badgeCount(uid):0,sessions:st.played})}</div><div class="row"><button class="btn ghost" data-lx="1">Close</button></div>`,`${p.nickname}'s card`)});
}

/* ---------- Baddies: everyone in the community, with search and a department filter ---------- */
S.bdQ=S.bdQ||'';S.bdSport=S.bdSport||'all';

/* ---------- share a session: WhatsApp, Instagram Story, or a link ----------
   Every session has its own page: …/bad-app/#s=<id>. Anyone can open it (sessions are public in the security rules);
   members get a button to book, visitors get Join BAD. The Story image is drawn on the phone, 1080×1920, with a QR code. */
const sessUrl=sid=>`${APP_URL}#s=${encodeURIComponent(sid)}`;
const longDate=iso=>{const d=new Date(iso+'T12:00:00+04:00');return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',timeZone:'Asia/Dubai'})};
function sessShareText(sid){const s=S.sessions[sid]||{},sp=sportOf(s.sport);
  return [`${s.title||sp.club} · The BAD Club`,`📅 ${longDate(s.date)}`,`🕗 ${timeRange(s,true)}`,s.venue?`📍 ${s.venue}`:'',+s.fee>0?`💳 AED ${s.fee}`:'',s.note?`\n${s.note}`:'',`\nEvery level is welcome. Book your spot:`,sessUrl(sid)].filter(Boolean).join('\n')}
const STORY_PHOTO={badminton:'assets/home/home-08.jpg',volleyball:'assets/home/home-07.jpg',taste:'assets/home/home-05.jpg',badx:'assets/home/home-06.jpg'};

function shareSession(sid){const s=S.sessions[sid];if(!s)return;const text=sessShareText(sid),url=sessUrl(sid);
  const ov=document.createElement('div');ov.className='shov';ov.setAttribute('role','dialog');ov.setAttribute('aria-label','Share this session');
  ov.innerHTML=`<div class="shcard"><div class="sh-h"><b>Share ${esc(s.title||sportOf(s.sport).club)}</b><button class="sh-x" aria-label="Close">${ic('x')}</button></div>
    <div class="sh-grid">
      <a class="sh-o" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">${ic('wa')}<span>WhatsApp</span></a>
      <button class="sh-o" data-sh="story">${ic('ig')}<span>Instagram Story</span></button>
      <button class="sh-o" data-sh="copy">${ic('copy')}<span>Copy link</span></button>
      ${navigator.share?`<button class="sh-o" data-sh="more">${ic('arrow')}<span>More</span></button>`:''}</div>
    <pre class="sh-prev">${esc(text)}</pre></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();ov.querySelector('.sh-x').onclick=close;ov.onclick=e=>{if(e.target===ov)close()};
  ov.querySelector('[data-sh="copy"]').onclick=async()=>{try{await navigator.clipboard.writeText(text);toast('Copied. Paste it anywhere.')}catch(_){prompt('Copy this:',url)}};
  const more=ov.querySelector('[data-sh="more"]');if(more)more.onclick=()=>navigator.share({title:s.title,text,url}).catch(()=>{});
  ov.querySelector('[data-sh="story"]').onclick=async e=>{const b=e.currentTarget;b.disabled=true;b.querySelector('span').textContent='Making it…';
    try{const blob=await storyImage(sid),file=new File([blob],`BAD-${(s.title||'session').replace(/[^\w]+/g,'-')}.png`,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});toast('In Instagram, add a Link sticker with the session link.')}
      else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Saved. Post it to your Story and add a Link sticker.')}
      try{await navigator.clipboard.writeText(url)}catch(_){}}
    catch(err){if(err&&err.name!=='AbortError')toast("Sorry, the Story image couldn't be made.")}
    finally{b.disabled=false;b.querySelector('span').textContent='Instagram Story'}};

/* the Story: a club photo on top, the details big and clear underneath, a QR code that opens the session */

  db.doc('config/codes').onSnapshot(d=>{S.codes=d.exists?(d.data().list||{}):{};render()},()=>{});
  db.collection('products').onSnapshot(s=>{S.products=map(s);if(typeof syncV2Prices==='function')syncV2Prices();if(S.view==='shop'||S.view==='admin')render()},()=>{});
  db.collection('shopstock').onSnapshot(s=>{S.stock=map(s);if(S.view==='shop'||S.view==='admin')render()},()=>{});
  if(S.uid)(db.collection('orders').where?db.collection('orders').where('uid','==',S.uid):db.collection('orders')).onSnapshot(s=>{const m=map(s);S.myOrders=Object.fromEntries(Object.entries(m).filter(([,o])=>o.uid===S.uid));if(S.view==='shop')render()},()=>{});
  db.doc('config/points').onSnapshot(d=>{S.ptsCfg=d.exists?d.data():null;render()},()=>{});
  db.doc('config/sheetPoints').onSnapshot(d=>{S.sheetPts=d.exists?d.data():null;render()},()=>{});
  if(S.member)db.collection('badges').onSnapshot(s=>{S.badges=map(s);render()},()=>{});
  if(S.member)db.collection('grades').onSnapshot(s=>{S.grades=map(s);render()},()=>{});
  db.doc('config/membership').onSnapshot(d=>{S.memCfg=d.exists?d.data():{};render()},()=>{});
  db.doc('config/members').onSnapshot(d=>{S.members=d.exists?d.data():{};render()},()=>{});
  if(S.member)subFeed();
  db.doc('config/home').onSnapshot(d=>{S.homeMedia=d.exists?d.data():{};if(['home','wth'].includes(S.view))render()},()=>{});
  db.doc('config/site').onSnapshot(d=>{S.site=d.exists?d.data():{};S.siteLoaded=true;render()},()=>{});
  db.doc('config/payments').onSnapshot(d=>{S.payCfg=d.exists?d.data():{};render()},()=>{});
  if(S.canEdit)db.collection('payments').onSnapshot(s=>{S.payOld=map(s);rebuildPayments();render()},()=>{});
  if(S.canEdit)db.collection('pay').onSnapshot(s=>{S.payNew=map(s);rebuildPayments();render()},()=>{});
  else if(S.uid)db.doc('pay/'+S.uid).onSnapshot(d=>{S.payNew=d.exists?{[S.uid]:d.data()}:{};rebuildPayments();render()},()=>{});
  db.doc('config/brand').onSnapshot(d=>{S.brand=d.exists?d.data():{};applyBrand();done()},()=>done());
  if(S.canEdit){
    db.collection('contacts').onSnapshot(s=>{S.contacts=map(s);if(S.view==='admin')render()},()=>{});
    db.collection('checkins').onSnapshot(s=>{S.checkins=map(s);syncCheckins()},()=>{});
    db.collection('qr').onSnapshot(s=>{S.qr=map(s);syncCheckins()},()=>{});
    db.collection('levels').onSnapshot(s=>{S.levels=map(s);render()},()=>{});
    if(window.BAD_WEB)db.collection('admins').onSnapshot(s=>{S.admins=map(s);if(S.view==='admin')render()},()=>{});
    if(shopAdmin())db.collection('orders').onSnapshot(s=>{S.orders=map(s);if(S.view==='admin')render()},()=>{});
    db.collection('noshows').onSnapshot(s=>{S.noshows=map(s);if(S.view==='admin')render()},()=>{});
  }
})();

/* errors from players' phones go to an admin-only list (Admin → Today): version, screen and message, never personal details.
   At most 20 a day per phone. Permission errors are expected before rules are published, so they're skipped. */
(function(){const day=()=>new Date().toISOString().slice(0,10);
  function report(msg,src){try{if(!S.db||!S.uid)return;const st=JSON.parse(localStorage.getItem('badErr')||'{}');if(st.d!==day()){st.d=day();st.n=0}if(st.n>=20)return;st.n++;localStorage.setItem('badErr',JSON.stringify(st));
    S.db.collection('errors').add({v:String(APP_VERSION).slice(0,10),view:String(S.view||'').slice(0,20),msg:String(msg||'Error').slice(0,300),src:String(src||'').slice(0,120),at:new Date().toISOString()}).catch(()=>{})}catch(e){}}
  window.badReport=report;
  window.addEventListener('error',e=>{if(!e||!e.message||/^Script error/.test(e.message))return;report(e.message,String(e.filename||'').split('/').pop()+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',e=>{const r=e&&e.reason;if(r&&r.code==='permission-denied')return;report(r&&(r.message||r.code)||String(r),'promise')})})();

/* welcome on first open, What's new after an update (20-launch.js) */
window.addEventListener('load',()=>setTimeout(launchIntro,2600));

</script>
