<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>BAD App</title>
<script>try{var t=localStorage.getItem("badTheme");if(t==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* BAD brand: black, grey #969696, white; silver only for Member cards. Aktiv Grotesk + IvyPresto Display (stand-ins: Inter Tight, Instrument Serif).
   Layout: app shell. Phone: content + fixed bottom tab bar. Desktop: top bar with the same tabs. Icons lead, words support. */
:root{
  --black:#000;--grey:#969696;--white:#fff;
  --bg:#000000;--ink:#FFFFFF;--muted:#969696;--line:#222222;--soft:#0E0E0E;--rule:#5A5A5A;--chip:#161616;
  color-scheme:dark;
  --f-sans:"Aktiv Grotesk","Inter Tight","Helvetica Neue",Arial,sans-serif;
  --f-serif:"IvyPresto Display","Instrument Serif","Didot","Bodoni 72",Georgia,serif;
  --r:12px;--tab:64px;
}
/* Inverted on request: BAD is white on black for every viewer, whatever their device theme. */
*{box-sizing:border-box}
[hidden]{display:none!important}
body:has(.selbar) .toast{bottom:calc(var(--tab) + 120px + env(safe-area-inset-bottom,0px))}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tab) + 32px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
h2{font-family:var(--f-serif);font-size:2.2rem;line-height:1.02;letter-spacing:-.01em}
h3{font-size:1rem;font-weight:700}
p{margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.label{font-size:.68rem;text-transform:uppercase;letter-spacing:.16em;font-weight:600;color:var(--muted)}
.fine{font-size:.74rem;color:var(--muted);line-height:1.45}
.num{font-variant-numeric:tabular-nums}

/* Top bar + tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wordmark{display:flex;align-items:center;gap:10px;min-width:0}
.wordmark b{font-size:1.6rem;font-weight:800;letter-spacing:.16em;line-height:1}
.wordmark img{height:26px;width:auto;display:block}
.wordmark .logo-l,.inline-logo.logo-l{display:none}.wordmark .logo-d{display:block}.inline-logo.logo-d{display:inline-block}
.inline-logo{height:.72em;width:auto;display:inline-block;vertical-align:baseline;margin-left:.18em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wordmark .logo-l,:root:not([data-theme="light"]) .inline-logo.logo-l{display:none}:root:not([data-theme="light"]) .wordmark .logo-d{display:block}:root:not([data-theme="light"]) .inline-logo.logo-d{display:inline-block}}
:root[data-theme="dark"] .wordmark .logo-l,:root[data-theme="dark"] .inline-logo.logo-l{display:none}:root[data-theme="dark"] .wordmark .logo-d{display:block}:root[data-theme="dark"] .inline-logo.logo-d{display:inline-block}
.wordmark span{font-size:.62rem;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;color:var(--muted);font-size:.8rem;font-weight:600}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
@media (max-width:760px){
  .top .tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabs button{flex-direction:column;gap:2px;font-size:.62rem;padding:6px 8px;border-radius:12px;min-width:56px}
  .tabs button[aria-current="page"]{background:var(--chip);color:var(--ink)}
  .tabs button svg.i{width:22px;height:22px}
}
@media (min-width:761px){.wrap{padding-bottom:48px}}

.view{display:grid;gap:28px}
.grid2{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr);gap:24px}}
.sec{display:grid;gap:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tile{background:var(--soft);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{display:grid;gap:2px}.stat b{font-family:var(--f-serif);font-weight:400;font-size:2.2rem;line-height:1}
.ic-row{display:flex;align-items:center;gap:10px}
.ic-bub{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.ic-bub.soft{background:var(--chip);color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);border-radius:999px;padding:12px 20px;font-size:.8rem;font-weight:700;letter-spacing:.06em;background:var(--ink);color:var(--bg);min-height:44px}
.btn.ghost{background:none;color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:.74rem;min-height:36px}
.btn.wide{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{font-size:.85rem;color:var(--muted)}
.empty{padding:24px;color:var(--muted);text-align:center;background:var(--soft);border-radius:var(--r);display:grid;gap:8px;justify-items:center}
.note{background:var(--soft);border-radius:var(--r);padding:14px 16px;font-size:.92rem;display:flex;gap:12px;align-items:flex-start}
.tagl{display:inline-flex;align-items:center;gap:6px;font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tagl.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Sport chips */
.sports{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.sports::-webkit-scrollbar{display:none}
.sp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px 8px 10px;font-size:.82rem;font-weight:600;white-space:nowrap}
.sp[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- Player card: minimal ---------- */
.pc{--bgc:#000;--fg:#fff;--dim:#969696;width:100%;max-width:340px;aspect-ratio:5/7;border-radius:18px;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:20px 22px;background:var(--bgc);color:var(--fg);box-shadow:0 0 0 1px #969696,0 24px 48px -28px rgba(0,0,0,.6)}
.pc.offcourt{--bgc:#fff;--fg:#000;--dim:#6E6E6E}
.pc.courtside{--bgc:#969696;--fg:#000;--dim:#2A2A2A}
.pc.member{--fg:#000;--dim:#404040;background:linear-gradient(135deg,#F4F4F4 0%,#BDBDBD 35%,#ECECEC 52%,#A6A6A6 78%,#DADADA 100%)}
.pc .ph{position:absolute;inset:0 0 38% 0;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.05)}
.pc .ph.placeholder{opacity:.85}
.pc .ph::before{content:"";position:absolute;inset:0 0 auto 0;height:34%;background:linear-gradient(180deg,var(--bgc) 0%,transparent 100%);opacity:.85;z-index:1}
.pc.member .ph::before{background:linear-gradient(180deg,#E6E6E6 0%,transparent 100%)}
.pc .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,var(--bgc) 100%)}
.pc.member .ph::after{background:linear-gradient(180deg,transparent 35%,#C8C8C8 100%)}
.pc>*{position:relative}
.pc .hd{display:flex;justify-content:space-between;align-items:flex-start;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.pc .hd span:last-child{text-align:right}
.pc .hd img{height:15px;width:auto;display:block;margin-bottom:6px}
.pc .jn{font-family:var(--f-serif);font-size:9rem;line-height:.82;margin-top:auto;letter-spacing:-.03em}
.pc .nick{font-size:1.45rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;margin-top:8px;overflow-wrap:anywhere}
.pc .style{font-family:var(--f-serif);font-style:italic;font-size:1.15rem;display:flex;align-items:center;gap:6px}
.pc .style svg.i{width:16px;height:16px}
.pc .stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid currentColor;margin-top:12px;padding-top:8px;gap:6px}
.pc .stats div{font-size:.52rem;text-transform:uppercase;letter-spacing:.16em;color:var(--dim)}
.pc .stats b{display:block;font-size:.95rem;color:var(--fg);letter-spacing:0;font-weight:600;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .ft{display:flex;justify-content:space-between;align-items:center;font-size:.52rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:10px}
.pc .ft .sps{display:flex;gap:4px}.pc .ft .sps svg.i{width:13px;height:13px}
@media (prefers-reduced-motion:no-preference){.pc{transition:transform .3s ease}.pc:hover{transform:translateY(-3px)}}

/* Lists */
.list{display:grid}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .nm{font-weight:600;overflow-wrap:anywhere}
.li .sub{font-size:.82rem;color:var(--muted)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-serif);font-size:1.2rem;border:1px solid var(--grey);overflow:hidden;background:#000;color:#fff;flex:none}
.av img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.av.offcourt{background:#fff;color:#000}.av.courtside{background:#969696;color:#000}
.av.none{background:none;color:var(--muted);border-style:dashed}
.rank{font-family:var(--f-serif);font-size:1.3rem;color:var(--muted);width:2ch;text-align:right}

/* Sessions */
.sess{background:var(--soft);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px}
.sess .dt{width:62px;border-radius:10px;background:var(--bg);display:grid;justify-items:center;padding:8px 0 10px;align-content:start}
.sess .dt small{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.sess .dt b{font-family:var(--f-serif);font-weight:400;font-size:2.2rem;line-height:1}
.sess .bd{display:grid;gap:10px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:5px}.meta svg.i{width:15px;height:15px}
.cap{height:4px;border-radius:9px;background:var(--line);position:relative;overflow:hidden}.cap i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:9px}
.faces{display:flex;flex-wrap:wrap}
.faces .av{width:30px;height:30px;font-size:.85rem;margin-right:-6px;border:2px solid var(--soft)}
.confirm{border:1.5px solid var(--ink);border-radius:var(--r);padding:14px;display:grid;gap:10px;background:var(--bg)}

/* Club feed */
.post{border-radius:var(--r);background:var(--soft);padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px}
.post h3{font-family:var(--f-serif);font-weight:400;font-size:1.6rem;line-height:1.1}

/* Forms */
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--ink)}
.field{display:grid;gap:8px;margin-bottom:18px}
.field label,.field .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;font-weight:700}
.req{color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none}
.inp{display:flex;align-items:center;gap:10px;border:1px solid var(--rule);border-radius:var(--r);padding:0 12px;background:var(--bg)}
.inp svg.i{color:var(--muted)}
.inp input{border:0!important;padding:12px 0!important;outline:none}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=search],input[type=url],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:var(--r);padding:12px;width:100%}
textarea{resize:vertical;min-height:80px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:none;color:var(--ink);border-radius:999px;padding:9px 15px;font-weight:500;text-align:left}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opts{display:grid;gap:8px}.opts .chip{border-radius:var(--r);padding:14px 16px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.pick button{display:grid;justify-items:center;gap:6px;border:1px solid var(--rule);border-radius:var(--r);background:none;padding:14px 8px;font-size:.78rem;font-weight:600;text-align:center}
.pick button svg.i{width:28px;height:28px}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.editions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.editions button{border:1px solid var(--rule);border-radius:12px;padding:0;background:none;text-align:left;overflow:hidden}
.editions button i{display:block;aspect-ratio:5/3;border-bottom:1px solid #969696}
.editions button span{display:block;padding:8px 10px 2px;font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.editions button small{display:block;font-size:.72rem;color:var(--muted);padding:0 10px 10px}
.editions button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.photo{display:flex;gap:14px;align-items:center}
.photo .pv{width:84px;height:84px;border-radius:50%;border:1px dashed var(--rule);overflow:hidden;display:grid;place-items:center;color:var(--muted);flex:none}
.photo .pv img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
input[type=range]{width:100%;accent-color:var(--ink)}
.result{background:var(--soft);border-radius:var(--r);padding:16px;display:grid;gap:6px}
.result b.big{font-family:var(--f-serif);font-weight:400;font-size:2.2rem;line-height:1}
.score{display:flex;align-items:baseline;gap:10px;font-family:var(--f-serif)}
.score b{font-weight:400;font-size:4rem;line-height:.9}.score span{font-size:1.5rem;color:var(--muted)}
.bar{height:4px;border-radius:9px;background:var(--line);position:relative;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:9px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.75rem;word-break:break-all;background:var(--soft);border-radius:var(--r);padding:10px;max-height:120px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;font-size:.85rem;z-index:20;max-width:calc(100% - 32px)}
.hero{display:grid;gap:12px}.hero h2{font-size:clamp(2.4rem,7vw,3.6rem)}
/* Courts */
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.court{background:var(--soft);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.court-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.court-body{border:1.5px solid var(--ink);border-radius:6px;padding:12px 8px;display:grid;grid-template-rows:auto auto auto;gap:6px;background:var(--bg);position:relative}
.court-body::before,.court-body::after{content:none}
.court-body::before{top:30%}.court-body::after{bottom:30%}
.court-body.volleyball::before,.court-body.volleyball::after{left:0;right:0}
.half{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 2px;min-height:64px;align-content:center;position:relative;z-index:1}
.net{position:relative;border-top:2.5px solid var(--ink);margin:4px -8px;z-index:1}
.net span{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--bg);padding:0 8px;font-size:.58rem;letter-spacing:.24em;font-weight:700}
.pl{position:relative;display:grid;justify-items:center;gap:2px;width:60px;padding:4px 0;border:0;background:none;text-align:center;border-radius:10px}
.pl .av{width:42px;height:42px;font-size:1.05rem}
.pl .pn{font-size:.72rem;font-weight:600;line-height:1.15;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .fine{font-size:.6rem}
.slot{width:42px;height:42px;border-radius:50%;border:1.5px dashed var(--rule);display:grid;place-items:center;color:var(--muted)}
.pl.sel .av,.pl.sel .slot{outline:3px solid var(--ink);outline-offset:2px}
.pl.me .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.qn{position:absolute;top:0;left:6px;z-index:2;background:var(--ink);color:var(--bg);font-size:.6rem;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stepper button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:10px}
.stepper button b{display:block;font-size:.85rem}
.stepper button[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stepper button[aria-current="step"] .fine{color:inherit;opacity:.7}
.stepper button[aria-current="step"] .qn{background:var(--bg);color:var(--ink)}
@media (max-width:560px){.stepper .fine{display:none}.stepper button{flex-direction:column;align-items:flex-start;padding:8px 10px;gap:4px}.stepper button b{font-size:.78rem;white-space:nowrap}}
.waits{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.wait{border:1.5px dashed var(--rule);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px}
.mini{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px}
.mini .half{min-height:0;gap:2px}
.mini .vs{font-family:var(--f-serif);font-style:italic;color:var(--muted)}
.court-body{color:var(--ink)}
.court-body .mark{position:absolute;inset:12px 8px;width:calc(100% - 16px);height:calc(100% - 24px);opacity:.16;pointer-events:none}
.court-body.volleyball .half,.court-body.basketball .half{display:grid;grid-template-columns:repeat(3,60px);justify-content:center}
.flag{font-size:.56rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:0 5px;line-height:1.5}
.tile.you .btn.inv{border-color:var(--bg);color:var(--bg)}.tile.you .btn.inv:not(.ghost){background:var(--bg);color:var(--ink)}
.lvl{display:flex;align-items:center;gap:6px;margin-top:4px}.lvl select{padding:5px 8px;width:auto;font-size:.8rem}
.qrov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.qrcard{background:#fff;color:#000;border-radius:20px;padding:24px;display:grid;gap:12px;justify-items:center;text-align:center;max-width:360px;width:100%}
.qrcard .muted,.qrcard .fine{color:#5C5C5C}.qrcard .btn.ghost{color:#000;border-color:#000}.qrcard .btn:not(.ghost){background:#000;color:#fff;border-color:#000}
#qrbox{padding:12px;background:#fff;border-radius:12px}#qrbox img,#qrbox canvas{display:block;max-width:100%}
/* desktop splits */
.split{display:grid;gap:24px;align-items:start}.split>.main,.split>.side{display:grid;gap:20px;min-width:0}
@media (min-width:1000px){.split{grid-template-columns:minmax(0,1fr) 340px}.split>.side{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));max-height:calc(100vh - 110px);overflow:auto;padding-right:2px}

@media (min-width:700px){.hstats.h4{grid-template-columns:repeat(4,minmax(0,1fr))!important}}
.tile.hs .fine{line-height:1.35}
.perks{display:grid;gap:2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0}
.perks>div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:10px 0}
.perks b{display:block;font-size:.95rem}
.perks small{color:var(--muted);font-size:.82rem}
/* steps: primary action full width on phones */
@media (max-width:560px){
  .stepnav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stepnav>.row{display:contents}
  .stepnav #next{grid-column:1/-1;order:-1;width:100%;justify-content:center}
  .stepnav #back,.stepnav #skip{width:100%;justify-content:center}
  .stepnav #back[hidden]+.row #skip{grid-column:1/-1}
}
/* admin */
details.fold summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"+";margin-left:auto;font-weight:400;font-size:1.1rem}
details.fold[open] summary::after{content:"–"}
details.fold .foldin{display:grid;gap:14px;margin-top:14px}
details.fold .foldin>.panel{padding:0;background:none}
details.fold .foldin>.panel>.ah:first-child{display:none}
.li.mlv{grid-template-columns:minmax(0,1fr) auto}
.li.mlv>.row{grid-column:1/-1;order:3}
details.manage summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--muted);text-decoration:underline}
details.manage summary::-webkit-details-marker{display:none}
#a-plist details.manage{grid-column:2/-1}
#a-plist .adm,#a-plist .memset{grid-column:auto;justify-self:auto}
.li.req{grid-template-columns:auto minmax(0,1fr)}
.li.req>.row{grid-column:2/-1}
/* footer */
.sign{align-items:center}
.sign .signout{margin:0 0 0 auto;letter-spacing:.04em;text-transform:none;font-size:.78rem}
@media (max-width:560px){.sign{display:grid;grid-template-columns:1fr auto;row-gap:6px}.sign>span:nth-child(2){grid-column:1}.sign .signout{grid-row:1;grid-column:2}}
@media (max-width:760px){.mini{display:flex;justify-content:center}.mini .pc{max-width:220px;padding:12px 14px;border-radius:14px}.mini .pc .jn{font-size:5rem}.mini .pc .nick{font-size:1rem}.mini .pc .stats{display:none}}
details.fold:not([open]){gap:0}
.pc .inf{font-size:1.5em;line-height:.8;vertical-align:-.08em;letter-spacing:0}
.li .inf{font-size:1.3em}
.mystrip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--ink);color:var(--bg);border:0;border-radius:var(--r);padding:14px 16px;font:inherit;cursor:pointer}
.mystrip b{display:block;font-size:.95rem}
.mystrip small{opacity:.7;font-size:.8rem}
.mysess .sec-h{display:flex;justify-content:space-between;align-items:center}
.mysess .linkbtn{display:inline-flex;align-items:center;gap:4px}
.mysess .linkbtn svg.i{width:14px;height:14px}
/* two-sided card */
.flip{perspective:1400px;cursor:pointer;width:100%;max-width:300px;margin:0 auto;-webkit-tap-highlight-color:transparent;outline:none}
.flip:focus-visible .flip-in{outline:2px solid var(--ink);outline-offset:4px;border-radius:18px}
.flip-in{position:relative;transition:transform .6s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip .face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .face.back{position:absolute;inset:0;transform:rotateY(180deg)}
.flip .face .pc{max-width:none;height:100%}
.flip .pc:hover{transform:none}
.flip.snapping .flip-in{transform:none;transition:none}
.flip.snapping .face.back{transform:none}
.fliphint{text-align:center;margin-top:-4px}
.pc.cback{align-items:stretch}
.cback .qrbox{margin:auto auto 0;width:62%;aspect-ratio:1;background:#fff;border-radius:12px;padding:8px;display:grid;place-items:center}
.cback .qrbox img{width:100%;height:100%;image-rendering:pixelated}
.cback .cb-code{text-align:center;font-family:var(--f-serif);font-size:1.7rem;margin-top:14px;letter-spacing:.02em}
.cback .cb-sub{text-align:center;font-size:.72rem;color:var(--dim);margin:6px 0 auto;line-height:1.4}
.cback .hd .num{font-family:var(--f-serif);font-size:1.6rem;letter-spacing:0;line-height:1}

/* =====================================================================
   Design system pass: one radius scale, calmer type, glass bars, soft motion.
   Radii are concentric: an inner surface = outer radius minus its padding.
   ===================================================================== */
:root{--r-xl:28px;--r-lg:22px;--r-md:14px;--r-sm:8px;--r:var(--r-lg);
  --line:rgba(255,255,255,.09);--rule:rgba(255,255,255,.22);--soft:#111112;--chip:#1A1A1C;
  --ease:cubic-bezier(.25,.8,.25,1)}
:root[data-theme="light"]{--soft:#F5F5F7;--line:rgba(0,0,0,.08);--rule:rgba(0,0,0,.18);--chip:#EDEDF0;--muted:#6E6E73}
body{font-size:16px;line-height:1.45;letter-spacing:-.005em;text-rendering:optimizeLegibility}

/* type: quieter caps, tighter headings */
.label,.ah,.field label,.field .lbl,.wkh{letter-spacing:.08em}
.label{font-size:.7rem}
.ah{font-size:.8rem}
.field label,.field .lbl{font-size:.74rem;font-weight:600}
h2{letter-spacing:-.02em}
.tagl{letter-spacing:.06em;font-weight:600;padding:4px 10px}

/* surfaces: large = lg, inner = md, tiny = sm */
.tile,.note,.empty,.sess,.post,.panel,.abody .panel,.nextcard,.secret,.acct,.mystrip,.memb,.refer,.court{border-radius:var(--r-lg)}
.act,.sig,.confirm,.wait,.paypick>*,.sess .empty,.court .empty{border-radius:var(--r-md)}
input.sc{min-height:36px}
.tile,.abody .panel,.nextcard,.sess,.post{padding:20px}
.abody .tile{border-radius:var(--r-md)}
.nextcard .tile{border-radius:var(--r-md)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=search],input[type=url],select,textarea,.gate-card input{border-radius:var(--r-md);min-height:48px}
textarea{min-height:96px}
.sess .dt,.nexts .dt,.dt,.editions button,.lvl-pick button,.paydet,#qrbox,.invqr,.crop-frame,.pl,.photo .pv,.act .ic-bub{border-radius:var(--r-md)}
.cback .qrbox{border-radius:var(--r-md)}
.chk .box,.mini-dt,.court-body,.pc .cqr img{border-radius:var(--r-sm)}
.crop-box,.qrcard,.gate-card{border-radius:var(--r-xl)}
.cap,.cap i,.bar,.bar i,.steps i{border-radius:999px}
.tabs button,.anav button{border-radius:999px}
@media (min-width:1000px){.anav button{border-radius:var(--r-md)}}
/* the player card: one radius at every size */
.pc,#v-create .pc,.mini .pc,.flip:focus-visible .flip-in{border-radius:20px}
@media (max-width:760px){#v-create .pc,.mini .pc{border-radius:16px}}

/* controls: one height per size, no shouting */
.btn{min-height:44px;padding:0 20px;font-weight:600;letter-spacing:0;font-size:.88rem;transition:transform .15s var(--ease),opacity .15s,background .2s,color .2s}
.btn.sm{min-height:34px;padding:0 14px;font-size:.8rem}
.btn:active,.chip:active,.sp:active,.anav button:active,.tabs button:active{transform:scale(.97)}
.chip{min-height:38px;padding:0 15px;transition:background .2s,color .2s,border-color .2s}
.chip.sm{min-height:30px;padding:0 11px}
.sp{min-height:38px;padding:0 14px 0 10px;border-color:var(--rule);background:transparent;transition:background .2s,color .2s}
.btn:focus-visible,.chip:focus-visible,.sp:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}

/* glass bars */
.top{background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
@media (max-width:760px){
  .top .tabs{background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
  .tabs button{border-radius:var(--r-md)}
}
.anav{background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
@media (min-width:1000px){.anav{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border:0}}

/* lists: hairlines */
.li{border-bottom:.5px solid var(--line)}
.list>.li:last-child{border-bottom:0}

/* motion: views fade in, cards lift */
.view:not([hidden]){animation:fadeup .35s var(--ease)}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{border-radius:999px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
@media (prefers-reduced-motion:reduce){.view:not([hidden]){animation:none}.btn:active,.chip:active,.sp:active{transform:none}}
.inv.one{grid-template-columns:1fr}
/* one button size everywhere */
.btn,.btn.sm{min-height:44px;padding:0 18px;font-size:.86rem;font-weight:600;gap:8px}
.chip,.chip.sm,.sp{min-height:44px;padding:0 16px;font-size:.86rem}

.pc .tagl{background:rgba(255,255,255,.14)}
/* text buttons */
details.manage summary,.linkbtn{text-decoration:none;color:var(--muted);font-weight:600;font-size:.82rem}
details.manage summary::after{content:"›";font-size:1.1em;line-height:1;margin-left:2px;transition:transform .2s}
details.manage[open] summary::after{transform:rotate(90deg)}
details.manage summary:hover,.linkbtn:hover{color:var(--ink)}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px 16px;overflow:auto}

/* Firebase bridge for the hosted BAD App.
   The app was built against a small document-store API (doc/collection/get/set/update/delete/onSnapshot).
   Firestore's compat SDK has the same shape, so this file only provides sign-in and the `window.claude.use()` entry point. */
(function(){
  const cfg=window.BAD_FIREBASE;
  window.BAD_WEB=true;
  if(!cfg||!cfg.apiKey){const g=document.createElement('div');g.id='gate';g.innerHTML=`<div class="gate-card"><img src="${typeof LOGO!=='undefined'?LOGO.badW:''}" alt="BAD" style="height:40px"><h2>The BAD App is on its way.</h2><p class="muted">We were all BAD players once. See you on court soon.</p></div>`;document.body.appendChild(g);document.documentElement.classList.add('gated');return}
  firebase.initializeApp(cfg);
  const auth=firebase.auth(),fs=firebase.firestore();
  try{fs.settings({ignoreUndefinedProperties:true})}catch(e){console.warn(e)}
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(_){}
  const OWNER_EMAILS=(window.BAD_ADMINS||[]).map(e=>e.toLowerCase());

  /* ---------- sign-in screen ---------- */
  const gate=document.createElement('div');gate.id='gate';gate.hidden=true;
  gate.innerHTML=`<div class="gate-card">
    <h2 class="gate-h">Welcome to <img class="inline-logo logo-l" src="${typeof LOGO!=="undefined"?LOGO.badK:""}" alt="BAD"><img class="inline-logo logo-d" src="${typeof LOGO!=="undefined"?LOGO.badW:""}" alt="BAD"></h2>
    <p class="muted">Sign in to get your player card, join sessions and earn points.</p>
    <button class="btn wide" id="g-google"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5a4.3 4.3 0 0 1-1.9 2.8v2.3h3c1.8-1.6 2.9-4 2.9-6.8z" fill="none"/><circle cx="12" cy="12" r="8.5"/><path d="M12 12h8.4"/></svg>Continue with Google</button>
    <div class="or"><span>or use email</span></div>
    <form id="g-form" class="sec" novalidate>
      <input type="email" id="g-email" placeholder="you@email.com" autocomplete="email" required>
      <input type="password" id="g-pass" placeholder="Password (6+ characters)" autocomplete="current-password" required minlength="6">
      <div class="row"><button class="btn" type="submit" id="g-in">Sign in</button><button class="btn ghost" type="button" id="g-up">Create account</button></div>
      <button class="linkbtn" type="button" id="g-reset">Forgot password?</button>
    </form>
    <p class="fine" id="g-msg" role="status"></p>
    <p class="fine">We only use your email to run sessions and keep your points. We never share it.</p>
  </div>`;
  document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(gate));
  if(document.body)document.body.appendChild(gate);
  const msg=t=>{const m=document.getElementById('g-msg');if(m)m.textContent=t};
  const nice=e=>({'auth/invalid-credential':'That email and password don’t match. Please try again.','auth/user-not-found':'No account with that email yet. Tap Create account.','auth/wrong-password':'That password isn’t right. Please try again.','auth/email-already-in-use':'You already have an account. Tap Sign in.','auth/weak-password':'Please use at least 6 characters.','auth/invalid-email':'Please check the email address.','auth/popup-closed-by-user':'Sign-in was closed. Please try again.','auth/unauthorized-domain':'This web address isn’t allowed yet. An admin needs to add it in Firebase.'}[e&&e.code]||'Sorry, that didn’t work. Please try again.');
  gate.addEventListener('click',async ev=>{
    const id=ev.target.closest('button')?.id;if(!id)return;
    const email=document.getElementById('g-email').value.trim(),pass=document.getElementById('g-pass').value;
    try{
      if(id==='g-google'){const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
        try{await auth.signInWithPopup(p)}catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')await auth.signInWithRedirect(p);else throw e}}
      if(id==='g-up'){if(!email||pass.length<6){msg('Please enter your email and a password of 6+ characters.');return}await auth.createUserWithEmailAndPassword(email,pass)}
      if(id==='g-reset'){if(!email){msg('Type your email above first, then tap Forgot password.');return}await auth.sendPasswordResetEmail(email);msg('Check your inbox for a reset link.')}

function bwFromImg(img){const s=360,c=document.createElement('canvas');c.width=s;c.height=s;const x=c.getContext('2d');
  const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
  const d=x.getImageData(0,0,s,s),a=d.data;for(let i=0;i<a.length;i+=4){let y=.299*a[i]+.587*a[i+1]+.114*a[i+2];y=Math.max(0,Math.min(255,(y-128)*1.12+128));a[i]=a[i+1]=a[i+2]=y}
  x.putImageData(d,0,0);return c.toDataURL('image/jpeg',.72)}
function toBW(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{try{res(bwFromImg(img))}catch(e){rej(e)}};img.src=r.result};r.readAsDataURL(file)})}
/* full black-and-white source (keeps shape) for the cropper */
function bwSource(img,max=1100){const k=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  const d=x.getImageData(0,0,w,h),a=d.data;for(let i=0;i<a.length;i+=4){let y=.299*a[i]+.587*a[i+1]+.114*a[i+2];y=Math.max(0,Math.min(255,(y-128)*1.12+128));a[i]=a[i+1]=a[i+2]=y}x.putImageData(d,0,0);return c.toDataURL('image/jpeg',.85)}

/* account photo (e.g. Google) turned black and white; quietly skipped if the browser won't allow it */
function toBWUrl(url){return new Promise(res=>{if(!url)return res('');const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{try{res(bwSource(img))}catch(_){res('')}};img.onerror=()=>res('');img.src=url.replace(/=s\d+-c$/,'=s400-c')})}

function codeInfo(raw){const c=normCode(raw);if(!c)return null;
  const a=(S.codes||{})[c];if(a)return a.off?{kind:'off',code:c}:{kind:'club',code:c,label:a.label||'BAD club code',pts:+a.pts||CFG.referee};
  for(const [uid,p] of Object.entries(S.profiles||{}))if(refsOf(p).some(r=>{const n=normCode(r);return n===c||n===c.replace(/^(.*\D)(\d)$/,'$10$2')}))return{kind:'member',code:c,uid,name:p.nickname||'a BADDIE'};
  return{kind:'none',code:c}}

/* ---------- membership: players pick a type, admins verify it ---------- */
const MEM_DEFAULT=[{k:'Guest',verify:false,d:'New, or dropping in now and then'},{k:'Baddie',verify:true,d:'Plays with us regularly'},{k:'Crew',verify:true,staff:true,d:'Helps run sessions and events'},{k:'Community Manager',verify:true,staff:true,admin:true,d:'Looks after the community'},{k:'Founder',verify:true,staff:true,admin:true,d:'Started BAD'}];
const MEM_OLD={'Drop-in':'Guest'};
const memTypes=()=>(S.memCfg&&S.memCfg.types&&S.memCfg.types.length)?S.memCfg.types:MEM_DEFAULT;
const memType=k=>memTypes().find(t=>t.k===(MEM_OLD[k]||k));
const memPick=()=>memTypes().filter(t=>!t.staff);
const memLabel=uid=>{const m=uid&&memStatus(uid);return m&&m.state==='verified'?m.type:'Guest'};
function memStatus(uid){const p=S.profiles[uid]||{},v=(S.members||{})[uid]||{},want=MEM_OLD[p.memReq?.type]||p.memReq?.type||'Guest',t=memType(want);
  if(v.type&&v.type===want)return{type:want,state:'verified',at:v.at};
  if(!t||!t.verify)return{type:want,state:'open'};
  if(v.declined===want)return{type:want,state:'declined'};
  return{type:want,state:'pending',at:p.memReq?.at}}
const uidOfProfile=p=>Object.keys(S.profiles||{}).find(k=>S.profiles[k]===p);

/* admin access: owner emails from config, plus anyone in admins/{email} */
const isAdminEmail=e=>{e=String(e||'').toLowerCase();return !!e&&((window.BAD_ADMINS||[]).map(x=>x.toLowerCase()).includes(e)||!!(S.admins||{})[e])};
const lvAdmin=k=>{const t=memType(k);return t&&('admin' in t)?!!t.admin:!!(MEM_DEFAULT.find(d=>d.k===k)||{}).admin};
const fmtD=x=>{if(!x)return'';const d=new Date(String(x).length===10?x+'T12:00:00':x);return isNaN(d)?String(x):d.toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'Asia/Dubai'})};
const isFounder=uid=>!!uid&&memStatus(uid).state==='verified'&&memStatus(uid).type==='Founder';

/* back of the card: invite QR and code */
function cardBackHTML(p,st){
  const member=st.earned>=CFG.member,ed=member?'member':(p.edition||'oncourt'),logo=ed==='oncourt'?LOGO.badW:LOGO.badK;
  const code=p.ref||'',qr=code&&typeof qrData==='function'?qrData(inviteUrl(code),400):'',uid=uidOfProfile(p),m=uid?memStatus(uid):null;
  const since=p.createdAt?new Date(p.createdAt).toLocaleDateString('en-GB',{month:'short',year:'numeric'}):'';
  return `<div class="pc ${ed} cback"><div class="hd"><span><img src="${logo}" alt="BAD">Invite</span><span class="num">${esc(jersey(p))}</span></div>
    <div class="qrbox">${qr?`<img src="${qr}" alt="QR code to join BAD with ${esc(p.nickname||'this')} card">`:`<span class="fine">QR appears once your card is saved</span>`}</div>
    <div class="cb-code num">${esc(code||'—')}</div>
    <div class="cb-sub">Scan to join BAD.<br>Use my code when you sign up.</div>
    <div class="ft"><span>${m&&m.state==='verified'?esc(m.type):'Guest'}</span><span class="num">${since?'Since '+esc(since):'Est. 2024'}</span></div>
  </div>`}

/* ---------- admin roles ----------
   owner: everything, set in config.js
   founder: everything, can add and remove admins (not owners)
   app: helps build the app: everything except managing admins
   cm: community manager for chosen sports: their sessions, courts, players and posts */
const ROLES={owner:{k:'Owner',d:'Full access. Set in the app settings file.'},founder:{k:'Founder admin',d:'Full access. Can add and remove admins.'},app:{k:'App admin',d:'Helps build the app. Everything except managing admins.'},cm:{k:'Community manager',d:'Runs their own sport: sessions, courts, players and posts.'}};
const myRole=()=>S.canEdit?((window.BAD_USER&&window.BAD_USER.role)||'owner'):'';
const mySports=()=>(window.BAD_USER&&window.BAD_USER.sports)||[];
const fullAdmin=()=>['owner','founder','app'].includes(myRole());
const canManageAdmins=()=>['owner','founder'].includes(myRole());
const canSport=k=>fullAdmin()||(myRole()==='cm'&&mySports().includes(k||'badminton'));
const adminRec=e=>{e=String(e||'').toLowerCase();if((window.BAD_ADMINS||[]).map(x=>x.toLowerCase()).includes(e))return{role:'owner',sports:[]};const a=(S.admins||{})[e];return a?{role:a.role||'founder',sports:a.sports||[]}:null};
const roleLabel=r=>!r?'':r.role==='cm'?`Community manager · ${(r.sports||[]).map(k=>SPORTS[k]?.club||k).join(', ')||'no sport yet'}`:(ROLES[r.role]||{}).k||'Admin';

/* ---------- register / edit card ---------- */
let D={},step=0,quiz=null;
const STEPS=['About you','Your look','Your activities','Your levels','Your signature'];
const okEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||'').trim());
const okMobile=v=>String(v||'').replace(/\D/g,'').length>=8;
const numTaken=n=>{if(n==='')return null;for(const [uid,p] of Object.entries(S.profiles||{}))if(uid!==S.uid&&!p.sample&&String(p.number)===String(+n))return p.nickname||'another player';return null};
function numHint(n){if(n==='')return 'Pick your jersey number, 0 to 99.';const t=numTaken(n);return t?`${t} also wears ${+n}. You can still use it, or pick another.`:`${+n} is yours. You can change it any time.`}
function freeNumber(){for(let i=0;i<40;i++){const n=String(Math.floor(Math.random()*99)+1);if(!numTaken(n))return n}return String(Math.floor(Math.random()*99)+1)}
function memHint(k){const t=memType(k);return !t||!t.verify?'No check needed.':'An admin will verify this. Your card shows it once it’s confirmed.'}
function startCreator(existing){
  D=existing?{...existing,types:{...(existing.types||{})},sports:[...(existing.sports||['badminton'])]}:{nickname:'',listName:'',number:freeNumber(),edition:'oncourt',photo:'',sports:[],primary:'',types:{},levels:{},level:1,hand:'Right',shot:'',email:'',mobile:'',instagram:'',referredBy:''};
  if(existing){const c=S.contacts[S.uid]||S.myContact||{};D.email=c.email||'';D.mobile=c.mobile||c.whatsapp||'';D.instagram=c.instagram||'';if(!D.types.badminton&&existing.style)D.types.badminton=existing.style;D.levels={...(existing.levels||{})};for(const k of D.sports)if(D.levels[k]==null&&!LEVEL_FREE.includes(k)&&existing.level!=null)D.levels[k]=existing.level}
  if(!existing){const U=window.BAD_USER||{},full=(U.name||'').trim();if(S.pendingRef)D.referredBy=S.pendingRef;
    D.email=U.email||'';D.listName='';D.nickname=(full.split(/\s+/)[0]||'').slice(0,16);D._acctEmail=!!U.email;
    if(U.photo)toBWUrl(U.photo).then(async src=>{if(!src||D.photo)return;D._src=src;D._crop={z:1,x:0,y:0,b:0};try{D.photo=await renderCrop(src,D._crop)}catch(_){return}if(S.view==='create'){preview();if(step===1)renderStep()}})}
  D.memType=(existing&&existing.memReq&&existing.memReq.type)||D.memType||'Guest';if(MEM_OLD[D.memType])D.memType=MEM_OLD[D.memType];
  D._editing=!!existing;step=0;quiz=null;setView('create');
}
function preview(){const k=keyOf(D.listName||D.nickname);const st=statsFor(k);if(!profileByKey(k)){st.earned+=CFG.welcome;st.balance+=CFG.welcome}$('preview').innerHTML=cardHTML(D,st)}
function chips(name,opts,cur,attr='f'){return `<div class="chips" role="group">${opts.map(o=>`<button type="button" class="chip" data-${attr}="${name}" data-val="${esc(o)}" aria-pressed="${o===cur}">${esc(o)}</button>`).join('')}</div>`}

  if(step===0)return D.nickname.trim()&&okEmail(D.email)&&okMobile(D.mobile);
  return true;
}

    on('c-nick','nickname');on('c-email','email');on('c-mob','mobile');on('c-ig','instagram');on('c-ref','referredBy',v=>v.trim().toUpperCase().slice(0,16));

  if(step===1){
    el.innerHTML=head(1)+`
      <div class="field"><span class="lbl">Profile photo <span class="req">optional</span></span><div class="photo"><div class="pv">${D.photo?`<img src="${esc(D.photo)}" alt="Your photo">`:ic('camera')}</div>
        <div class="row"><button type="button" class="btn ghost sm" id="ph-add">${ic('camera')}${D.photo?'Change photo':'Add a photo'}</button>${D.photo?`<button type="button" class="btn ghost sm" id="ph-crop">${ic('edit')}Adjust</button><button type="button" class="btn ghost sm" id="ph-rm">${ic('x')}Remove</button>`:''}</div></div>

        <p class="fine">At ${CFG.member} lifetime points, your card turns silver.</p></div>`;
    $('ph-add').onclick=()=>$('photo-in').click();const rm=$('ph-rm');if(rm)rm.onclick=()=>{D.photo='';D._src='';renderStep()};const cr=$('ph-crop');if(cr)cr.onclick=()=>openCropper(D._src||D.photo);

$('back').onclick=()=>{if(step===0){setView('card');return}step=Math.max(0,step-1);quiz=null;renderStep()};
const saveNow=()=>{if(step===0&&!stepValid())return;step=5;renderStep();saveProfile()};

/* ---------- crop & adjust: drag to move, pinch or slider to zoom, brightness ---------- */
const CROP_W=600,CROP_H=520;
async function renderCrop(src,c){const img=await loadImg(src),cv=document.createElement('canvas');cv.width=CROP_W;cv.height=CROP_H;const x=cv.getContext('2d');
  const base=Math.max(CROP_W/img.width,CROP_H/img.height),sc=base*c.z,w=img.width*sc,h=img.height*sc;

function myActivity(){
  const b=S.bookings[S.uid]?.s||{},rows=[];
  for(const [sid,x] of Object.entries(b)){const s=S.sessions[sid];if(!s)continue;
    const started=Date.now()>sessStart(s),r=roster(sid),inside=r.in.some(e=>e.uid===S.uid&&!e.guest),wait=r.wait.some(e=>e.uid===S.uid&&!e.guest);
    const guests=(x.guests||[]).filter(g=>!g.out||r.late.some(e=>e.uid===S.uid&&e.guest===g.n)).length;
    let status,amount=0;
    if(x.out){const f=feeFor(s,x.out);status=f.amount?'Dropped late':'Dropped';amount=f.amount}
    else if(inside){status=started?'Played':'Booked';amount=(Number(s.fee)||0)*(1+guests)}
    else if(wait){status=started?'Missed (waitlist)':'Waitlist'}
    else continue;
    const pay=S.payments[sid]?.[S.uid];
    const payState=!amount?'none':pay?.ok?'paid':x.sent?'sent':'pending';
    rows.push({sid,s,x,status,amount,guests,payState,games:gamesFor(sid,S.uid),method:x.pay||'cash'});
  }
  return rows.sort((a,b)=>sessStart(b.s)-sessStart(a.s));
}

    rr(0,0,cv.width,cv.height,rad+bw);x.fillStyle='#FFFFFF';x.fill();

    if(pr&&url){try{const img=await loadImg(url);const px=Math.floor(bw+(pr.left-nr.left)*SC),py=Math.floor(bw+(pr.top-nr.top)*SC),pw=Math.ceil(pr.width*SC),phh=Math.round(pr.height*SC),k=Math.max(pw/img.width,phh/img.height),dw=img.width*k,dh=img.height*k;
      x.save();x.beginPath();x.rect(px,py,pw,phh);x.clip();x.globalAlpha=placeholder?.85:1;x.filter='grayscale(1) contrast(1.05)';x.drawImage(img,px+(pw-dw)/2,py+(phh-dh)/2,dw,dh);x.filter='none';x.globalAlpha=1;

const mk=d=>`<svg class="mark" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="currentColor" vector-effect="non-scaling-stroke">${d}</g></svg>`;
const MARK={ /* horizontal courts, net at x=50, drawn to each sport's real proportions */
 badminton:mk('<path d="M0 7.5H100M0 92.5H100M35.2 0V100M64.8 0V100M5.7 0V100M94.3 0V100M0 50H35.2M64.8 50H100" vector-effect="non-scaling-stroke"/>'),

};
S.live={};S.games={};S.scores={};S.courtSid=null;let sel=null,liveQ=Promise.resolve();

const gpid=(uid,name)=>`g~${uid}~${slug(name)}`;
function people(sid){
  const m={},r=roster(sid);

    if(e.guest)m[gpid(e.uid,e.guest)]={name:e.guest,guestOf:e.uid};
    else{const p=S.profiles[e.uid];m[e.uid]={name:p?.nickname||allKeys()[e.key]||e.key||'Player',p,uid:e.uid}}

  for(const g of Object.values(S.games))if(g.names&&g.names[pid])return{name:g.names[pid]};return{name:'Player'}}

const sessGames=sid=>Object.entries(S.games).filter(([,g])=>g.sid===sid).sort((a,b)=>(a[1].at||'').localeCompare(b[1].at||''));
const gamesFor=(sid,pid)=>sessGames(sid).filter(([,g])=>[...g.a,...g.b].includes(pid)).length;

function scoreOf(gid,g){
  if(g.final)return{s:g.final,st:'confirmed'};
  const subs=[...g.a,...g.b].map(p=>S.scores[p]?.g?.[gid]).filter(Boolean);
  if(!subs.length)return null;

  return uniq.length===1?{s:subs[0],st:'reported'}:{s:subs[0],st:'disputed'};
}
function rankRows(sport){
  const t={};
  for(const [gid,g] of Object.entries(S.games)){if(sport!=='all'&&g.sport!==sport)continue;const sc=scoreOf(gid,g);if(!sc||sc.st==='disputed')continue;
    const [a,b]=sc.s.map(Number);for(const [team,mine,theirs] of [[g.a,a,b],[g.b,b,a]])for(const pid of team){if(!S.profiles[pid])continue;
      const r=t[pid]||(t[pid]={pid,g:0,w:0,d:0});r.g++;if(mine>theirs)r.w++;r.d+=mine-theirs}}
  return Object.values(t).sort((x,y)=>y.w-x.w||(y.w/y.g)-(x.w/x.g)||y.d-x.d);
}

/* ---------- board state helpers ---------- */
function courtSessions(){
  const now=Date.now();
  return Object.entries(S.sessions).filter(([sid,s])=>(s.sport||'badminton')===S.courtSport&&(S.live[sid]?sessStart(s)>now-18*36e5:(S.canEdit?sessStart(s)>now-12*36e5&&sessStart(s)<now+7*864e5:Math.abs(sessStart(s)-now)<12*36e5)))
    .sort((a,b)=>sessStart(a[1])-sessStart(b[1]));

const clone=o=>JSON.parse(JSON.stringify(o));
const norm=lv=>{lv.waiting=lv.waiting||[];lv.out=lv.out||[];lv.walkins=lv.walkins||[];lv.checkin=lv.checkin||{};lv.avail=lv.avail||{};lv.order=lv.order||'arrival';return lv};
const hhmm=iso=>iso?new Date(iso).toLocaleTimeString('en-GB',{timeZone:'Asia/Dubai',hour:'numeric',minute:'2-digit',hour12:true}).replace(' ',''):'';
const arrivals=lv=>Object.entries(lv.checkin).sort((a,b)=>a[1].localeCompare(b[1])).map(([p])=>p);
const placed=lv=>new Set([...lv.courts,...lv.waiting].flatMap(c=>c.on).filter(Boolean));
/* Bench = checked-in players who are not on a court or waiting. Default order: first come, first served
   (check-in time, then the time their last game ended). Late arrivals join at the back; nobody jumps ahead for having fewer games. */
function benchOf(sid,lv){norm(lv);const p=placed(lv),out=new Set(lv.out);
  return Object.keys(lv.checkin).filter(x=>!p.has(x)&&!out.has(x)).map(x=>({x,t:lv.avail[x]||lv.checkin[x],c:lv.checkin[x],g:gamesFor(sid,x)}))
    .sort((a,b)=>(!!(lv.rest||{})[a.x]-!!(lv.rest||{})[b.x])||(lv.catchup?(a.g-b.g||a.t.localeCompare(b.t)):a.t.localeCompare(b.t))).map(o=>o.x)}
const isRest=(lv,p)=>!!(lv.rest||{})[p];
function detach(lv,pid){for(const c of [...lv.courts,...lv.waiting])c.on=c.on.map(x=>x===pid?null:x);lv.out=lv.out.filter(x=>x!==pid)}
function locate(lv,pid){for(const [k,arr] of [['c',lv.courts],['w',lv.waiting]])for(let ci=0;ci<arr.length;ci++){const i=arr[ci].on.indexOf(pid);if(i>=0)return[k,ci,i]}return null}
const blank=(size)=>Array(size).fill(null);
function saveLive(sid,lv){lv.updatedAt=new Date().toISOString();S.live[sid]=lv;renderCourts();
  liveQ=liveQ.then(()=>S.db.doc('live/'+sid).set(lv)).catch(()=>toast("Sorry, the court board didn't save. Please try again."))}

  toast('Court board is open. Next, check players in as they arrive.')}

/* ---------- actions (placing players is admin-only) ---------- */
function bindCourts(el){el.onclick=async ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,sid=S.courtSid;
  if(act==='sport'){S.courtSport=b.dataset.v;S.courtSid=null;sel=null;pendingDone=null;return renderCourts()}
  if(act==='goadmin'){return setView('admin')}
  if(act==='rest'||act==='more'){return setFlag(sid,act,b.dataset.v==='1')}
  if(act==='pick'){S.courtSid=b.dataset.sid;sel=null;pendingDone=null;return renderCourts()}
  if(act==='as'){S.asPlayer=b.dataset.v==='1';sel=null;return renderCourts()}
  if(act==='step'){S.courtStep=+b.dataset.n;sel=null;pendingDone=null;window.scrollTo(0,0);return renderCourts()}
  if(act==='myscore'||act==='final'){const gid=b.dataset.gid,a=$('ga-'+gid).value,bb=$('gb-'+gid).value;if(a===''||bb===''){toast('Please enter both scores.');return}
    const v=[Number(a),Number(bb)];
    try{if(act==='final')await S.db.doc('games/'+gid).update({final:v});else{const cur=S.scores[S.uid]?.g||{};await S.db.doc('scores/'+S.uid).set({g:{...cur,[gid]:v}})}toast('Score saved. Thank you.')}catch(e){toast("Sorry, the score didn't save.")}return}
  if(!S.canEdit||!canSport(S.courtSport))return;
  if(act==='start'){S.courtStep=1;return startBoard(sid)}
  const lv=norm(clone(S.live[sid])),arr=k=>k==='w'?lv.waiting:lv.courts,sp=S.sessions[sid].sport||'badminton';
  if(act==='bench'){sel=sel===b.dataset.pid?null:b.dataset.pid;return renderCourts()}
  if(act==='qr')return showQR(sid);
  if(act==='catchup'){lv.catchup=!lv.catchup;toast(lv.catchup?'Catch-up on: fewest games are called first.':'Back to first come, first served.');return saveLive(sid,lv)}
  if(act==='orest'){lv.rest=lv.rest||{};lv.ft=lv.ft||{};lv.rest[sel]=!lv.rest[sel];lv.ft[sel]=new Date().toISOString();sel=null;return saveLive(sid,lv)}
  if(act==='ci'){const p=b.dataset.pid;lv.checkin[p]=new Date().toISOString();toast(`${who(sid,p).name} checked in · #${Object.keys(lv.checkin).length}`);return saveLive(sid,lv)}
  if(act==='unci'){const p=b.dataset.pid;delete lv.checkin[p];delete lv.avail[p];detach(lv,p);return saveLive(sid,lv)}
  if(act==='order'){lv.order=b.dataset.v;return saveLive(sid,lv)}
  if(act==='unsel'){sel=null;return renderCourts()}
  if(act==='pt'){const c=lv.courts[+b.dataset.c],t=+b.dataset.t;c.score=c.score||[0,0];c.score[t]=Math.max(0,c.score[t]+(+b.dataset.d));return saveLive(sid,lv)}
  if(act==='askdone'){pendingDone=+b.dataset.c;return renderCourts()}
  if(act==='nodone'){pendingDone=null;return renderCourts()}
  if(act==='slot'){const c=arr(b.dataset.k)[+b.dataset.c],i=+b.dataset.i,cur=c.on[i];
    if(!sel){if(cur){sel=cur;renderCourts()}return}
    if(cur===sel){sel=null;return renderCourts()}
    const from=locate(lv,sel);detach(lv,sel);
    if(cur){detach(lv,cur);if(from)arr(from[0])[from[1]].on[from[2]]=cur}
    c.on[i]=sel;sel=null;return saveLive(sid,lv)}
  if(act==='tobench'){detach(lv,sel);sel=null;return saveLive(sid,lv)}
  if(act==='out'){detach(lv,sel);lv.out.push(sel);toast(`${who(sid,sel).name} is marked as left.`);sel=null;return saveLive(sid,lv)}
  if(act==='restore'){lv.out=lv.out.filter(x=>x!==b.dataset.pid);return saveLive(sid,lv)}
  if(act==='walk'){const n=$('walk-name').value.trim().slice(0,24);if(!n){toast("Please type the player's name.");return}
    const wid=slug(n)+'-'+Date.now().toString(36);lv.walkins.push({id:wid,name:n});lv.checkin['w~'+wid]=new Date().toISOString();toast(`${n} is checked in.`);return saveLive(sid,lv)}
  if(act==='add'){const k=b.dataset.k,size=(k==='w'&&lv.courts[0]?.size)||SIZES[sp][0][0];
    if(k==='c')lv.courts.push({id:'c'+Date.now().toString(36),name:'Court '+(lv.courts.length+1),size,on:blank(size)});else lv.waiting.push({id:'w'+Date.now().toString(36),size,on:blank(size)});return saveLive(sid,lv)}
  if(act==='wless'){const i=lv.waiting.map(w=>w.on.some(Boolean)).lastIndexOf(false);lv.waiting.splice(i>=0?i:lv.waiting.length-1,1);return saveLive(sid,lv)}
  if(act==='del'){arr(b.dataset.k).splice(+b.dataset.c,1);return saveLive(sid,lv)}
  if(act==='size'){const c=arr(b.dataset.k)[+b.dataset.c],n=+b.dataset.n,on=c.on.filter(Boolean);c.size=n;c.on=blank(n);on.slice(0,n).forEach((p,i)=>c.on[i]=p);
    lv.waiting.forEach(w=>{if(!w.on.some(Boolean)){w.size=n;w.on=blank(n)}});return saveLive(sid,lv)}
  if(act==='fill'){const c=arr(b.dataset.k)[+b.dataset.c],bench=benchOf(sid,lv).filter(p=>!isRest(lv,p));c.on=c.on.map(p=>p||bench.shift()||null);return saveLive(sid,lv)}
  if(act==='done'){const ci=+b.dataset.c,c=lv.courts[ci],half=c.size/2,a=c.on.slice(0,half).filter(Boolean),bb=c.on.slice(half).filter(Boolean);
    if(!a.length||!bb.length){toast('Please put players on both sides first.');return}
    const names={};[...a,...bb].forEach(p=>names[p]=who(sid,p).name);
    const g={sid,sport:sp,court:c.name,a,b:bb,names,at:new Date().toISOString()};
    if(!b.dataset.noscore){const sa=$('sa-'+ci).value,sb=$('sb-'+ci).value;if(sa===''||sb===''){toast('Please enter both scores, or tap Skip score.');return}g.final=[Number(sa),Number(sb)]}
    try{await S.db.doc('games/'+sid+'-'+Date.now().toString(36)).set(g)}catch(e){toast("Sorry, the game didn't save.");return}
    pendingDone=null;const endT=new Date().toISOString();[...a,...bb].forEach(p=>lv.avail[p]=endT);c.on=blank(c.size);c.score=[0,0];
    const nx=lv.waiting[0];
    if(nx&&nx.on.some(Boolean)){if(nx.size===c.size)c.on=[...nx.on];else nx.on.filter(Boolean).slice(0,c.size).forEach((p,i)=>c.on[i]=p);
      lv.waiting.shift();lv.waiting.push({id:'w'+Date.now().toString(36),size:nx.size,on:blank(nx.size)});toast(`Game saved. Next up is on ${c.name}.`)}
    else toast(`Game saved. ${c.name} is free.`);
    return saveLive(sid,lv)}
}}

const _qrCache={};
function qrData(text,size=240){const k=size+'|'+text;if(_qrCache[k])return _qrCache[k];if(!window.QRCode)return '';
  const d=document.createElement('div');try{new QRCode(d,{text,width:size,height:size,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(_){return ''}
  const c=d.querySelector('canvas');const u=c?c.toDataURL('image/png'):(d.querySelector('img')?.src||'');if(u)_qrCache[k]=u;return u}

const effLevel=(uid,sp)=>{const o=S.levels[uid];if(o&&o.levels&&o.levels[sp]!=null)return o.levels[sp];if(o&&o.level!=null&&!o.levels)return o.level;return ownLevel(uid,sp)};

    const lv=norm(clone(lv0)),ppl=people(sid);let changed=false;lv.rest=lv.rest||{};lv.more=lv.more||{};lv.ft=lv.ft||{};

  const players=Object.entries(S.profiles).map(([uid,p])=>{const s=statsFor(p.listKey),c=S.contacts[uid]||{};return[p.nickname||'',p.listName||'',c.email||'',c.mobile||c.whatsapp||'',c.instagram||'',(p.sports||['badminton']).map(k=>SPORTS[k]?.club||k).join(', '),typeOf(p),jersey(p),(EDITIONS.find(e=>e[0]===p.edition)||EDITIONS[0])[1],(p.sports||['badminton']).filter(k=>!LEVEL_FREE.includes(k)).map(k=>`${SPORTS[k]?.club||k}: ${LEVELS[effLevel(uid,k)??1]}`).join(', '),p.hand||'',p.shot||'',s.earned,s.balance,s.sessions,nsCount(p.listKey),p.ref||'',p.referredBy||'',(p.createdAt||'').slice(0,10),(p.updatedAt||'').slice(0,10)]});

    const r=roster(sid);const row=(e,status,fee)=>[s.date,sportOf(s.sport).club,s.title||'',e.guest?e.guest+' (guest of '+nameOf(e.uid,e.key)+')':nameOf(e.uid,e.key),allKeys()[e.key]||'',status,(e.at||'').replace('T',' ').slice(0,16),(e.out||'').replace('T',' ').slice(0,16),fee?fee.label:'',fee?fee.amount:'',gamesFor(sid,e.guest?gpid(e.uid,e.guest):e.uid),e.guest?'Host pays':PAY[S.bookings[e.uid]?.s?.[sid]?.pay||'cash'].label,e.guest?'':(S.payments[sid]?.[e.uid]?.ok?'Yes':S.bookings[e.uid]?.s?.[sid]?.sent?'Sent':'No')];
    r.in.forEach(e=>signups.push(row(e,'In')));r.wait.forEach((e,i)=>signups.push(row(e,'Waitlist #'+(i+1))));r.late.forEach(e=>signups.push(row(e,'Dropped late',e.fee)))}
  const ns=Object.values(S.noshows).filter(n=>(n.dates||[]).length).map(n=>{const ds=n.dates.map(d=>{const [sd,g]=d.split('#');return (S.sessions[sd]?.date||sd)+(g?' (guest)':'')}).sort();return[n.name||n.player,ds.length,ds.join(', '),ds[ds.length-1]]});
  const pad=(rows,w,min)=>{const out=rows.slice();while(out.length<min)out.push(Array(w).fill(''));return out};
  try{
    await S.mcp.callTool('Google Sheets','update_values',{spreadsheetId:SIGNUP_SHEET,range:`Players!A2:T${Math.max(players.length,200)+1}`,values:pad(players,20,200)});
    await S.mcp.callTool('Google Sheets','update_values',{spreadsheetId:SIGNUP_SHEET,range:`'Session Sign-ups'!A2:M${Math.max(signups.length,500)+1}`,values:pad(signups,13,500)});
    await S.mcp.callTool('Google Sheets','update_values',{spreadsheetId:SIGNUP_SHEET,range:`'No-shows'!A2:D${Math.max(ns.length,100)+1}`,values:pad(ns,4,100)});
    const games=Object.entries(S.games).sort((x,y)=>(x[1].at||'').localeCompare(y[1].at||'')).map(([gid,g])=>{const s=S.sessions[g.sid]||{},sc=scoreOf(gid,g),nm=p=>(g.names&&g.names[p])||who(g.sid,p).name;return[s.date||'',sportOf(g.sport).club,s.title||'',g.court||'',g.a.map(nm).join(' & '),g.b.map(nm).join(' & '),sc?sc.s[0]:'',sc?sc.s[1]:'',sc?sc.st:'',(g.at||'').replace('T',' ').slice(0,16)]});
    await S.mcp.callTool('Google Sheets','update_values',{spreadsheetId:SIGNUP_SHEET,range:`Games!A2:J${Math.max(games.length,1000)+1}`,values:pad(games,10,1000)});
    st.textContent=`Sheet updated: ${players.length} players, ${signups.length} session sign-ups, ${games.length} games, ${ns.length} on the no-show list.`;
  }catch(e){st.textContent=mcpErr(e)}
  btn.disabled=false;
}

/* ---------- club referral codes ---------- */
function codesPanel(){const L=S.codes||{},used=c=>Object.values(S.profiles).filter(p=>normCode(p.referredBy)===c).length;
  return `<div class="panel"><h3 class="ah">Club codes</h3>
  <p class="hint">Codes from BAD for people who weren’t invited by a member: events, posters, Instagram, partners. New players type it in Referral code when they sign up.</p>
  <div class="list">${Object.entries(L).sort().map(([c,a])=>`<div class="li" style="grid-template-columns:minmax(0,1fr) auto auto"><div><div class="nm num">${esc(c)}${a.off?' <span class="tagl">Ended</span>':''}</div><div class="sub">${esc(a.label||'')} · +${+a.pts||CFG.referee} points · used ${used(c)}</div></div>
    <button class="btn ghost sm" data-coff="${esc(c)}">${a.off?'Turn on':'End'}</button><button class="btn ghost sm" data-cdel="${esc(c)}" aria-label="Delete ${esc(c)}">Delete</button></div>`).join('')||'<div class="empty">No club codes yet.</div>'}</div>
  <div class="row" style="margin-top:12px;align-items:flex-end">
    <div class="field" style="flex:1;min-width:140px;margin:0"><label for="cc-code">Code</label><input type="text" id="cc-code" placeholder="THEBADCLUB" maxlength="12" style="text-transform:uppercase"></div>
    <div class="field" style="flex:2;min-width:160px;margin:0"><label for="cc-label">What it’s for</label><input type="text" id="cc-label" placeholder="BADoween poster"></div>
    <div class="field" style="width:90px;margin:0"><label for="cc-pts">Points</label><input type="number" id="cc-pts" min="0" max="100" value="${CFG.referee}"></div>
    <button class="btn" id="cc-add">Add code</button></div></div>`}
async function saveCodes(L){try{await S.db.doc('config/codes').set({list:L});S.codes=L;render()}catch(e){toast('Sorry, that didn’t save.')}}
function bindCodes(){
  const add=$('cc-add');if(!add)return;
  add.onclick=()=>{const c=$('cc-code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length<3){toast('Codes need at least 3 letters or numbers.');return}
    if(Object.values(S.profiles).some(p=>refsOf(p).some(r=>normCode(r)===c))){toast('A member already uses that code. Please pick another.');return}
    (async()=>{if(S.db.runTransaction){try{const d=await S.db.doc('refcodes/'+c).get();if(d.exists&&d.data().uid!=='club'){toast('A member already uses that code. Please pick another.');return}await S.db.doc('refcodes/'+c).set({uid:'club',code:c,at:new Date().toISOString()})}catch(_){}}
    saveCodes({...S.codes,[c]:{label:$('cc-label').value.trim()||'BAD club code',pts:Math.max(0,Math.min(100,+$('cc-pts').value||0)),at:new Date().toISOString()}}).then(()=>toast(c+' is ready to share.'))})()};
  document.querySelectorAll('[data-coff]').forEach(b=>b.onclick=()=>{const c=b.dataset.coff,L={...S.codes};L[c]={...L[c],off:!L[c].off};saveCodes(L)});
  document.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{const c=b.dataset.cdel,L={...S.codes};delete L[c];saveCodes(L)});
}

function memPending(){return Object.entries(S.profiles).filter(([,p])=>!p.sample).map(([uid,p])=>[uid,p,memStatus(uid)]).filter(([,,m])=>m.state==='pending').sort((a,b)=>String(a[2].at||'').localeCompare(String(b[2].at||'')))}

/* ---------- brand: official BAD logos (BAD ASSETS folder, files 03 white / 04 black) built in; brand fonts by upload ---------- */
function applyBrand(){
  const b=S.brand||{};
  const hdr=document.querySelector('.wordmark');
  if(hdr&&!hdr.dataset.done){hdr.dataset.done='1';hdr.innerHTML=`<img class="logo-l" src="${LOGO.badK}" alt="BAD"><img class="logo-d" src="${LOGO.badW}" alt="BAD">`}
  let st=$('brand-fonts');if(!st){st=document.createElement('style');st.id='brand-fonts';document.head.appendChild(st)}
  st.textContent=(b.sans?`@font-face{font-family:"BAD Sans";src:url("${b.sans}");font-display:swap}`:'')+(b.serif?`@font-face{font-family:"BAD Display";src:url("${b.serif}");font-display:swap}`:'')+
    `:root{--f-sans:${b.sans?'"BAD Sans",':''}"Aktiv Grotesk","Inter Tight","Helvetica Neue",Arial,sans-serif;--f-serif:${b.serif?'"BAD Display",':''}"IvyPresto Display","Instrument Serif",Didot,Georgia,serif}`;
}
applyBrand();

function brandPanel(){
  const b=S.brand||{};
  const sw=(src,bg,label)=>`<figure style="margin:0;display:grid;gap:6px"><div style="aspect-ratio:3/2;display:grid;place-items:center;background:${bg};border:1px solid var(--line);border-radius:var(--r)"><img src="${src}" alt="${label}" style="max-width:70%;max-height:60%"></div><figcaption class="fine">${label}</figcaption></figure>`;
  return `<div class="panel"><h3 class="ah">Brand</h3>
    <p class="muted">The official BAD logos from the ASSETS folder are built into the app: the black BAD wordmark on light screens and cards, the white one on dark screens and On-Court cards.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px">${sw(LOGO.badK,'#fff','BAD · black (04)')}${sw(LOGO.badW,'#000','BAD · white (03)')}${sw(LOGO.clubK,'#fff','The BAD Club · black (02)')}${sw(LOGO.clubW,'#000','The BAD Club · white (01)')}</div>
    <span class="label">Brand fonts</span>
    <p class="fine">Aktiv Grotesk and IvyPresto Display aren't in Drive yet. Upload the .woff2, .otf or .ttf files and every screen switches over.</p>
    <div class="row"><button class="btn ghost sm" data-font="sans">${b.sans?'Replace':'Upload'} Aktiv Grotesk</button><button class="btn ghost sm" data-font="serif">${b.serif?'Replace':'Upload'} IvyPresto Display</button><span class="hint" id="brand-status"></span></div>
    <input type="file" id="font-in" accept=".woff2,.woff,.otf,.ttf,font/*" hidden></div>`;
}
let fontRole=null;
function bindBrand(){
  const st=$('brand-status');
  document.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>{fontRole=b.dataset.font;$('font-in').click()});
  $('font-in').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!S.assets)return;st.textContent='Uploading font…';
    try{const up=await S.assets.upload(f);await S.db.doc('config/brand').set({...(S.brand||{}),[fontRole]:up.url});st.textContent='Font is live.'}catch(err){st.textContent="Sorry, that font didn't upload. Please try .woff2 or .otf."}};
}

/* ---------- boot ---------- */
S.contacts={};S.brand={};
(async function boot(){
  render();
  const C=window.claude;if(!C||!C.use){S.loaded=true;render();return}
  const [db,user]=await Promise.all([C.use('db'),C.use('user')]);
  S.db=db;if(user){S.uid=await user.id();S.canEdit=await user.canEdit()}
  if(S.uid&&db)db.doc('contacts/'+S.uid).get().then(d=>{if(d.exists)S.myContact=d.data()}).catch(()=>{});
  if(S.canEdit&&innerWidth>=1000&&S.view==='card'&&!S.pendingCI)setView('admin');
  if(S.canEdit){C.use('mcp').then(m=>{S.mcp=m});C.use('assets').then(a=>{S.assets=a})}
  if(!db){S.loaded=true;render();return}
  let pending=10;
  const done=()=>{if(pending>0&&--pending===0){S.loaded=true;seedWeb();fixups();fixups2();if(S.canEdit&&window.BAD_WEB)setTimeout(()=>removeSamples(true),2500);if(S.canEdit)setTimeout(()=>awardApp(true),1500)}render();if(S.loaded){processCheckin();if(S.canEdit)syncCheckins()}};
  /* hosted version: first admin sign-in on an empty database loads the starter sessions, posts and sample players */
  /* one-off content fixes, applied once by an admin's app */
  async function fixups(){if(!S.canEdit)return;const b=S.posts['badoween-2026'];
    if(b&&b.link!=='https://bad-o-ween.thebadclub-co.workers.dev/')try{await db.doc('posts/badoween-2026').update({link:'https://bad-o-ween.thebadclub-co.workers.dev/',linkLabel:'Event site',mapLink:b.mapLink||(String(b.link||'').includes('maps')?b.link:'https://maps.app.goo.gl/LFCfLBWaK19X63vY9')})}catch(e){console.warn(e)}}
  async function fixups2(){if(!S.canEdit)return;const a=S.posts['app-live'];if(a&&/every BAD club/.test(a.body||''))try{await db.doc('posts/app-live').update({body:a.body.replace('every BAD club','every BADDIE')})}catch(_){}}
  async function seedWeb(){if(!window.BAD_WEB||!S.canEdit||Object.keys(S.sessions||{}).length)return;
    try{const seed=await (await fetch('seed.json',{cache:'no-store'})).json();
      for(const [c,docs] of Object.entries(seed))for(const [id,d] of Object.entries(docs))await db.doc(c+'/'+id).set(d);
      toast('Starter sessions and sample players are in.')}catch(e){console.warn('seed',e)}}
  const col=(path,fn)=>db.collection(path).onSnapshot(s=>{fn(s);done()},()=>done());
  const map=s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());return o};
  col('profiles',s=>S.profiles=map(s));
  col('ledger',s=>S.ledger=s.docs.map(d=>({...d.data(),_id:d.id})));
  col('requests',s=>S.requests=map(s));
  col('sessions',s=>S.sessions=map(s));
  col('bookings',s=>S.bookings=map(s));
  col('posts',s=>S.posts=map(s));
  col('live',s=>S.live=map(s));
  col('games',s=>S.games=map(s));
  col('scores',s=>S.scores=map(s));
  if(S.uid)db.doc('checkins/'+S.uid).onSnapshot(d=>{S.myCI=d.exists?d.data():{};render()},()=>{});
  db.doc('config/codes').onSnapshot(d=>{S.codes=d.exists?(d.data().list||{}):{};render()},()=>{});
  db.doc('config/membership').onSnapshot(d=>{S.memCfg=d.exists?d.data():{};render()},()=>{});
  db.doc('config/members').onSnapshot(d=>{S.members=d.exists?d.data():{};render()},()=>{});
  db.doc('config/site').onSnapshot(d=>{S.site=d.exists?d.data():{};render()},()=>{});
  db.doc('config/payments').onSnapshot(d=>{S.payCfg=d.exists?d.data():{};render()},()=>{});
  db.collection('payments').onSnapshot(s=>{S.payments=map(s);render()},()=>{});
  db.doc('config/brand').onSnapshot(d=>{S.brand=d.exists?d.data():{};applyBrand();done()},()=>done());
  if(S.canEdit){
    db.collection('contacts').onSnapshot(s=>{S.contacts=map(s);if(S.view==='admin')render()},()=>{});
    db.collection('checkins').onSnapshot(s=>{S.checkins=map(s);syncCheckins()},()=>{});
    db.collection('qr').onSnapshot(s=>{S.qr=map(s);syncCheckins()},()=>{});
    db.collection('levels').onSnapshot(s=>{S.levels=map(s);render()},()=>{});
    if(window.BAD_WEB)db.collection('admins').onSnapshot(s=>{S.admins=map(s);if(S.view==='admin')render()},()=>{});
    db.collection('noshows').onSnapshot(s=>{S.noshows=map(s);if(S.view==='admin')render()},()=>{});
  }
})();
