<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0b0b">
<title>BAD Empire</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0b0b;overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#wrap{position:fixed;inset:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#tags,#hud{position:absolute;inset:0;pointer-events:none}
.pill{background:rgba(11,11,11,.86);border-radius:999px;padding:8px 11px;font-size:11px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
#ctl{position:absolute;left:12px;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#menu{display:none;grid-template-columns:repeat(2,44px);gap:8px}
#ctl.open #menu{display:grid;animation:rise .25s ease both}
#ctl.open #more{background:#f3eee4;color:#0b0b0b}
@media (hover:hover) and (min-width:900px){#menu{display:grid}#more{display:none!important}}
#you.pill,#clock.pill{background:none;padding:0;font-size:9.5px;letter-spacing:.14em;text-shadow:0 1px 6px rgba(0,0,0,.85);opacity:.9}
#you{top:calc(54px + env(safe-area-inset-top))!important;left:16px!important}
#clock{top:calc(54px + env(safe-area-inset-top))!important;right:auto!important;left:auto;text-align:left!important}
#ctl button{width:44px;height:44px;padding:0;border-radius:12px;background:rgba(11,11,11,.84);border:0.5px solid rgba(255,255,255,.35);color:#fff;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;font:700 20px/1 "Helvetica Neue",Helvetica,Arial,sans-serif}
#ctl button:active{transform:scale(.95)}
#ctl svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tg{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:10px;font-weight:700;letter-spacing:.1em;border-radius:8px;padding:6px 10px;display:flex;gap:6px;align-items:center;background:rgba(11,11,11,.86);color:#fff;pointer-events:auto;cursor:pointer;border:0.5px solid rgba(255,255,255,.3)}
.tg.d{background:#f3eee4;color:#0b0b0b;border-color:#f3eee4;font-size:11px}
.ring{position:absolute;transform:translate(-50%,-100%)}
#hint{transition:opacity .6s}
#bar{pointer-events:auto;cursor:pointer}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;background:rgba(11,11,11,.985);border-top:0.5px solid rgba(255,255,255,.3);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto;transform:translateY(105%);transition:transform .35s ease;z-index:4;max-width:640px;margin:0 auto;text-transform:uppercase}
#sheet.on{transform:none}
#sheet h3{margin:0;font-size:18px;letter-spacing:.06em}
#sheet .lbl{font-size:9px;letter-spacing:.16em;color:#969696;font-weight:700}
#sheet input,#sheet select{width:100%;background:#141414;border:1px solid #2c2c2c;border-radius:10px;color:#fff;padding:11px 12px;font:700 13px/1.2 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase}
#sheet .row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px;margin-top:8px}
.b{border:1px solid #3a3a3a;border-radius:999px;background:transparent;color:#fff;padding:8px 12px;font:700 10px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.1em;cursor:pointer;text-transform:uppercase}
.b.w{background:#f3eee4;color:#0b0b0b;border-color:#f3eee4}
.q{border:1px solid #2c2c2c;border-radius:14px;padding:10px 12px;margin-top:8px;display:grid;gap:7px}
.q.active{border-color:#fff}.q.done{opacity:.55}
.q .t{font-size:13px;font-weight:700;letter-spacing:.04em;line-height:1.3}
.q .m{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #444;border-radius:999px;padding:3px 8px;font-size:9px;font-weight:700;letter-spacing:.1em;color:#ddd}
.q .a{display:flex;gap:6px;flex-wrap:wrap}
.sec{margin-top:16px;display:flex;justify-content:space-between}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:6;pointer-events:none}
#toast div{background:#f3eee4;color:#0b0b0b;border-radius:14px;padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;max-width:88vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#you{position:absolute;left:12px;top:calc(56px + env(safe-area-inset-top))}
#clock{position:absolute;right:12px;top:calc(56px + env(safe-area-inset-top));text-align:right}
#clock .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:6px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
#tour{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,520px);background:rgba(11,11,11,.94);border:0.5px solid rgba(255,255,255,.35);border-radius:16px;padding:14px 16px;z-index:5;display:none;pointer-events:auto;text-transform:uppercase}
#tour.on{display:block}
#tour .tt{font-size:15px;font-weight:700;letter-spacing:.06em;line-height:1.3;margin:4px 0 12px}
#dHead{display:none;margin-top:12px;border:1px solid #2c2c2c;border-radius:14px;padding:12px}
#dHead .bar{height:4px;background:#222;border-radius:4px;overflow:hidden;margin:8px 0}
#dHead .bar i{display:block;height:100%;background:#f3eee4}
#lvl{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:6;opacity:0;text-transform:uppercase}
#lvl.on{animation:lvl 2.8s cubic-bezier(.2,1.4,.4,1) both}
#lvl .k{font-size:12px;letter-spacing:.4em;font-weight:700;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#lvl .n{white-space:nowrap;font-size:clamp(24px,7.4vw,60px);font-weight:900;letter-spacing:.02em;line-height:1;margin:8px 0;background:linear-gradient(180deg,#fff 0%,#cfd3d8 38%,#7d8288 52%,#f4f4f4 70%,#9aa0a6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(0,0,0,.55))}
#lvl .u{display:inline-block;font-size:11px;letter-spacing:.14em;font-weight:700;background:rgba(11,11,11,.9);color:#fff;border-radius:999px;padding:7px 14px}
@keyframes lvl{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}82%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#dHead{animation:rise .45s ease both}
#toast>div{animation:rise .3s ease both}
#loading{position:fixed;inset:0;background:#0b0b0b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s;z-index:5}
#loading img{height:40px}
#loading span{font-size:10px;letter-spacing:.2em;color:#969696;font-weight:700}
</style>
</head>
