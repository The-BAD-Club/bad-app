name: Firestore rules tests
on:
  push:
    paths: ['firestore.rules', 'tests/**', '.github/workflows/rules.yml']
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
        working-directory: tests
      - run: tests/node_modules/.bin/firebase emulators:exec --only firestore --project demo-bad-app "bash tests/ci.sh"
        working-directory: .
        env: { PATH_PREFIX: tests/node_modules/.bin }
